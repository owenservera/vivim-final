[package]
name = "vivim-desktop"
version = "1.3.15"
description = "vivim desktop shell — Tauri v2 wrapper around the Bun backend sidecar"
authors = ["vivim"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vivim_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
