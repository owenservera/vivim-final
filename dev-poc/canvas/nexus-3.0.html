<script>

/* ============================================================
   NEXUS 2.0 — Reactive Store
   ============================================================ */
NEXUS.Store = (function() {
  const _data = {};
  const _subs = {};
  function set(key, value) {
    const old = _data[key];
    _data[key] = value;
    (_subs[key] || []).forEach(fn => { try { fn(value, old); } catch(e) { console.error('[Store]', e); } });
    NEXUS.EventBus.emit('store:change', { key, value, old });
    NEXUS.DevTools?.log('store', `set ${key} = ${JSON.stringify(value).slice(0,60)}`);
  }
  function get(key) { return _data[key]; }
  function subscribe(key, fn) {
    if (!_subs[key]) _subs[key] = [];
    _subs[key].push(fn);
    return () => { _subs[key] = _subs[key].filter(f => f !== fn); };
  }
  function keys() { return Object.keys(_data); }
  function all() { return { ..._data }; }
  function remove(key) { delete _data[key]; delete _subs[key]; NEXUS.EventBus.emit('store:change', { key, value: undefined, old: _data[key] }); }
  function clear() { Object.keys(_data).forEach(k => delete _data[k]); }
  return { set, get, subscribe, keys, all, remove, clear };
})();

/* ============================================================
   NEXUS 2.0 — Event Bus
   ============================================================ */
NEXUS.EventBus = (function() {
  const _handlers = {};
  const _history = [];
  const MAX_HISTORY = 50;
  function on(event, handler) {
    if (!_handlers[event]) _handlers[event] = [];
    _handlers[event].push(handler);
    return () => off(event, handler);
  }
  function off(event, handler) {
    if (!_handlers[event]) return;
    _handlers[event] = _handlers[event].filter(h => h !== handler);
  }
  function emit(event, data) {
    _history.unshift({ event, data, ts: Date.now() });
    if (_history.length > MAX_HISTORY) _history.length = MAX_HISTORY;
    NEXUS.DevTools?.log('event', `${event} ${JSON.stringify(data || {}).slice(0,80)}`);
    (_handlers[event] || []).forEach(fn => { try { fn(data); } catch(e) { console.error('[EventBus]', e); } });
  }
  function history() { return [..._history]; }
  return { on, off, emit, history };
})();

/* ============================================================
   NEXUS 2.0 — Undo/Redo Manager
   ============================================================ */
NEXUS.UndoManager = (function() {
  const _stack = [];
  const _redoStack = [];
  const MAX = 50;
  function push(action) {
    _stack.push({ ...action, ts: Date.now() });
    if (_stack.length > MAX) _stack.shift();
    _redoStack.length = 0;
  }
  function undo() {
    const a = _stack.pop();
    if (!a) return false;
    if (a.undo) a.undo();
    _redoStack.push(a);
    NEXUS.EventBus.emit('undo', a);
    NEXUS.DevTools?.log('system', 'undo');
    return true;
  }
  function redo() {
    const a = _redoStack.pop();
    if (!a) return false;
    if (a.redo) a.redo();
    _stack.push(a);
    NEXUS.EventBus.emit('redo', a);
    NEXUS.DevTools?.log('system', 'redo');
    return true;
  }
  return { push, undo, redo, get canUndo() { return _stack.length > 0; }, get canRedo() { return _redoStack.length > 0; } };
})();

/* ============================================================
   NEXUS 2.0 — Connection Manager
   ============================================================ */
NEXUS.ConnectionManager = (function() {
  const _connections = [];
  let _connecting = null; // { sourceNodeId, startX, startY }

  function startConnect(nodeId, x, y) {
    _connecting = { sourceNodeId: nodeId, startX: x, startY: y };
    NEXUS.DevTools?.log('connect', `start from ${nodeId}`);
  }

  function completeConnect(targetNodeId) {
    if (!_connecting || _connecting.sourceNodeId === targetNodeId) { _connecting = null; return null; }
    const conn = {
      id: `conn-${Date.now()}`,
      sourceNodeId: _connecting.sourceNodeId,
      targetNodeId: targetNodeId,
      dataType: 'any',
      createdAt: Date.now(),
    };
    _connections.push(conn);
    _connecting = null;
    renderConnections();
    NEXUS.EventBus.emit('connection:created', conn);
    NEXUS.DevTools?.log('connect', `connected ${conn.sourceNodeId} → ${conn.targetNodeId}`);
    return conn;
  }

  function cancelConnect() { _connecting = null; renderConnections(); }

  function removeConnection(connId) {
    const idx = _connections.findIndex(c => c.id === connId);
    if (idx >= 0) { const c = _connections.splice(idx, 1)[0]; renderConnections(); NEXUS.EventBus.emit('connection:removed', c); return c; }
    return null;
  }

  function getByNode(nodeId) { return _connections.filter(c => c.sourceNodeId === nodeId || c.targetNodeId === nodeId); }
  function all() { return [..._connections]; }

  function renderConnections() {
    const svg = document.getElementById('connections-svg');
    if (!svg) return;
    const overlay = document.getElementById('canvas-overlay');
    const view = NEXUS.Canvas3D.getView();
    const rect = overlay.parentElement.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    let html = '<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="conn-arrow"/></marker></defs>';

    _connections.forEach(c => {
      const sEl = document.getElementById(`node-${c.sourceNodeId}`);
      const tEl = document.getElementById(`node-${c.targetNodeId}`);
      if (!sEl || !tEl) return;
      const sx = parseFloat(sEl.style.left) + parseFloat(sEl.style.width) / 2;
      const sy = parseFloat(sEl.style.top) + parseFloat(sEl.style.height) / 2;
      const tx = parseFloat(tEl.style.left) + parseFloat(tEl.style.width) / 2;
      const ty = parseFloat(tEl.style.top) + parseFloat(tEl.style.height) / 2;
      const mx = (sx + tx) / 2;
      const my = (sy + ty) / 2 - 40;
      html += `<path class="conn-line" d="M${sx},${sy} Q${mx},${my} ${tx},${ty}" marker-end="url(#arrowhead)" data-conn-id="${c.id}" style="pointer-events:stroke;" />`;
    });

    // Temp connection line
    if (_connecting) {
      // Draw a small dot at source
      const sEl = document.getElementById(`node-${_connecting.sourceNodeId}`);
      if (sEl) {
        const sx = parseFloat(sEl.style.left) + parseFloat(sEl.style.width) / 2;
        const sy = parseFloat(sEl.style.top) + parseFloat(sEl.style.height) / 2;
        html += `<circle cx="${sx}" cy="${sy}" r="5" fill="var(--warn)" opacity="0.8"><animate attributeName="r" values="4;7;4" dur="1s" repeatCount="indefinite"/></circle>`;
      }
    }

    svg.innerHTML = html;

    // Bind click on lines to delete
    svg.querySelectorAll('.conn-line[data-conn-id]').forEach(p => {
      p.style.pointerEvents = 'stroke';
      p.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('Delete this connection?')) removeConnection(p.dataset.connId);
      });
    });
  }

  function getConnecting() { return _connecting; }

  return { startConnect, completeConnect, cancelConnect, removeConnection, getByNode, all, renderConnections, getConnecting };
})();

/* ============================================================
   NEXUS 2.0 — DevTools
   ============================================================ */
NEXUS.DevTools = (function() {
  const _logs = [];
  const MAX_LOGS = 200;
  const _events = [];
  const MAX_EVENTS = 200;
  let _fpsFrames = 0, _fpsLast = performance.now(), _fps = 0;
  let _open = false;
  let _activeTab = 'console';

  function log(level, msg, src) {
    _logs.unshift({ level, msg: String(msg), src: src || '', ts: Date.now() });
    if (_logs.length > MAX_LOGS) _logs.length = MAX_LOGS;
    if (_open && _activeTab === 'console') renderConsole();
  }

  function logEvent(name, data) {
    _events.unshift({ name, data: JSON.stringify(data || {}).slice(0, 120), ts: Date.now() });
    if (_events.length > MAX_EVENTS) _events.length = MAX_EVENTS;
    if (_open && _activeTab === 'events') renderEvents();
  }

  function toggle() {
    _open = !_open;
    document.getElementById('devtools-panel')?.classList.toggle('open', _open);
    if (_open) render();
  }

  function render() {
    if (_activeTab === 'console') renderConsole();
    else if (_activeTab === 'state') renderState();
    else if (_activeTab === 'events') renderEvents();
    else if (_activeTab === 'perf') renderPerf();
  }

  function renderConsole() {
    const body = document.getElementById('dt-body');
    if (!body) return;
    const filter = (document.getElementById('dt-filter')?.value || '').toLowerCase();
    const logs = filter ? _logs.filter(l => l.msg.toLowerCase().includes(filter) || l.level.includes(filter)) : _logs;
    body.innerHTML = logs.map(l => {
      const t = new Date(l.ts);
      const ts = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}:${t.getSeconds().toString().padStart(2,'0')}.${t.getMilliseconds().toString().padStart(3,'0')}`;
      return `<div class="dt-log-entry"><span class="dt-time">${ts}</span><span class="dt-level ${l.level}">${l.level}</span><span class="dt-msg">${escHtml(l.msg)}</span>${l.src ? `<span class="dt-src">${escHtml(l.src)}</span>` : ''}</div>`;
    }).join('');
    body.scrollTop = 0;
  }

  function renderState() {
    const body = document.getElementById('dt-body');
    if (!body) return;
    const state = {
      'NEXUS.Store': NEXUS.Store.all(),
      'Workspace': (() => { const ws = NEXUS.WorkspaceManager.getActive(); return ws ? { name: ws.name, nodes: ws.nodes.length, layers: ws.zLayers.length } : null; })(),
      'Registry': { components: NEXUS.ComponentRegistry.count, plugins: NEXUS.ComponentRegistry.pluginCount, categories: NEXUS.ComponentRegistry.categories().length },
      'Theme': document.documentElement.getAttribute('data-theme'),
      'Connections': NEXUS.ConnectionManager.all().length,
      'Viewport': NEXUS.Canvas3D.getView(),
    };
    body.innerHTML = '<div class="dt-state-tree">' + renderObj(state, '') + '</div>';
  }

  function renderObj(obj, indent) {
    if (obj === null || obj === undefined) return '<span class="dt-val">null</span>';
    if (typeof obj !== 'object') return `<span class="dt-val">${escHtml(String(obj))}</span>`;
    if (Array.isArray(obj)) return `<span class="dt-val">[${obj.length} items]</span>`;
    return Object.entries(obj).map(([k, v]) => {
      if (typeof v === 'object' && v !== null) {
        return `<div><span class="dt-key">${escHtml(k)}</span>: ${typeof v === 'object' && v !== null && !Array.isArray(v) ? '' : `<span class="dt-val">${JSON.stringify(v).slice(0,80)}</span>`}</div><div class="dt-obj">${renderObj(v, indent + '  ')}</div>`;
      }
      return `<div><span class="dt-key">${escHtml(k)}</span>: <span class="dt-val">${escHtml(String(v))}</span></div>`;
    }).join('');
  }

  function renderEvents() {
    const body = document.getElementById('dt-body');
    if (!body) return;
    const filter = (document.getElementById('dt-filter')?.value || '').toLowerCase();
    const evts = filter ? _events.filter(e => e.name.toLowerCase().includes(filter)) : _events;
    // Merge EventBus history
    const all = [...evts, ...NEXUS.EventBus.history().slice(0, 50).map(e => ({ name: e.event, data: JSON.stringify(e.data || {}).slice(0, 120), ts: e.ts }))];
    all.sort((a, b) => b.ts - a.ts);
    body.innerHTML = all.slice(0, 100).map(e => {
      const t = new Date(e.ts);
      const ts = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}:${t.getSeconds().toString().padStart(2,'0')}`;
      return `<div class="dt-event-entry"><span style="color:var(--fg-3);min-width:60px;">${ts}</span><span class="dt-ev-name">${escHtml(e.name)}</span><span class="dt-ev-data">${escHtml(e.data)}</span></div>`;
    }).join('');
  }

  function renderPerf() {
    const body = document.getElementById('dt-body');
    if (!body) return;
    const ws = NEXUS.WorkspaceManager.getActive();
    body.innerHTML = `<div class="dt-perf-grid">
      <div class="dt-perf-card"><div class="dt-perf-val" id="dt-fps">${_fps}</div><div class="dt-perf-label">FPS</div></div>
      <div class="dt-perf-card"><div class="dt-perf-val">${ws ? ws.nodes.length : 0}</div><div class="dt-perf-label">Nodes</div></div>
      <div class="dt-perf-card"><div class="dt-perf-val">${NEXUS.ComponentRegistry.count}</div><div class="dt-perf-label">Components</div></div>
      <div class="dt-perf-card"><div class="dt-perf-val">${NEXUS.ConnectionManager.all().length}</div><div class="dt-perf-label">Connections</div></div>
    </div>`;
  }

  function tickFPS() {
    _fpsFrames++;
    const now = performance.now();
    if (now - _fpsLast >= 1000) {
      _fps = _fpsFrames;
      _fpsFrames = 0;
      _fpsLast = now;
      if (_open && _activeTab === 'perf') renderPerf();
    }
    requestAnimationFrame(tickFPS);
  }

  function setActiveTab(tab) { _activeTab = tab; render(); }
  function clearLogs() { _logs.length = 0; _events.length = 0; render(); }
  function isOpen() { return _open; }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Hook into console
  const _origLog = console.log;
  const _origWarn = console.warn;
  const _origError = console.error;
  console.log = function(...args) { _origLog.apply(console, args); log('log', args.join(' '), 'console'); };
  console.warn = function(...args) { _origWarn.apply(console, args); log('warn', args.join(' '), 'console'); };
  console.error = function(...args) { _origError.apply(console, args); log('error', args.join(' '), 'console'); };

  requestAnimationFrame(tickFPS);
  return { log, logEvent, toggle, render, setActiveTab, clearLogs, isOpen, escHtml };
})();

NEXUS.ComponentGenerator = (function() {

    'tab-set': { name: 'Tab Set', code: `exports.default = {\n  id: 'my-tabs',\n  name: 'Tab Set',\n  category: 'Custom',\n  tags: ['custom','navigation'],\n  defaultProps: { tabs: 'Overview,Details,Settings', active: 0, content: 'Tab content area' },\n  schema: { properties: { tabs: { type: 'string' }, active: { type: 'number' }, content: { type: 'string' } } },\n  render: (p) => {\n    const tabs = p.tabs.split(',');\n    return \`<div style="height:100%;display:flex;flex-direction:column;">\n      <div style="display:flex;border-bottom:1px solid var(--border-0);">\n        \${tabs.map((t,i) => \`<div style="padding:8px 16px;font-size:12px;cursor:pointer;color:\${i===p.active?'var(--accent)':'var(--fg-2)'};border-bottom:2px solid \${i===p.active?'var(--accent)':'transparent'};font-weight:\${i===p.active?'600':'400'};">\${t.trim()}</div>\`).join('')}\n      </div>\n      <div style="flex:1;padding:12px;font-size:13px;color:var(--fg-1);">\${p.content}</div>\n    </div>\`;\n  },\n};` },
    'accordion': { name: 'Accordion', code: `exports.default = {\n  id: 'my-accordion',\n  name: 'Accordion',\n  category: 'Custom',\n  tags: ['custom','layout'],\n  defaultProps: { items: 'What is NEXUS?,A canvas shell for AI WebApps,How do plugins work?,They hot-swap at runtime' },\n  schema: { properties: { items: { type: 'string' } } },\n  render: (p) => {\n    const items = p.items.split(',');\n    const pairs = [];\n    for (let i = 0; i < items.length; i += 2) pairs.push([items[i], items[i+1] || '']);\n    return \`<div style="padding:4px;">\${pairs.map(([q,a],i) => \`<div style="border-bottom:1px solid var(--border-0);">\n  <div style="padding:8px 12px;font-size:12px;font-weight:500;color:var(--fg-0);display:flex;justify-content:space-between;cursor:pointer;">\${q}<span style="color:var(--fg-3);">\${i===0?'▾':'▸'}</span></div>\n  \${i===0?\`<div style="padding:0 12px 8px;font-size:11px;color:var(--fg-2);">\${a}</div>\`:''}\n</div>\`).join('')}</div>\`;\n  },\n};` },

  };

  function getTemplateNames() { return Object.keys(TEMPLATES); }
  function getTemplate(name) { return TEMPLATES[name]; }
  function getTemplateCode(name) { return TEMPLATES[name]?.code || ''; }

  function parseAndRegister(code) {
    try {
      const fn = new Function('NEXUS', 'exports', code);
      const exp = {};
      fn(NEXUS, exp);
      const comp = exp.default || exp.plugin || exp;
      if (!comp || !comp.id) throw new Error('Component must have an id');
      if (!comp.render) throw new Error('Component must have a render function');
      if (!comp.category) comp.category = 'Custom';
      if (!comp.defaultProps) comp.defaultProps = {};
      if (!comp.schema) comp.schema = {};
      if (!comp.tags) comp.tags = ['custom'];
      // Check if already exists — version it
      const existing = NEXUS.ComponentRegistry.get(comp.id);
      if (existing) {
        NEXUS.ComponentRegistry._versions = NEXUS.ComponentRegistry._versions || {};
        if (!NEXUS.ComponentRegistry._versions[comp.id]) NEXUS.ComponentRegistry._versions[comp.id] = [];
        NEXUS.ComponentRegistry._versions[comp.id].push({
          version: NEXUS.ComponentRegistry._versions[comp.id].length + 1,
          code: code,
          props: existing.defaultProps ? JSON.stringify(existing.defaultProps) : '{}',
          ts: Date.now(),
        });
      }
      NEXUS.ComponentRegistry.register(comp);
      NEXUS.EventBus.emit('component:registered', { id: comp.id, name: comp.name });
      return { ok: true, comp };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  return { TEMPLATES, getTemplateNames, getTemplate, getTemplateCode, parseAndRegister };
})();

      icon: 'terminal', color: '#fbbf24', installed: false,
    },
    {
      id: 'nexus-media', name: 'Media Components', version: '1.0.0',
      description: '6 media components: gallery, audio player, video, file upload, color palette, gradient editor',
      icon: 'image', color: '#f43f5e', installed: false,
    },
  ];

  function available() { return _available; }
  function installed() { return NEXUS.ComponentRegistry.plugins; }
  function isInstalled(id) { return _available.find(p => p.id === id)?.installed || NEXUS.ComponentRegistry.plugins.some(p => p.id === id); }

  async function install(pluginId) {
    const def = _available.find(p => p.id === pluginId);
    if (!def) throw new Error('Plugin not found: ' + pluginId);
    if (def.installed) throw new Error('Already installed');

    // Simulate install delay
    NEXUS.EventBus.emit('plugin:installing', { id: pluginId });
    await new Promise(r => setTimeout(r, 400 + Math.random() * 400));

    // Load the plugin pack
    const pack = NEXUS.PluginPacks[pluginId];
    if (pack) {
      NEXUS.PluginLoader.loadFromObject(pack);
      def.installed = true;
      NEXUS.EventBus.emit('plugin:installed', { id: pluginId });
      NEXUS.DevTools?.log('plugin', `installed ${pluginId}`);
      NEXUS.Shell?.refreshAll();
      NEXUS.Toast.show({ title: 'Plugin installed', message: def.name, type: 'success' });
      return true;
    }
    throw new Error('Plugin pack not defined in PluginPacks');
  }

  async function uninstall(pluginId) {
    const def = _available.find(p => p.id === pluginId);
    if (def) {
      NEXUS.PluginLoader.unload(pluginId);
      def.installed = false;
      NEXUS.EventBus.emit('plugin:uninstalled', { id: pluginId });
      NEXUS.DevTools?.log('plugin', `uninstalled ${pluginId}`);
      NEXUS.Shell?.refreshAll();
      NEXUS.Toast.show({ title: 'Plugin removed', message: def.name, type: 'info' });
    }
  }

  return { available, installed, isInstalled, install, uninstall };
})();

  // ---- Component Generator Panel ----
  function renderGenerator() {
    const tplNames = NEXUS.ComponentGenerator.getTemplateNames();

  }

  function bindGenerator() {

    if (editor) editor.oninput = updateHint;

  function toHex(c) {
    if (c.startsWith('#') && (c.length === 7 || c.length === 4)) return c.length === 4 ? '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c;
    if (c.startsWith('rgb')) { const m = c.match(/(\d+)/g); if (m && m.length >= 3) return '#' + m.slice(0,3).map(x => parseInt(x).toString(16).padStart(2,'0')).join(''); }
    return '#7c5cff';
  }

  function bindThemeStudio() {
    // Theme swatches
    document.querySelectorAll('[data-theme-id]').forEach(s => s.onclick = () => NEXUS.ThemeEngine.apply(s.dataset.themeId));
    // Color tokens
    document.querySelectorAll('[data-ts-color]').forEach(inp => {
      inp.oninput = () => {
        NEXUS.ThemeEngine.setToken(inp.dataset.tsColor, inp.value);
        const txt = document.querySelector(`[data-ts-text="${inp.dataset.tsColor}"]`);
        if (txt) txt.value = inp.value;
      };
    });
    document.querySelectorAll('[data-ts-text]').forEach(inp => {
      if (inp.type === 'color') return;
      inp.onchange = () => NEXUS.ThemeEngine.setToken(inp.dataset.tsText, inp.value);
    });
    // Create theme
    const createBtn = document.getElementById('ts-create');
    if (createBtn) createBtn.onclick = () => {
      const name = document.getElementById('ts-new-name')?.value;
      const baseId = document.getElementById('ts-new-base')?.value;
      const accent = document.getElementById('ts-new-accent')?.value;
      if (!name) { NEXUS.Toast.show({ title: 'Name required', type: 'warn' }); return; }
      const id = name.toLowerCase().replace(/\s+/g, '-');
      // Clone base theme and override accent
      NEXUS.ThemeEngine.registerTheme({ id, name, accent });
      // Apply custom CSS vars for the accent
      const style = document.createElement('style');
      style.textContent = `[data-theme="${id}"] { --accent: ${accent}; --accent-soft: ${accent}26; --glow: 0 0 24px ${accent}55; --grid-line: ${accent}12; }`;
      document.head.appendChild(style);
      NEXUS.ThemeEngine.apply(id);
      NEXUS.Toast.show({ title: 'Theme created', message: name, type: 'success' });
      S.refreshRightPanel();
    };
    // Export
    const exportBtn = document.getElementById('ts-export');
    if (exportBtn) exportBtn.onclick = () => {
      const cs = getComputedStyle(document.documentElement);
      const tokens = {};
      ['--bg-0','--bg-1','--bg-2','--bg-3','--fg-0','--fg-1','--fg-2','--fg-3','--accent','--accent-fg','--accent-soft','--success','--warn','--danger','--info','--border-0','--border-1','--border-2','--glow','--shadow-1','--shadow-2','--grid-line'].forEach(t => {
        tokens[t] = cs.getPropertyValue(t).trim();
      });
      const theme = { name: document.documentElement.getAttribute('data-theme'), tokens, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(theme, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `nexus-theme-${theme.name}.json`; a.click();
      URL.revokeObjectURL(url);
    };
    // Import
    const importBtn = document.getElementById('ts-import');
    const importFile = document.getElementById('ts-import-file');
    if (importBtn && importFile) {
      importBtn.onclick = () => importFile.click();
      importFile.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const theme = JSON.parse(ev.target.result);
            if (theme.tokens) {
              Object.entries(theme.tokens).forEach(([k, v]) => NEXUS.ThemeEngine.setToken(k, v));
              NEXUS.Toast.show({ title: 'Theme imported', message: theme.name || 'Custom', type: 'success' });
              S.refreshRightPanel();
            }
          } catch (err) { NEXUS.Toast.show({ title: 'Import failed', message: err.message, type: 'danger' }); }
        };
        reader.readAsText(file);
      };
    }
    // Reset
    const resetBtn = document.getElementById('ts-reset-all');
    if (resetBtn) resetBtn.onclick = () => {
      document.documentElement.style.cssText = '';
      NEXUS.Shell.refreshRightPanel();
    };
  }

  // ---- Keyboard shortcuts ----
  S._initShortcuts = function() {
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

      // Ctrl+Z — Undo
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); NEXUS.UndoManager.undo(); S.refreshAll(); }
      // Ctrl+Shift+Z — Redo
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey) { e.preventDefault(); NEXUS.UndoManager.redo(); S.refreshAll(); }
      // Ctrl+D — Duplicate
      if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
        e.preventDefault();
        if (S.state.selectedNodeId) {
          const ws = NEXUS.WorkspaceManager.getActive();
          const n = ws?.nodes.find(n => n.id === S.state.selectedNodeId);
          if (n) { const comp = NEXUS.ComponentRegistry.get(n.componentId); S.createNode(comp, n.x + 30, n.y + 30, n.z); NEXUS.UndoManager.push({ undo: () => { NEXUS.WorkspaceManager.removeNode(n.id); S.rerenderNodes(); } }); }
        }
      }
      // Ctrl+Shift+D — DevTools
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'D') { e.preventDefault(); NEXUS.DevTools.toggle(); }
      // ? or Ctrl+/ — Shortcuts overlay
      if (e.key === '?' || ((e.ctrlKey || e.metaKey) && e.key === '/')) {
        e.preventDefault();
        const overlay = document.getElementById('shortcuts-overlay');
        overlay?.classList.toggle('open');
        if (overlay?.classList.contains('open')) {
          document.getElementById('sc-list').innerHTML = [
            ['Ctrl+Z', 'Undo last action'], ['Ctrl+Shift+Z', 'Redo'], ['Ctrl+D', 'Duplicate selected node'],
            ['Ctrl+Shift+D', 'Toggle DevTools'], ['? / Ctrl+/', 'Show keyboard shortcuts'],
            ['Arrow keys', 'Pan canvas'], ['+/-', 'Zoom in/out'], ['0', 'Reset view'],
            ['Delete/Backspace', 'Delete selected node'], ['Shift+Click', 'Multi-select nodes'],
            ['Double-click (connect mode)', 'Create connection'], ['Esc', 'Deselect / Cancel'],
          ].map(([k,d]) => `<div class="sc-row"><span class="sc-key">${k}</span><span class="sc-desc">${d}</span></div>`).join('');
        }
      }
      // Delete — Remove selected node
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (S.state.selectedNodeId) {
          const ws = NEXUS.WorkspaceManager.getActive();
          const n = ws?.nodes.find(n => n.id === S.state.selectedNodeId);
          if (n) {
            NEXUS.UndoManager.push({ undo: () => { NEXUS.WorkspaceManager.addNode(n); S.rerenderNodes(); }, redo: () => { NEXUS.WorkspaceManager.removeNode(n.id); S.rerenderNodes(); } });
            NEXUS.WorkspaceManager.removeNode(S.state.selectedNodeId);
            S.state.selectedNodeId = null;
            S.rerenderNodes();
            S.refreshRightPanel();
          }
        }
      }
      // Escape
      if (e.key === 'Escape') {
        NEXUS.ConnectionManager.cancelConnect();
        document.getElementById('shortcuts-overlay')?.classList.remove('open');
        if (S.state.selectedNodeId) {
          S.state.selectedNodeId = null;
          document.querySelectorAll('.nexus-node').forEach(n => n.classList.remove('selected'));
          S.refreshRightPanel();
        }
      }
    });
  };

  // ---- Mini Map ----
  S._initMiniMap = function() {
    const mm = document.getElementById('mini-map');
    if (!mm) return;
    const update = () => {
      const ws = NEXUS.WorkspaceManager.getActive();
      if (!ws || ws.nodes.length === 0) { mm.style.display = 'none'; return; }
      mm.style.display = '';
      const mmW = 160, mmH = 100;
      // Find bounds
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      ws.nodes.forEach(n => { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x + n.w); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y + n.h); });
      const pad = 100;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;
      const rangeX = maxX - minX || 1;
      const rangeY = maxY - minY || 1;
      const scale = Math.min(mmW / rangeX, mmH / rangeY);
      // Dots
      let dots = '';
      ws.nodes.forEach(n => {
        const dx = (n.x - minX) * scale;
        const dy = (n.y - minY) * scale;
        dots += `<div class="mm-dot" style="left:${dx}px;top:${dy}px;"></div>`;
      });
      // Viewport rect
      const view = NEXUS.Canvas3D.getView();
      const canvas = document.getElementById('canvas-3d');
      const cRect = canvas.getBoundingClientRect();
      const vx1 = (view.x - cRect.width/2/view.zoom - minX) * scale;
      const vy1 = (view.y - cRect.height/2/view.zoom - minY) * scale;
      const vw = (cRect.width / view.zoom) * scale;
      const vh = (cRect.height / view.zoom) * scale;
      mm.innerHTML = dots + `<div class="mm-viewport" style="left:${Math.max(0,vx1)}px;top:${Math.max(0,vy1)}px;width:${Math.min(vw,mmW)}px;height:${Math.min(vh,mmH)}px;"></div>`;
    };
    NEXUS.WorkspaceManager.on(update);
    NEXUS.Canvas3D.onChange(update);
    update();
  };

      // Find nodes by partial id match

      const src = ws?.nodes.find(n => n.id.includes(m[1].trim()));

    suggestions: [{ text: 'connect node-1 to node-2', category: 'canvas' }],
  });

  // ---- Re-render connections when nodes move ----
  const origRenderNode = S.renderNode;
  S.renderNode = function(node) {
    origRenderNode.call(S, node);
    // Update connection lines
    setTimeout(() => NEXUS.ConnectionManager.renderConnections(), 10);
  };

  // Expose internal state for the patch
  S.state = S.state;
  console.log('[NEXUS 2.0] Shell enhancements loaded');
})();

  // ---------- NL parser ----------
  // Heuristics-based: detect category, name, parameters from a natural language description.
  function parseNL(description) {
    if (!description || typeof description !== 'string') throw new Error('Description required');
    const text = description.toLowerCase().trim();

    // Detect category by keyword
    const catPatterns = [
      ['search',  /\b(search|find|lookup|google|query web)\b/],
      ['net',     /\b(fetch|http|request|url|api|endpoint|download|crawl|email|send)\b/],
      ['data',    /\b(calculate|compute|convert|transform|parse|query|filter|sort|aggregate|database|sql)\b/],
      ['ai',      /\b(summarize|translate|generate|analyze|sentiment|classify|embed|chat|complete)\b/],
      ['file',    /\b(read|write|file|disk|filesystem|save|load)\b/],
      ['dev',     /\b(execute|run|regex|code|test|debug|compile|lint|format)\b/],
    ];
    let category = 'data';
    for (const [cat, re] of catPatterns) {
      if (re.test(text)) { category = cat; break; }
    }

    // Detect name from first noun phrase
    const nameMatch = description.match(/([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)|([a-z]+(?:\s+[a-z]+)?)/);
    let name = nameMatch ? nameMatch[0].trim() : 'Custom Tool';
    // Capitalize
    name = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    if (!name.toLowerCase().includes('tool')) name = name + ' Tool';

    // Generate id
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Math.random().toString(36).slice(2, 6);

    // Detect parameters by scanning for "with X", "for X", "the X" patterns
    const params = [];
    const paramPatterns = [
      { re: /\b(?:query|search term|search query|keyword)\b/g, name: 'query', type: 'string', desc: 'The search query' },
      { re: /\b(?:url|link|endpoint)\b/g, name: 'url', type: 'string', desc: 'The URL to use' },
      { re: /\b(?:text|content|body|input)\b/g, name: 'text', type: 'string', desc: 'The text content' },
      { re: /\b(?:file|filename|path)\b/g, name: 'path', type: 'string', desc: 'File path' },
      { re: /\b(?:expression|formula|equation)\b/g, name: 'expression', type: 'string', desc: 'The expression' },
      { re: /\b(?:language|lang)\b/g, name: 'language', type: 'string', desc: 'Programming language', enum: ['javascript','python','typescript','bash'] },
      { re: /\b(?:limit|max|count)\b/g, name: 'limit', type: 'integer', desc: 'Maximum count' },
      { re: /\b(?:format|output)\b/g, name: 'format', type: 'string', desc: 'Output format', enum: ['json','text','markdown','html'] },
      { re: /\b(?:timeout)\b/g, name: 'timeout', type: 'integer', desc: 'Timeout in milliseconds' },
      { re: /\b(?:prompt|description)\b/g, name: 'prompt', type: 'string', desc: 'The prompt' },
      { re: /\b(?:method)\b/g, name: 'method', type: 'string', desc: 'HTTP method', enum: ['GET','POST','PUT','DELETE'] },
      { re: /\b(?:headers?)\b/g, name: 'headers', type: 'object', desc: 'Request headers' },
    ];
    const seenParams = new Set();
    for (const { re, name: pname, type, desc, enum: enumVals } of paramPatterns) {
      if (re.test(text) && !seenParams.has(pname)) {
        params.push({ name: pname, type, required: true, description: desc, ...(enumVals ? { enum: enumVals } : {}) });
        seenParams.add(pname);
      }
    }
    // Always ensure at least one param
    if (params.length === 0) {
      params.push({ name: 'input', type: 'string', required: true, description: 'Input value' });
    }

    return {
      id, name, category, description: description.trim(),
      params, returns: { type: 'object', properties: { result: { type: 'any' } } },
      nl: description.trim(),
      mock: (p) => ({ result: `Simulated output for ${name}`, input: p }),
    };
  }

  // ---------- Registration ----------
  function register(tool) {
    if (!tool || !tool.id) throw new Error('Tool id required');
    const existing = _tools.get(tool.id);
    const version = (existing?.version || 0) + 1;
    const finalTool = {
      ...tool,
      version,
      createdAt: existing?.createdAt || Date.now(),
      updatedAt: Date.now(),
      source: tool.source || 'custom',
    };
    _tools.set(tool.id, finalTool);
    _history.unshift({ id: tool.id, name: tool.name, action: existing ? 'updated' : 'created', at: Date.now() });
    if (_history.length > 50) _history.pop();
    _listeners.forEach(fn => fn({ type: existing ? 'updated' : 'added', tool: finalTool }));
    return finalTool;
  }

  function unregister(id) {
    const tool = _tools.get(id);
    if (!tool) return false;
    _tools.delete(id);
    _favorites.delete(id);
    _history.unshift({ id, name: tool.name, action: 'deleted', at: Date.now() });
    _listeners.forEach(fn => fn({ type: 'removed', tool }));
    return true;
  }

  function get(id) { return _tools.get(id); }
  function all() { return Array.from(_tools.values()); }
  function favorites() { return all().filter(t => _favorites.has(t.id)); }
  function byCategory(cat) { return all().filter(t => t.category === cat); }
  function search(q) {
    if (!q) return all();
    const ql = q.toLowerCase();
    return all().filter(t =>
      t.name.toLowerCase().includes(ql) ||
      t.description.toLowerCase().includes(ql) ||
      t.params.some(p => p.name.toLowerCase().includes(ql))
    );
  }
  function toggleFavorite(id) {
    if (_favorites.has(id)) { _favorites.delete(id); return false; }
    _favorites.add(id); return true;
  }
  function isFavorite(id) { return _favorites.has(id); }

  function getTemplate(id) { return _templates.get(id); }
  function getTemplateNames() { return Array.from(_templates.keys()); }
  function getTemplateCode(id) {
    const t = _templates.get(id);
    if (!t) return '';
    return JSON.stringify(t, null, 2);
  }
  function templates() { return Array.from(_templates.values()); }

  function history() { return _history.slice(); }
  function clearHistory() { _history.length = 0; }

  function on(fn) { _listeners.push(fn); }

  // ---------- Multi-format exporters ----------
  function exportTool(id, format) {
    const tool = _tools.get(id) || _templates.get(id);
    if (!tool) throw new Error('Tool not found: ' + id);

    switch (format) {
      case 'openai': return exportOpenAI(tool);
      case 'anthropic': return exportAnthropic(tool);
      case 'mcp': return exportMCP(tool);
      case 'langchain': return exportLangChain(tool);
      case 'json-schema': return exportJsonSchema(tool);
      case 'typescript': return exportTypeScript(tool);
      case 'python': return exportPython(tool);
      default: return JSON.stringify(tool, null, 2);
    }
  }

  function exportOpenAI(tool) {
    return {
      type: 'function',
      function: {
        name: tool.id.replace(/[^a-zA-Z0-9_]/g, '_'),
        description: tool.description,
        parameters: {
          type: 'object',
          properties: Object.fromEntries(tool.params.map(p => [p.name, {
            type: p.type, description: p.description,
            ...(p.enum ? { enum: p.enum } : {}),
          }])),
          required: tool.params.filter(p => p.required).map(p => p.name),
        },
      },
    };
  }

  function exportAnthropic(tool) {
    return {
      name: tool.id.replace(/[^a-zA-Z0-9_]/g, '_'),
      description: tool.description,
      input_schema: {
        type: 'object',
        properties: Object.fromEntries(tool.params.map(p => [p.name, {
          type: p.type, description: p.description,
          ...(p.enum ? { enum: p.enum } : {}),
        }])),
        required: tool.params.filter(p => p.required).map(p => p.name),
      },
    };
  }

  function exportMCP(tool) {
    return {
      name: tool.id,
      description: tool.description,
      inputSchema: {
        type: 'object',
        properties: Object.fromEntries(tool.params.map(p => [p.name, {
          type: p.type, description: p.description,
          ...(p.enum ? { enum: p.enum } : {}),
        }])),
        required: tool.params.filter(p => p.required).map(p => p.name),
      },
      annotations: {
        category: tool.category,
        version: tool.version || 1,
        source: tool.source || 'custom',
        createdAt: new Date(tool.createdAt || Date.now()).toISOString(),
      },
    };
  }

  function exportLangChain(tool) {
    return {
      name: tool.id.replace(/[^a-zA-Z0-9_]/g, '_'),
      description: tool.description,
      args: tool.params.map(p => ({
        name: p.name, type: p.type, required: p.required,
        description: p.description, ...(p.enum ? { enum: p.enum } : {}),
      })),
    };
  }

  function exportJsonSchema(tool) {
    return {
      $schema: 'http://json-schema.org/draft-07/schema#',
      title: tool.name,
      description: tool.description,
      type: 'object',
      properties: Object.fromEntries(tool.params.map(p => [p.name, {
        type: p.type, description: p.description,
        ...(p.enum ? { enum: p.enum } : {}),
      }])),
      required: tool.params.filter(p => p.required).map(p => p.name),
    };
  }

  function exportTypeScript(tool) {
    const fnName = tool.id.replace(/[^a-zA-Z0-9_]/g, '_');
    const params = tool.params.map(p => {
      const tsType = p.type === 'integer' ? 'number' : p.type === 'array' ? 'any[]' : p.type === 'object' ? 'Record<string, any>' : p.type;
      return `${p.name}${p.required ? '' : '?'}: ${tsType}`;
    }).join(', ');
    const desc = tool.params.map(p => ` * @param ${p.name} ${p.description}`).join('\n');
    return `/**
 * ${tool.description}
${desc}
 */
export async function ${fnName}(${params}): Promise<any> {
  // TODO: implement tool logic
  throw new Error('Not implemented');
}`;
  }

  function exportPython(tool) {
    const fnName = tool.id.replace(/[^a-zA-Z0-9_]/g, '_');
    const params = tool.params.map(p => p.name + (p.required ? '' : '=None')).join(', ');
    const docstring = tool.params.map(p => `    ${p.name} (${p.type}): ${p.description}`).join('\n');
    return `def ${fnName}(${params}):
    """${tool.description}

${docstring}
    """
    # TODO: implement tool logic
    raise NotImplementedError("Tool not implemented")`;
  }

  // ---------- Tool runner (mock execution) ----------
  async function run(toolId, inputs) {
    const tool = _tools.get(toolId) || _templates.get(toolId);
    if (!tool) throw new Error('Tool not found: ' + toolId);

    // Validate required params
    const missing = tool.params.filter(p => p.required && (inputs[p.name] === undefined || inputs[p.name] === null));
    if (missing.length) throw new Error('Missing required params: ' + missing.map(p => p.name).join(', '));

    // Simulate async execution
    await new Promise(r => setTimeout(r, 300 + Math.random() * 500));

    // Run mock
    if (typeof tool.mock === 'function') {
      try { return { ok: true, output: tool.mock(inputs), tool: toolId, duration: Math.random() * 500 }; }
      catch (e) { return { ok: false, error: e.message, tool: toolId }; }
    }
    return { ok: true, output: { message: 'Tool executed (no mock defined)', inputs }, tool: toolId };
  }

  // ---------- Tool chains ----------
  function createChain(name, steps) {
    const chain = { id: 'chain-' + Math.random().toString(36).slice(2, 8), name, steps: steps || [], createdAt: Date.now() };
    _chains.push(chain);
    return chain;
  }
  function getChains() { return _chains.slice(); }
  function removeChain(id) {
    const idx = _chains.findIndex(c => c.id === id);
    if (idx >= 0) { _chains.splice(idx, 1); return true; }
    return false;
  }
  async function runChain(chainId, initialInput) {
    const chain = _chains.find(c => c.id === chainId);
    if (!chain) throw new Error('Chain not found');
    let current = initialInput;
    const results = [];
    for (const step of chain.steps) {
      const r = await run(step.toolId, { ...(step.params || {}), ...current });
      results.push({ step: step.name, result: r });
      if (!r.ok) break;
      current = r.output;
    }
    return { ok: results.every(r => r.result.ok), steps: results, final: current };
  }

  // ---------- Stats ----------
  function stats() {
    const tools = all();
    return {
      total: tools.length,
      byCategory: Object.fromEntries(Object.keys(CATEGORIES).map(c => [c, tools.filter(t => t.category === c).length])),
      favorites: _favorites.size,
      chains: _chains.length,
      templates: _templates.size,
    };
  }

  // ---------- Initialize with built-in templates registered as tools ----------
  function init() {
    _builtInTemplates.forEach(t => {
      _tools.set(t.id, { ...t, version: 1, createdAt: Date.now(), updatedAt: Date.now(), source: 'builtin' });
    });
    console.log(`[NEXUS 3.0] ToolsGenerator initialized with ${_tools.size} built-in tools`);
  }

  return {
    CATEGORIES,
    init,
    register, unregister,
    get, all, favorites, byCategory, search,
    toggleFavorite, isFavorite,
    getTemplate, getTemplateNames, getTemplateCode, templates,
    parseNL,
    exportTool,
    run,
    createChain, getChains, removeChain, runChain,
    history, clearHistory,
    stats, on,
  };
})();

  // ---------- Simple syntax highlighter ----------
  function highlight(code, format) {
    if (!code) return '';
    if (format === 'typescript' || format === 'python') {
      // Code-style highlighting
      return code
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/(\/\*[\s\S]*?\*\/|\/\/.*$|#.*$)/gm, '<span class="tok-comment">$1</span>')
        .replace(/("[^"]*"|'[^']*'|`[^`]*`)/g, '<span class="tok-str">$1</span>')
        .replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>')
        .replace(/\b(def|return|async|await|function|export|import|from|const|let|var|if|else|for|while|class|raise|throw|new|Promise|true|false|null|None|True|False)\b/g, '<span class="tok-bool">$1</span>');
    }
    // JSON highlighting
    return code
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="tok-key">$1</span>$2')
      .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="tok-str">$1</span>')
      .replace(/:\s*(true|false|null)/g, ': <span class="tok-bool">$1</span>')
      .replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="tok-num">$1</span>');
  }

  function bindToolCards() {
    document.querySelectorAll('.tg-tool-card').forEach(card => {

        document.querySelectorAll('.tg-tool-card').forEach(c => c.classList.remove('selected'));

      };
    });
    document.querySelectorAll('[data-fav-id]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const id = el.dataset.favId;
        NEXUS.ToolsGenerator.toggleFavorite(id);
        S.refreshRightPanel();
      };
    });
    document.querySelectorAll('[data-test-id]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        state.selectedToolId = b.dataset.testId;
        state.mode = 'test';
        state.testInputs = {};
        state.testOutput = null;
        S.refreshRightPanel();
      };
    });
    document.querySelectorAll('[data-export-id]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        state.selectedToolId = b.dataset.exportId;
        state.mode = 'export';
        S.refreshRightPanel();
      };
    });
    document.querySelectorAll('[data-canvas-id]').forEach(b => {
      b.onclick = async (e) => {
        e.stopPropagation();
        const id = b.dataset.canvasId;
        const tool = NEXUS.ToolsGenerator.get(id);
        if (!tool) return;
        // Create a synthetic component for this tool and drop on canvas
        const comp = toolToComponent(tool);
        const view = NEXUS.Canvas3D.getView();
        const canvas = document.getElementById('canvas-3d');
        const rect = canvas.getBoundingClientRect();
        const wx = view.x + (rect.width/2 - rect.width/2) / view.zoom;
        const wy = view.y + (rect.height/2 - rect.height/2) / view.zoom;
        const node = S.createNode(comp, wx, wy, 0);
        if (node) {
          const el = document.getElementById(`node-${node.id}`);
          if (el) el.classList.add('tool-node');
          NEXUS.Toast.show({ title: 'Tool placed on canvas', message: tool.name, type: 'success' });
        }
      };
    });
    document.querySelectorAll('[data-del-id]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        const id = b.dataset.delId;
        if (confirm('Delete this tool?')) {
          NEXUS.ToolsGenerator.unregister(id);
          S.refreshRightPanel();
          NEXUS.Toast.show({ title: 'Tool deleted', type: 'info' });
        }
      };
    });
  }

      name: tool.name,
      category: 'AI Tools',
      taxonomy: { primitive: false, app: true },
      tags: ['tool', tool.category],
      icon: NEXUS.Icons.get(cat.icon) || NEXUS.Icons.get('tool'),
      defaultProps: { name: tool.name, description: tool.description, params: tool.params.map(p=>p.name).join(', ') },

  // ---------- Generate mode bindings ----------
  function bindGenerateMode() {
    const nlInput = document.getElementById('tg-nl');
    if (nlInput) nlInput.oninput = () => { state.genForm.nl = nlInput.value; };

    document.querySelectorAll('[data-gen-cat]').forEach(c => {
      c.onclick = () => {
        state.genForm.category = c.dataset.genCat;
        S.refreshRightPanel();
      };
    });

    const parseBtn = document.getElementById('tg-parse');
    if (parseBtn) parseBtn.onclick = () => {
      const nl = state.genForm.nl.trim();
      if (!nl) { NEXUS.Toast.show({ title: 'Describe your tool first', type: 'warn' }); return; }
      try {
        const parsed = NEXUS.ToolsGenerator.parseNL(nl);
        // Override category with user selection
        parsed.category = state.genForm.category;
        state.genForm = {
          nl: state.genForm.nl,
          category: state.genForm.category,
          name: parsed.name,
          description: parsed.description,
          id: parsed.id,
          params: parsed.params,
        };
        S.refreshRightPanel();
        NEXUS.Toast.show({ title: 'Tool generated', message: parsed.name, type: 'success' });
      } catch (e) {
        NEXUS.Toast.show({ title: 'Parse failed', message: e.message, type: 'danger' });
      }
    };

    const tplSelect = document.getElementById('tg-tpl-select');
    const loadTpl = document.getElementById('tg-load-tpl');
    if (loadTpl) loadTpl.onclick = () => {
      const id = tplSelect?.value;
      if (!id) { NEXUS.Toast.show({ title: 'Pick a template', type: 'warn' }); return; }
      const t = NEXUS.ToolsGenerator.getTemplate(id);
      if (t) {
        state.genForm = {
          nl: t.nl || t.description,
          category: t.category,
          name: t.name,
          description: t.description,
          id: 'custom-' + t.id + '-' + Math.random().toString(36).slice(2,5),
          params: t.params.map(p => ({...p})),
        };
        S.refreshRightPanel();
        NEXUS.Toast.show({ title: 'Template loaded', message: t.name, type: 'info' });
      }
    };

    // Live form fields
    const nameInp = document.getElementById('tg-name');
    if (nameInp) nameInp.oninput = () => state.genForm.name = nameInp.value;
    const descInp = document.getElementById('tg-desc');
    if (descInp) descInp.oninput = () => state.genForm.description = descInp.value;
    const idInp = document.getElementById('tg-id');
    if (idInp) idInp.oninput = () => state.genForm.id = idInp.value;

    // Schema builder
    const addParam = document.getElementById('tg-add-param');
    if (addParam) addParam.onclick = () => {
      state.genForm.params.push({ name: 'param' + (state.genForm.params.length+1), type: 'string', required: false, description: '' });
      S.refreshRightPanel();
    };

    document.querySelectorAll('[data-del-param]').forEach(b => {
      b.onclick = () => {
        const i = parseInt(b.dataset.delParam);
        state.genForm.params.splice(i, 1);
        S.refreshRightPanel();
      };
    });

    document.querySelectorAll('.tg-schema-row').forEach(row => {
      const i = parseInt(row.dataset.paramIdx);
      const nameInp = row.querySelector('.tg-p-name');
      const typeSel = row.querySelector('.tg-p-type');
      const descInp = row.querySelector('.tg-p-desc');
      if (nameInp) nameInp.oninput = () => state.genForm.params[i].name = nameInp.value;
      if (typeSel) typeSel.onchange = () => state.genForm.params[i].type = typeSel.value;
      if (descInp) descInp.oninput = () => state.genForm.params[i].description = descInp.value;
    });

    // Register
    const regBtn = document.getElementById('tg-register');
    if (regBtn) regBtn.onclick = () => {
      const f = state.genForm;
      if (!f.name || !f.description) {
        NEXUS.Toast.show({ title: 'Name and description required', type: 'warn' });
        return;
      }
      const tool = {
        id: f.id || f.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Math.random().toString(36).slice(2,5),
        name: f.name,
        category: f.category,
        description: f.description,
        params: f.params.filter(p => p.name),
        returns: { type: 'object', properties: { result: { type: 'any' } } },
        source: 'custom',
        mock: (p) => ({ result: `Mock output for ${f.name}`, inputs: p }),
      };
      try {
        NEXUS.ToolsGenerator.register(tool);
        NEXUS.Toast.show({ title: 'Tool registered', message: tool.name, type: 'success' });
        // Reset form
        state.genForm = { nl: '', category: 'ai', name: '', description: '', params: [] };
        state.mode = 'browse';
        S.refreshRightPanel();
        S.renderSidebarTree();
      } catch (e) {
        NEXUS.Toast.show({ title: 'Register failed', message: e.message, type: 'danger' });
      }
    };

    // Test
    const testGenBtn = document.getElementById('tg-test-gen');
    if (testGenBtn) testGenBtn.onclick = () => {
      const f = state.genForm;
      if (!f.name) { NEXUS.Toast.show({ title: 'Generate a tool first', type: 'warn' }); return; }
      // Temporarily register and test
      const tempTool = {
        id: f.id || 'temp-' + Date.now(),
        name: f.name, category: f.category, description: f.description,
        params: f.params.filter(p => p.name),
        mock: (p) => ({ result: `Mock output for ${f.name}`, inputs: p }),
      };
      state.selectedToolId = tempTool.id;
      // Temporarily add to tools map (bypass register to avoid history pollution)
      const origGet = NEXUS.ToolsGenerator.get;
      // Just test directly
      NEXUS.ToolsGenerator.register(tempTool);
      state.mode = 'test';
      S.refreshRightPanel();
    };

    // Clear
    const clearBtn = document.getElementById('tg-clear-gen');
    if (clearBtn) clearBtn.onclick = () => {
      state.genForm = { nl: '', category: 'ai', name: '', description: '', params: [] };
      S.refreshRightPanel();
    };
  }

  // ---------- Test mode bindings ----------
  function bindTestMode() {
    const sel = document.getElementById('tg-test-tool');
    if (sel) sel.onchange = () => {
      state.selectedToolId = sel.value;
      state.testInputs = {};
      state.testOutput = null;
      S.refreshRightPanel();
    };

    document.querySelectorAll('[data-test-param]').forEach(inp => {
      inp.oninput = () => {
        const name = inp.dataset.testParam;
        let val = inp.value;
        if (inp.tagName === 'SELECT') val = val === 'true';
        else if (/^-?\d+$/.test(val)) val = parseInt(val);
        else if (/^-?\d+\.\d+$/.test(val)) val = parseFloat(val);
        else { try { val = JSON.parse(val); } catch {} }
        state.testInputs[name] = val;
      };
    });

    const runBtn = document.getElementById('tg-run-test');
    if (runBtn) runBtn.onclick = async () => {
      const toolId = state.selectedToolId;
      if (!toolId) return;
      runBtn.classList.add('running');
      runBtn.disabled = true;
      runBtn.innerHTML = icon('play') + ' Running...';
      try {
        const result = await NEXUS.ToolsGenerator.run(toolId, state.testInputs);
        state.testOutput = result;
        S.refreshRightPanel();
      } catch (e) {
        state.testOutput = { ok: false, error: e.message };
        S.refreshRightPanel();
      } finally {
        runBtn.classList.remove('running');
        runBtn.disabled = false;
      }
    };
  }

  // ---------- Chains mode bindings ----------
  function bindChainsMode() {
    const _chainSteps = [];
    const addBtn = document.getElementById('tg-chain-add');
    if (addBtn) addBtn.onclick = () => {
      const sel = document.getElementById('tg-chain-tool');
      const toolId = sel?.value;
      if (!toolId) return;
      const tool = NEXUS.ToolsGenerator.get(toolId);
      if (!tool) return;
      _chainSteps.push({ toolId, name: tool.name, params: {} });
      renderChainBuilder(_chainSteps);
    };

    const saveBtn = document.getElementById('tg-chain-save');
    if (saveBtn) saveBtn.onclick = () => {
      const nameInp = document.getElementById('tg-chain-name');
      const name = nameInp?.value || 'Untitled Chain';
      if (_chainSteps.length === 0) {
        NEXUS.Toast.show({ title: 'Add at least one step', type: 'warn' });
        return;
      }
      NEXUS.ToolsGenerator.createChain(name, _chainSteps);
      NEXUS.Toast.show({ title: 'Chain saved', message: name, type: 'success' });
      _chainSteps.length = 0;
      S.refreshRightPanel();
    };

    document.querySelectorAll('[data-chain-del]').forEach(el => {
      el.onclick = () => {
        NEXUS.ToolsGenerator.removeChain(el.dataset.chainDel);
        S.refreshRightPanel();
      };
    });

    document.querySelectorAll('[data-chain-run]').forEach(b => {
      b.onclick = async () => {
        const chainId = b.dataset.chainRun;
        b.textContent = 'Running...';
        const result = await NEXUS.ToolsGenerator.runChain(chainId, {});
        if (result.ok) {
          NEXUS.Toast.show({ title: 'Chain completed', message: `${result.steps.length} steps executed`, type: 'success' });
        } else {
          NEXUS.Toast.show({ title: 'Chain failed', type: 'danger' });
        }
        S.refreshRightPanel();
      };
    });

    function renderChainBuilder(steps) {
      const builder = document.getElementById('tg-chain-builder');
      if (!builder) return;
      if (steps.length === 0) {
        builder.innerHTML = '<div class="tiny muted" style="text-align:center;padding:8px;">No steps yet.</div>';
        return;
      }
      builder.innerHTML = steps.map((s, i) => `
        <div class="tg-chain-step">
          <div class="cs-num">${i+1}</div>
          <div class="cs-name">${s.name}</div>
          <span class="cs-del" data-step-del="${i}">×</span>
        </div>
        ${i < steps.length - 1 ? '<div class="tg-chain-arrow">↓</div>' : ''}
      `).join('');
      builder.querySelectorAll('[data-step-del]').forEach(el => {
        el.onclick = () => {
          _chainSteps.splice(parseInt(el.dataset.stepDel), 1);
          renderChainBuilder(_chainSteps);
        };
      });
    }
  }

  // ---------- Export mode bindings ----------
  function bindExportMode() {
    const toolSel = document.getElementById('tg-export-tool');
    if (toolSel) toolSel.onchange = () => {
      state.selectedToolId = toolSel.value;
      S.refreshRightPanel();
    };
    const fmtSel = document.getElementById('tg-export-format');

    if (copyBtn) copyBtn.onclick = () => {
      const sel = state.selectedToolId;
      if (!sel) return;

        ? NEXUS.ToolsGenerator.exportTool(sel, state.exportFormat)
        : JSON.stringify(NEXUS.ToolsGenerator.exportTool(sel, state.exportFormat), null, 2);

    const dlBtn = document.getElementById('tg-download-export');
    if (dlBtn) dlBtn.onclick = () => {
      const sel = state.selectedToolId;
      if (!sel) return;
      const tool = NEXUS.ToolsGenerator.get(sel);
      const code = typeof NEXUS.ToolsGenerator.exportTool(sel, state.exportFormat) === 'string'
        ? NEXUS.ToolsGenerator.exportTool(sel, state.exportFormat)
        : JSON.stringify(NEXUS.ToolsGenerator.exportTool(sel, state.exportFormat), null, 2);
      const ext = state.exportFormat === 'typescript' ? 'ts' : state.exportFormat === 'python' ? 'py' : 'json';
      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${tool.id}.${ext}`;
      a.click();
      URL.revokeObjectURL(url);
      NEXUS.Toast.show({ title: 'Downloaded', message: `${tool.id}.${ext}`, type: 'success' });
    };
    const allBtn = document.getElementById('tg-export-all');
    if (allBtn) allBtn.onclick = () => {
      const tools = NEXUS.ToolsGenerator.all();
      const all = tools.map(t => NEXUS.ToolsGenerator.exportTool(t.id, state.exportFormat));
      const code = state.exportFormat === 'typescript' || state.exportFormat === 'python'
        ? all.join('\n\n---\n\n')
        : JSON.stringify(all, null, 2);
      const ext = state.exportFormat === 'typescript' ? 'ts' : state.exportFormat === 'python' ? 'py' : 'json';

(function() {
  const S = NEXUS.Shell;

  // ---------- Initialize ToolsGenerator ----------
  NEXUS.ToolsGenerator.init();

  // ---------- Patch refreshRightPanel to handle 'tools' tab ----------
  const origRefresh = S.refreshRightPanel;
  S.refreshRightPanel = function() {
    const tab = S.state.activeRightTab;
    const body = document.getElementById('rp-body');
    if (tab === 'tools' && NEXUS.ToolsPanel) {
      body.innerHTML = NEXUS.ToolsPanel.render();
      NEXUS.ToolsPanel.bind();
      // Update rail badge
      const badge = document.getElementById('rail-tools-badge');
      if (badge) badge.textContent = NEXUS.ToolsGenerator.stats().total;
      return;
    }
    origRefresh.call(S);
  };

  // ---------- Patch bindRail to handle 'tools' view ----------
  const origBindRail = S.bindRail;
  S.bindRail = function() {
    origBindRail.call(S);
    document.querySelectorAll('#rail .rail-btn[data-view="tools"]').forEach(b => {
      b.onclick = () => {
        S.state.activeRightTab = 'tools';
        S.refreshRightPanel();
        document.querySelectorAll('.rp-tab').forEach(t => t.classList.toggle('active', t.dataset.rptab === 'tools'));
        // Update badge
        const badge = document.getElementById('rail-tools-badge');
        if (badge) badge.textContent = NEXUS.ToolsGenerator.stats().total;
      };
    });
    // Also handle right-panel tab click for 'tools'
    setTimeout(() => {
      document.querySelectorAll('.rp-tab[data-rptab="tools"]').forEach(t => {
        t.onclick = () => {
          S.state.activeRightTab = 'tools';
          S.refreshRightPanel();
          document.querySelectorAll('.rp-tab').forEach(x => x.classList.toggle('active', x.dataset.rptab === 'tools'));
        };
      });
    }, 100);
  };

  // ---------- Patch init to log NEXUS 3.0 ----------
  const origInit = S.init;
  S.init = function() {
    origInit.call(S);
    setTimeout(() => {
      NEXUS.DevTools?.log('system', 'NEXUS 3.0 ToolsGenerator loaded — ' + NEXUS.ToolsGenerator.stats().total + ' tools available');
      // Set initial badge
      const badge = document.getElementById('rail-tools-badge');
      if (badge) badge.textContent = NEXUS.ToolsGenerator.stats().total;
      // Welcome toast
      NEXUS.Toast.show({
        title: 'NEXUS 3.0 Ready',
        message: `${NEXUS.ToolsGenerator.stats().total} tools · Multi-format export · NL generator`,
        type: 'success', duration: 4000,
      });
    }, 500);
  };

  // ---------- New commands ----------
  NEXUS.CommandParser.registerCommand({
    id: 'gen-tool', match: [/^gen\s+tool\s+(.+)/i, /^generate\s+tool\s+(.+)/i], category: 'tools',
    description: 'Generate an AI tool from a natural language description',
    help: 'gen tool <description> · e.g. "gen tool search the web for a query"',
    execute: (m) => {
      const desc = m[1].trim();
      const parsed = NEXUS.ToolsGenerator.parseNL(desc);
      NEXUS.ToolsGenerator.register(parsed);
      S.renderSidebarTree();
      // Update badge
      const badge = document.getElementById('rail-tools-badge');
      if (badge) badge.textContent = NEXUS.ToolsGenerator.stats().total;
      return `Generated: ${parsed.name} (${parsed.params.length} params)`;
    },
    successMsg: 'Tool generated',
    suggestions: [
      { text: 'gen tool search the web for a query', category: 'tools' },
      { text: 'gen tool translate text from English to Spanish', category: 'tools' },
      { text: 'gen tool summarize a long text into bullet points', category: 'tools' },
      { text: 'gen tool fetch a url and return markdown content', category: 'tools' },
      { text: 'gen tool calculate a math expression', category: 'tools' },
      { text: 'gen tool generate an image from a prompt', category: 'tools' },
    ],
  });

  NEXUS.CommandParser.registerCommand({
    id: 'run-tool', match: [/^run\s+tool\s+(\S+)\s*(.*)/i], category: 'tools',
    description: 'Execute a tool with optional JSON arguments',
    help: 'run tool <toolId> [JSON args]',
    execute: async (m) => {
      const id = m[1].trim();
      let args = {};
      if (m[2]) { try { args = JSON.parse(m[2]); } catch { args = { input: m[2] }; } }
      const r = await NEXUS.ToolsGenerator.run(id, args);
      if (r.ok) return JSON.stringify(r.output).slice(0, 200);
      throw new Error(r.error || 'Tool failed');
    },
    successMsg: 'Tool executed',
    suggestions: [
      { text: 'run tool web-search {"query":"AI agents"}', category: 'tools' },
      { text: 'run tool calculator {"expression":"2+2*3"}', category: 'tools' },
      { text: 'run tool sentiment {"text":"I love this!"}', category: 'tools' },
    ],
  });

  NEXUS.CommandParser.registerCommand({
    id: 'list-tools', match: [/^list\s+tools/i, /^tools$/i], category: 'tools',
    description: 'List all registered tools',
    execute: () => {
      const tools = NEXUS.ToolsGenerator.all();
      return tools.map(t => `${t.id} (${t.category})`).join(', ');
    },
    suggestions: [{ text: 'list tools', category: 'tools' }],
  });

  NEXUS.CommandParser.registerCommand({
    id: 'export-tool', match: [/^export\s+tool\s+(\S+)\s+(openai|anthropic|mcp|langchain|json-schema|typescript|python)/i], category: 'tools',
    description: 'Export a tool in a specific format',
    help: 'export tool <id> <format>',
    execute: (m) => {
      const id = m[1].trim();
      const fmt = m[2].toLowerCase();
      const out = NEXUS.ToolsGenerator.exportTool(id, fmt);
      const code = typeof out === 'string' ? out : JSON.stringify(out, null, 2);
      navigator.clipboard?.writeText(code).catch(() => {});
      return `Exported ${id} as ${fmt} (${code.length} chars, copied to clipboard)`;
    },
    successMsg: 'Tool exported',
    suggestions: [
      { text: 'export tool web-search openai', category: 'tools' },
      { text: 'export tool calculator mcp', category: 'tools' },
      { text: 'export tool sentiment anthropic', category: 'tools' },
      { text: 'export tool translate typescript', category: 'tools' },
    ],
  });

  NEXUS.CommandParser.registerCommand({
    id: 'export-all-tools', match: [/^export\s+all\s+tools\s+(openai|anthropic|mcp|langchain|json-schema|typescript|python)/i], category: 'tools',
    description: 'Export all tools in a specific format',
    execute: (m) => {
      const fmt = m[1].toLowerCase();
      const tools = NEXUS.ToolsGenerator.all();
      const all = tools.map(t => NEXUS.ToolsGenerator.exportTool(t.id, fmt));
      const code = (fmt === 'typescript' || fmt === 'python') ? all.join('\n\n---\n\n') : JSON.stringify(all, null, 2);
      const ext = fmt === 'typescript' ? 'ts' : fmt === 'python' ? 'py' : 'json';
      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `nexus-tools-${fmt}.${ext}`; a.click();
      URL.revokeObjectURL(url);
      return `Exported ${tools.length} tools as ${fmt}`;
    },
    successMsg: 'All tools exported',
    suggestions: [{ text: 'export all tools mcp', category: 'tools' }],
  });

  console.log('[NEXUS 3.0] Shell integration loaded — 5 new commands registered');
})();
