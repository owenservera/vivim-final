<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEXUS 3.0 · Infinite Canvas + Tools Generator for AI WebApps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   NEXUS DESIGN SYSTEM — Primitives & Tokens
   Hot-swappable via [data-theme] on <html>. All UI components
   inherit from these tokens; swapping one variable cascades.
   ============================================================ */
:root {
  /* Typography */
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --fs-xs: 11px;  --fs-sm: 13px;  --fs-md: 14px;  --fs-lg: 16px;
  --fs-xl: 20px;  --fs-2xl: 28px; --fs-3xl: 40px;
  --lh-tight: 1.15; --lh-normal: 1.5; --lh-loose: 1.75;
  --fw-light: 300; --fw-regular: 400; --fw-medium: 500;
  --fw-semibold: 600; --fw-bold: 700; --fw-black: 800;

  /* Spacing scale (8px base) */
  --sp-0: 0; --sp-1: 2px; --sp-2: 4px; --sp-3: 8px; --sp-4: 12px;
  --sp-5: 16px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px;
  --sp-9: 64px; --sp-10: 96px;

  /* Radii */
  --r-xs: 2px; --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --r-xl: 20px; --r-2xl: 32px; --r-pill: 999px;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 120ms; --dur-med: 240ms; --dur-slow: 480ms;

  /* Z-index scale */
  --z-canvas: 0; --z-overlay: 100; --z-panel: 200;
  --z-toolbar: 300; --z-command: 400; --z-modal: 500; --z-toast: 600;

  /* Layout */
  --shell-rail-w: 56px;
  --shell-sidebar-w: 280px;
  --shell-right-w: 320px;
  --shell-cmd-h: 64px;
}

/* ---------- THEME: midnight (default) ---------- */
[data-theme="midnight"] {
  --bg-0: #06070b; --bg-1: #0c0e16; --bg-2: #141826; --bg-3: #1c2235;
  --bg-glass: rgba(20, 24, 38, 0.72);
  --fg-0: #f5f7fb; --fg-1: #c8cdd9; --fg-2: #8a92a6; --fg-3: #565d72;
  --border-0: rgba(255,255,255,0.06); --border-1: rgba(255,255,255,0.12);
  --border-2: rgba(255,255,255,0.20);
  --accent: #7c5cff; --accent-fg: #ffffff; --accent-soft: rgba(124, 92, 255, 0.16);
  --success: #2dd4bf; --warn: #fbbf24; --danger: #f43f5e; --info: #38bdf8;
  --glow: 0 0 24px rgba(124, 92, 255, 0.35);
  --shadow-1: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-2: 0 12px 40px rgba(0,0,0,0.55);
  --grid-line: rgba(124, 92, 255, 0.06);
}

/* ---------- THEME: daylight ---------- */
[data-theme="daylight"] {
  --bg-0: #f7f8fb; --bg-1: #ffffff; --bg-2: #eef1f6; --bg-3: #e1e6ef;
  --bg-glass: rgba(255, 255, 255, 0.78);
  --fg-0: #0b0d14; --fg-1: #2a2f3d; --fg-2: #5a6275; --fg-3: #8a92a6;
  --border-0: rgba(0,0,0,0.06); --border-1: rgba(0,0,0,0.12); --border-2: rgba(0,0,0,0.2);
  --accent: #4f46e5; --accent-fg: #ffffff; --accent-soft: rgba(79, 70, 229, 0.1);
  --success: #0d9488; --warn: #d97706; --danger: #dc2626; --info: #0284c7;
  --glow: 0 0 24px rgba(79, 70, 229, 0.18);
  --shadow-1: 0 4px 16px rgba(15, 23, 42, 0.08);
  --shadow-2: 0 12px 40px rgba(15, 23, 42, 0.12);
  --grid-line: rgba(79, 70, 229, 0.08);
}

/* ---------- THEME: carbon (graphite) ---------- */
[data-theme="carbon"] {
  --bg-0: #0a0a0a; --bg-1: #111111; --bg-2: #1a1a1a; --bg-3: #242424;
  --bg-glass: rgba(20, 20, 20, 0.78);
  --fg-0: #fafafa; --fg-1: #d4d4d4; --fg-2: #8a8a8a; --fg-3: #525252;
  --border-0: rgba(255,255,255,0.05); --border-1: rgba(255,255,255,0.10); --border-2: rgba(255,255,255,0.18);
  --accent: #f97316; --accent-fg: #0a0a0a; --accent-soft: rgba(249, 115, 22, 0.14);
  --success: #10b981; --warn: #eab308; --danger: #ef4444; --info: #3b82f6;
  --glow: 0 0 24px rgba(249, 115, 22, 0.35);
  --shadow-1: 0 4px 16px rgba(0,0,0,0.6);
  --shadow-2: 0 12px 40px rgba(0,0,0,0.75);
  --grid-line: rgba(249, 115, 22, 0.05);
}

/* ---------- THEME: cyber (neon) ---------- */
[data-theme="cyber"] {
  --bg-0: #050014; --bg-1: #0a0220; --bg-2: #150634; --bg-3: #200b4a;
  --bg-glass: rgba(21, 6, 52, 0.7);
  --fg-0: #e0f7ff; --fg-1: #b5e8ff; --fg-2: #6b8eb8; --fg-3: #3d5577;
  --border-0: rgba(0, 240, 255, 0.08); --border-1: rgba(0, 240, 255, 0.18); --border-2: rgba(0, 240, 255, 0.35);
  --accent: #00f0ff; --accent-fg: #050014; --accent-soft: rgba(0, 240, 255, 0.15);
  --success: #00ff9d; --warn: #ffea00; --danger: #ff2e88; --info: #b388ff;
  --glow: 0 0 24px rgba(0, 240, 255, 0.5), 0 0 48px rgba(0, 240, 255, 0.2);
  --shadow-1: 0 4px 20px rgba(0, 240, 255, 0.18);
  --shadow-2: 0 12px 48px rgba(179, 136, 255, 0.35);
  --grid-line: rgba(0, 240, 255, 0.08);
}

/* ---------- THEME: paper (warm) ---------- */
[data-theme="paper"] {
  --bg-0: #f5f0e6; --bg-1: #fbf7ee; --bg-2: #efe6d2; --bg-3: #e3d5b3;
  --bg-glass: rgba(251, 247, 238, 0.85);
  --fg-0: #2a1f10; --fg-1: #4a3826; --fg-2: #7a6650; --fg-3: #a89880;
  --border-0: rgba(74, 56, 38, 0.10); --border-1: rgba(74, 56, 38, 0.18); --border-2: rgba(74, 56, 38, 0.3);
  --accent: #b45309; --accent-fg: #fbf7ee; --accent-soft: rgba(180, 83, 9, 0.12);
  --success: #15803d; --warn: #ca8a04; --danger: #b91c1c; --info: #1d4ed8;
  --glow: 0 0 24px rgba(180, 83, 9, 0.2);
  --shadow-1: 0 4px 16px rgba(74, 56, 38, 0.12);
  --shadow-2: 0 12px 40px rgba(74, 56, 38, 0.18);
  --grid-line: rgba(180, 83, 9, 0.06);
}

/* ============================================================
   Base reset
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans); font-size: var(--fs-md);
  line-height: var(--lh-normal); color: var(--fg-0); background: var(--bg-0);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  user-select: none; -webkit-user-select: none;
  transition: background var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: var(--r-pill); }
::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

/* ============================================================
   Shell layout
   ============================================================ */
#shell {
  position: fixed; inset: 0; display: grid;
  grid-template-columns: var(--shell-rail-w) var(--shell-sidebar-w) 1fr var(--shell-right-w);
  grid-template-rows: 1fr var(--shell-cmd-h);
  grid-template-areas:
    "rail sidebar canvas right"
    "rail cmd     cmd    cmd";
  isolation: isolate;
}

/* ---------- 3D Canvas layer ---------- */
#canvas-3d {
  grid-area: canvas; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse at top left, var(--accent-soft), transparent 50%),
    radial-gradient(ellipse at bottom right, var(--accent-soft), transparent 50%),
    var(--bg-0);
}
#canvas-3d canvas { display: block; width: 100%; height: 100%; }

/* The HTML overlay that floats above Three.js — components live here */
#canvas-overlay {
  position: absolute; inset: 0; pointer-events: none;
  transform-origin: 0 0; will-change: transform;
}
#canvas-overlay > .nexus-node { pointer-events: auto; }

/* Z-layer indicator HUD */
#z-hud {
  position: absolute; top: var(--sp-4); right: var(--sp-4);
  display: flex; gap: var(--sp-2); align-items: center;
  background: var(--bg-glass); backdrop-filter: blur(12px);
  border: 1px solid var(--border-1); border-radius: var(--r-md);
  padding: var(--sp-2) var(--sp-3); font-family: var(--font-mono);
  font-size: var(--fs-xs); color: var(--fg-1); z-index: var(--z-overlay);
  pointer-events: auto;
}
#z-hud .z-pill {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 2px 8px; border-radius: var(--r-sm);
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--border-1);
}
#z-hud .z-pill.active { background: var(--accent); color: var(--accent-fg); }
#z-hud button { padding: 2px 6px; border-radius: var(--r-xs); color: var(--fg-2); }
#z-hud button:hover { color: var(--fg-0); background: var(--border-1); }

/* Canvas HUD — coordinates + zoom */
#canvas-hud {
  position: absolute; bottom: var(--sp-4); left: var(--sp-4);
  display: flex; gap: var(--sp-4); font-family: var(--font-mono);
  font-size: var(--fs-xs); color: var(--fg-2); z-index: var(--z-overlay);
  background: var(--bg-glass); backdrop-filter: blur(8px);
  border: 1px solid var(--border-0); border-radius: var(--r-md);
  padding: var(--sp-2) var(--sp-3); pointer-events: none;
}
#canvas-hud span b { color: var(--fg-0); font-weight: var(--fw-medium); margin-right: 4px; }

/* ---------- Left rail (workspaces + global nav) ---------- */
#rail {
  grid-area: rail; background: var(--bg-1); border-right: 1px solid var(--border-0);
  display: flex; flex-direction: column; align-items: center;
  padding: var(--sp-3) 0; gap: var(--sp-2); z-index: var(--z-panel);
}
#rail .rail-logo {
  width: 36px; height: 36px; border-radius: var(--r-md);
  background: linear-gradient(135deg, var(--accent), var(--info));
  display: grid; place-items: center; font-family: var(--font-display);
  font-weight: var(--fw-black); font-size: 18px; color: var(--accent-fg);
  box-shadow: var(--glow); margin-bottom: var(--sp-2);
}
#rail .rail-btn {
  width: 40px; height: 40px; border-radius: var(--r-md);
  display: grid; place-items: center; color: var(--fg-2);
  transition: all var(--dur-fast) var(--ease-out); position: relative;
}
#rail .rail-btn:hover { color: var(--fg-0); background: var(--bg-2); }
#rail .rail-btn.active { color: var(--accent); background: var(--accent-soft); }
#rail .rail-btn.active::before {
  content: ''; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px;
  background: var(--accent); border-radius: var(--r-pill);
}
#rail .rail-spacer { flex: 1; }
#rail .rail-btn .badge {
  position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px;
  padding: 0 4px; border-radius: var(--r-pill); background: var(--danger);
  color: #fff; font-size: 9px; font-weight: var(--fw-bold);
  display: grid; place-items: center;
}
.rail-tooltip {
  position: absolute; left: 52px; top: 50%; transform: translateY(-50%);
  background: var(--bg-3); color: var(--fg-0); padding: 4px 10px;
  border-radius: var(--r-sm); font-size: var(--fs-xs); white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity var(--dur-fast);
  border: 1px solid var(--border-1); z-index: var(--z-modal);
}
#rail .rail-btn:hover .rail-tooltip { opacity: 1; }

/* ---------- Sidebar (component registry browser) ---------- */
#sidebar {
  grid-area: sidebar; background: var(--bg-1); border-right: 1px solid var(--border-0);
  display: flex; flex-direction: column; z-index: var(--z-panel);
  overflow: hidden;
}
#sidebar .sb-header {
  padding: var(--sp-4) var(--sp-4) var(--sp-3); border-bottom: 1px solid var(--border-0);
  display: flex; align-items: center; justify-content: space-between;
}
#sidebar .sb-header h2 {
  font-family: var(--font-display); font-size: var(--fs-sm);
  font-weight: var(--fw-semibold); color: var(--fg-1);
  text-transform: uppercase; letter-spacing: 0.08em;
}
#sidebar .sb-header button {
  width: 24px; height: 24px; border-radius: var(--r-sm);
  display: grid; place-items: center; color: var(--fg-2);
}
#sidebar .sb-header button:hover { background: var(--bg-2); color: var(--fg-0); }
#sidebar .sb-search {
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-0);
}
#sidebar .sb-search input {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-md); padding: 8px 12px; font-size: var(--fs-sm);
  outline: none; transition: border-color var(--dur-fast);
}
#sidebar .sb-search input:focus { border-color: var(--accent); }
#sidebar .sb-search input::placeholder { color: var(--fg-3); }
#sidebar .sb-tree { flex: 1; overflow-y: auto; padding: var(--sp-2) 0; }
.sb-group { margin-bottom: var(--sp-1); }
.sb-group-header {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 6px var(--sp-4); cursor: pointer; color: var(--fg-2);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  text-transform: uppercase; letter-spacing: 0.06em;
  user-select: none; transition: color var(--dur-fast);
}
.sb-group-header:hover { color: var(--fg-0); }
.sb-group-header .chev { transition: transform var(--dur-fast); font-size: 9px; }
.sb-group.collapsed .chev { transform: rotate(-90deg); }
.sb-group-header .count {
  margin-left: auto; background: var(--bg-3); color: var(--fg-2);
  font-size: 10px; padding: 1px 6px; border-radius: var(--r-pill); font-weight: var(--fw-medium);
}
.sb-group-items { overflow: hidden; max-height: 5000px; transition: max-height var(--dur-med) var(--ease-out); }
.sb-group.collapsed .sb-group-items { max-height: 0; }
.sb-item {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 6px var(--sp-4) 6px 28px; cursor: grab; color: var(--fg-1);
  font-size: var(--fs-sm); transition: all var(--dur-fast);
  border-left: 2px solid transparent;
}
.sb-item:hover { background: var(--bg-2); color: var(--fg-0); border-left-color: var(--accent); }
.sb-item:active { cursor: grabbing; }
.sb-item .ic {
  width: 16px; height: 16px; display: grid; place-items: center;
  color: var(--fg-2); flex-shrink: 0;
}
.sb-item .ic svg { width: 14px; height: 14px; }
.sb-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .tag {
  font-size: 9px; padding: 1px 5px; border-radius: var(--r-xs);
  background: var(--bg-3); color: var(--fg-3); font-family: var(--font-mono);
}
.sb-item .tag.prim { background: var(--accent-soft); color: var(--accent); }
.sb-item .tag.app { background: rgba(45, 212, 191, 0.15); color: var(--success); }

/* ---------- Right panel (inspector + slots) ---------- */
#right-panel {
  grid-area: right; background: var(--bg-1); border-left: 1px solid var(--border-0);
  display: flex; flex-direction: column; z-index: var(--z-panel); overflow: hidden;
}
#right-panel .rp-tabs {
  display: flex; border-bottom: 1px solid var(--border-0);
  background: var(--bg-1);
}
#right-panel .rp-tab {
  flex: 1; padding: var(--sp-3) var(--sp-2); font-size: var(--fs-xs);
  font-weight: var(--fw-semibold); text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--fg-2); border-bottom: 2px solid transparent;
  transition: all var(--dur-fast);
}
#right-panel .rp-tab:hover { color: var(--fg-0); }
#right-panel .rp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.rp-body { flex: 1; overflow-y: auto; }
.rp-section { padding: var(--sp-4); border-bottom: 1px solid var(--border-0); }
.rp-section h3 {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: var(--sp-3);
}
.rp-row {
  display: flex; align-items: center; gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}
.rp-row label {
  font-size: var(--fs-sm); color: var(--fg-1); flex: 0 0 90px;
}
.rp-row input[type="text"], .rp-row input[type="number"],
.rp-row select, .rp-row textarea {
  flex: 1; background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); padding: 6px 8px; font-size: var(--fs-sm);
  outline: none; color: var(--fg-0);
}
.rp-row input:focus, .rp-row select:focus, .rp-row textarea:focus {
  border-color: var(--accent);
}
.rp-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.rp-row input[type="color"] {
  width: 32px; height: 28px; border-radius: var(--r-sm);
  border: 1px solid var(--border-1); background: none; cursor: pointer; padding: 2px;
}
.rp-row .toggle {
  width: 36px; height: 20px; border-radius: var(--r-pill);
  background: var(--bg-3); position: relative; cursor: pointer;
  transition: background var(--dur-fast);
}
.rp-row .toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2);
  transition: all var(--dur-fast);
}
.rp-row .toggle.on { background: var(--accent); }
.rp-row .toggle.on::after { left: 18px; background: var(--accent-fg); }

/* Theme picker */
.theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-2); }
.theme-swatch {
  aspect-ratio: 1; border-radius: var(--r-md); cursor: pointer;
  border: 2px solid var(--border-1); position: relative; overflow: hidden;
  transition: transform var(--dur-fast);
}
.theme-swatch:hover { transform: scale(1.05); }
.theme-swatch.active { border-color: var(--accent); box-shadow: var(--glow); }
.theme-swatch::after {
  content: attr(data-name); position: absolute; bottom: 2px; left: 0; right: 0;
  text-align: center; font-size: 8px; color: #fff; font-weight: var(--fw-bold);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}

/* Slot manager */
.slot-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.slot-item {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); background: var(--bg-2);
  border: 1px solid var(--border-0); border-radius: var(--r-md);
}
.slot-item .slot-z {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-family: var(--font-mono);
  font-weight: var(--fw-bold); font-size: var(--fs-sm);
}
.slot-item .slot-meta { flex: 1; min-width: 0; }
.slot-item .slot-name { font-size: var(--fs-sm); color: var(--fg-0); font-weight: var(--fw-medium); }
.slot-item .slot-desc { font-size: 10px; color: var(--fg-3); }
.slot-item .slot-vis { width: 20px; height: 20px; cursor: pointer; color: var(--fg-2); }
.slot-item .slot-vis:hover { color: var(--fg-0); }

/* App connectors */
.app-connector {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3); background: var(--bg-2); border-radius: var(--r-md);
  margin-bottom: var(--sp-2); border: 1px solid var(--border-0);
}
.app-connector .app-icon {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  display: grid; place-items: center; flex-shrink: 0; font-weight: var(--fw-bold);
}
.app-connector .app-icon.gpt { background: #10a37f; color: #fff; }
.app-connector .app-icon.claude { background: #d97757; color: #fff; }
.app-connector .app-icon.gemini { background: #4285f4; color: #fff; }
.app-connector .app-icon.perplex { background: #20808d; color: #fff; }
.app-connector .app-meta { flex: 1; }
.app-connector .app-name { font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.app-connector .app-status { font-size: 10px; }
.app-connector .app-status.connected { color: var(--success); }
.app-connector .app-status.disconnected { color: var(--fg-3); }
.app-connector .app-dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.app-connector .app-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
.app-connector .app-dot.disconnected { background: var(--fg-3); }

/* ---------- Command bar (chat-driven config) ---------- */
#command-bar {
  grid-area: cmd; background: var(--bg-1); border-top: 1px solid var(--border-0);
  display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4);
  z-index: var(--z-command); position: relative;
}
#command-bar .cmd-prompt {
  width: 32px; height: 32px; border-radius: var(--r-md);
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
#command-bar .cmd-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-size: var(--fs-md); color: var(--fg-0); padding: var(--sp-3) 0;
  font-family: var(--font-mono);
}
#command-bar .cmd-input::placeholder { color: var(--fg-3); }
#command-bar .cmd-actions { display: flex; gap: var(--sp-2); }
#command-bar .cmd-btn {
  height: 32px; padding: 0 var(--sp-3); border-radius: var(--r-md);
  background: var(--bg-2); color: var(--fg-1); font-size: var(--fs-sm);
  display: flex; align-items: center; gap: var(--sp-2);
  border: 1px solid var(--border-0); transition: all var(--dur-fast);
}
#command-bar .cmd-btn:hover { background: var(--bg-3); color: var(--fg-0); border-color: var(--border-1); }
#command-bar .cmd-btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
#command-bar .cmd-btn.primary:hover { filter: brightness(1.1); }
#command-bar .cmd-suggestions {
  position: absolute; bottom: calc(100% + 4px); left: var(--sp-4); right: var(--sp-4);
  background: var(--bg-2); border: 1px solid var(--border-1); border-radius: var(--r-md);
  box-shadow: var(--shadow-2); max-height: 240px; overflow-y: auto; display: none;
}
#command-bar .cmd-suggestions.show { display: block; }
.cmd-sugg-item {
  padding: var(--sp-2) var(--sp-3); cursor: pointer; display: flex; gap: var(--sp-3);
  align-items: center; border-bottom: 1px solid var(--border-0);
}
.cmd-sugg-item:last-child { border-bottom: none; }
.cmd-sugg-item:hover, .cmd-sugg-item.sel { background: var(--bg-3); }
.cmd-sugg-item .cmd-cat {
  font-size: 9px; padding: 1px 6px; border-radius: var(--r-xs);
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-mono); text-transform: uppercase;
}
.cmd-sugg-item .cmd-txt { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--fg-1); }

/* ---------- Nexus node (component instance on canvas) ---------- */
.nexus-node {
  position: absolute; transform-origin: 0 0;
  background: var(--bg-glass); backdrop-filter: blur(12px);
  border: 1px solid var(--border-1); border-radius: var(--r-md);
  box-shadow: var(--shadow-1); transition: box-shadow var(--dur-fast), border-color var(--dur-fast);
  overflow: hidden;
}
.nexus-node.selected { border-color: var(--accent); box-shadow: var(--glow), var(--shadow-1); }
.nexus-node .node-resize {
  position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
  cursor: nwse-resize; background:
    linear-gradient(135deg, transparent 50%, var(--accent) 50%);
  opacity: 0; transition: opacity var(--dur-fast);
}
.nexus-node:hover .node-resize, .nexus-node.selected .node-resize { opacity: 0.7; }
.nexus-node .node-handle {
  position: absolute; top: 0; left: 0; right: 0; height: 24px;
  cursor: move; display: flex; align-items: center; padding: 0 var(--sp-2);
  background: linear-gradient(to bottom, var(--bg-2), transparent);
  font-size: 10px; color: var(--fg-2); font-family: var(--font-mono);
  border-bottom: 1px solid var(--border-0); opacity: 0; transition: opacity var(--dur-fast);
}
.nexus-node:hover .node-handle, .nexus-node.selected .node-handle { opacity: 1; }
.nexus-node .node-handle .nm { flex: 1; }
.nexus-node .node-handle .del { cursor: pointer; color: var(--fg-3); padding: 2px 4px; border-radius: var(--r-xs); }
.nexus-node .node-handle .del:hover { color: var(--danger); background: rgba(244, 63, 94, 0.1); }
.nexus-node .node-body { padding: var(--sp-3); }

/* ---------- Toasts ---------- */
#toast-stack {
  position: fixed; bottom: calc(var(--shell-cmd-h) + var(--sp-4));
  right: var(--sp-4); display: flex; flex-direction: column-reverse; gap: var(--sp-2);
  z-index: var(--z-toast); pointer-events: none;
}
.toast {
  background: var(--bg-2); border: 1px solid var(--border-1); border-left: 3px solid var(--accent);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); min-width: 280px; max-width: 400px;
  box-shadow: var(--shadow-2); pointer-events: auto;
  animation: toast-in var(--dur-med) var(--ease-out);
  display: flex; gap: var(--sp-3); align-items: flex-start;
}
.toast.success { border-left-color: var(--success); }
.toast.warn { border-left-color: var(--warn); }
.toast.danger { border-left-color: var(--danger); }
.toast .toast-ic { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.toast .toast-body { flex: 1; }
.toast .toast-title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); margin-bottom: 2px; }
.toast .toast-msg { font-size: var(--fs-xs); color: var(--fg-2); }
@keyframes toast-in {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  z-index: var(--z-modal); display: grid; place-items: center;
  animation: fade-in var(--dur-fast);
}
.modal {
  background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); min-width: 480px; max-width: 80vw; max-height: 80vh;
  display: flex; flex-direction: column; overflow: hidden;
  animation: modal-in var(--dur-med) var(--ease-out);
}
.modal-header {
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border-0);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-family: var(--font-display); font-size: var(--fs-lg); }
.modal-body { padding: var(--sp-5); overflow-y: auto; }
.modal-footer {
  padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border-0);
  display: flex; justify-content: flex-end; gap: var(--sp-2);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---------- Workspaces switcher (top of sidebar) ---------- */
.workspace-switcher {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); background: var(--bg-2);
  border-radius: var(--r-md); cursor: pointer; border: 1px solid var(--border-0);
}
.workspace-switcher:hover { border-color: var(--border-1); }
.workspace-switcher .ws-icon {
  width: 20px; height: 20px; border-radius: var(--r-sm);
  background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; font-size: 10px; font-weight: var(--fw-bold);
}
.workspace-switcher .ws-name { flex: 1; font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.workspace-switcher .ws-chev { color: var(--fg-3); }

/* ---------- Status pill (slave fleet) ---------- */
#fleet-status {
  position: absolute; top: var(--sp-4); left: var(--sp-4);
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--bg-glass); backdrop-filter: blur(8px);
  border: 1px solid var(--border-0); border-radius: var(--r-pill);
  padding: 4px 12px 4px 8px; font-size: var(--fs-xs); z-index: var(--z-overlay);
}
#fleet-status .fleet-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success);
  box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite;
}
#fleet-status .fleet-dot.idle { background: var(--fg-3); box-shadow: none; animation: none; }
#fleet-status .fleet-count { font-family: var(--font-mono); color: var(--fg-1); font-weight: var(--fw-medium); }
#fleet-status .fleet-label { color: var(--fg-2); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Generic helpers */
.hidden { display: none !important; }
.row { display: flex; align-items: center; gap: var(--sp-2); }
.col { display: flex; flex-direction: column; gap: var(--sp-2); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--fg-2); }
.tiny { font-size: var(--fs-xs); }

/* ============================================================
   NEXUS 2.0 — Extended Styles
   ============================================================ */

/* --- DevTools Panel --- */
#devtools-panel {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 240px; min-height: 120px; max-height: 60vh;
  background: var(--bg-1); border-top: 1px solid var(--border-1);
  display: flex; flex-direction: column; z-index: var(--z-toolbar);
  resize: vertical; overflow: hidden;
  transform: translateY(100%); transition: transform var(--dur-med) var(--ease-out);
}
#devtools-panel.open { transform: translateY(0); }
#devtools-panel .dt-header {
  display: flex; align-items: center; padding: 0 var(--sp-4);
  border-bottom: 1px solid var(--border-0); height: 32px; flex-shrink: 0;
  background: var(--bg-2);
}
#devtools-panel .dt-tab {
  padding: 6px 12px; font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  color: var(--fg-2); border-bottom: 2px solid transparent; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.06em;
}
#devtools-panel .dt-tab:hover { color: var(--fg-0); }
#devtools-panel .dt-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
#devtools-panel .dt-body { flex: 1; overflow-y: auto; padding: var(--sp-2); }
.dt-log-entry { display: flex; gap: 8px; padding: 2px 8px; font-family: var(--font-mono); font-size: 11px; border-bottom: 1px solid var(--border-0); }
.dt-log-entry .dt-time { color: var(--fg-3); min-width: 70px; }
.dt-log-entry .dt-level { min-width: 40px; font-weight: 600; }
.dt-log-entry .dt-level.info { color: var(--info); }
.dt-log-entry .dt-level.warn { color: var(--warn); }
.dt-log-entry .dt-level.error { color: var(--danger); }
.dt-log-entry .dt-level.log { color: var(--fg-2); }
.dt-log-entry .dt-msg { color: var(--fg-1); flex: 1; word-break: break-all; }
.dt-log-entry .dt-src { color: var(--fg-3); font-size: 10px; min-width: 80px; }
.dt-state-tree { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
.dt-state-tree .dt-key { color: var(--accent); }
.dt-state-tree .dt-val { color: var(--success); }
.dt-state-tree .dt-obj { padding-left: 16px; border-left: 1px solid var(--border-0); margin-left: 4px; }
.dt-event-entry { display: flex; gap: 8px; padding: 2px 8px; font-family: var(--font-mono); font-size: 11px; border-bottom: 1px solid var(--border-0); }
.dt-event-entry .dt-ev-name { color: var(--info); min-width: 140px; }
.dt-event-entry .dt-ev-data { color: var(--fg-1); flex: 1; }
.dt-perf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; }
.dt-perf-card { background: var(--bg-2); border: 1px solid var(--border-0); border-radius: var(--r-md); padding: 10px; text-align: center; }
.dt-perf-card .dt-perf-val { font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: var(--fw-bold); color: var(--accent); }
.dt-perf-card .dt-perf-label { font-size: 10px; color: var(--fg-3); margin-top: 2px; text-transform: uppercase; }

/* --- Connection Lines SVG --- */
#connections-svg {
  position: absolute; inset: 0; pointer-events: none; z-index: 90;
  overflow: visible;
}
#connections-svg path.conn-line {
  fill: none; stroke: var(--accent); stroke-width: 2;
  stroke-dasharray: 8 4; opacity: 0.6;
  animation: dash-flow 1s linear infinite;
  pointer-events: stroke; cursor: pointer;
}
#connections-svg path.conn-line:hover { stroke-width: 3; opacity: 1; }
#connections-svg path.conn-line.temp { stroke: var(--warn); opacity: 0.8; }
@keyframes dash-flow { to { stroke-dashoffset: -12; } }
#connections-svg .conn-arrow { fill: var(--accent); }

/* --- Mini Map --- */
#mini-map {
  position: absolute; bottom: var(--sp-4); right: var(--sp-4);
  width: 160px; height: 100px; background: var(--bg-glass);
  backdrop-filter: blur(8px); border: 1px solid var(--border-1);
  border-radius: var(--r-md); z-index: var(--z-overlay);
  overflow: hidden; pointer-events: auto; cursor: pointer;
}
#mini-map .mm-viewport {
  position: absolute; border: 1.5px solid var(--accent);
  background: rgba(124, 92, 255, 0.08); border-radius: 2px;
  pointer-events: none;
}
#mini-map .mm-dot {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: var(--fg-1); pointer-events: none;
}

/* --- Keyboard Shortcuts Overlay --- */
#shortcuts-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px); z-index: var(--z-modal);
  display: grid; place-items: center;
  opacity: 0; pointer-events: none; transition: opacity var(--dur-fast);
}
#shortcuts-overlay.open { opacity: 1; pointer-events: auto; }
#shortcuts-overlay .sc-content {
  background: var(--bg-1); border: 1px solid var(--border-1);
  border-radius: var(--r-lg); padding: var(--sp-6); min-width: 520px;
  max-width: 80vw; max-height: 80vh; overflow-y: auto;
}
#shortcuts-overlay .sc-content h3 { font-family: var(--font-display); font-size: var(--fs-lg); margin-bottom: var(--sp-4); }
.sc-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border-0); }
.sc-row .sc-key { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.sc-row .sc-desc { font-size: var(--fs-sm); color: var(--fg-1); }

/* --- Generator Panel Styles --- */
.gen-editor {
  width: 100%; min-height: 300px; background: var(--bg-0);
  border: 1px solid var(--border-1); border-radius: var(--r-md);
  color: var(--fg-0); font-family: var(--font-mono); font-size: 12px;
  padding: var(--sp-3); resize: vertical; outline: none;
  line-height: 1.6; tab-size: 2;
}
.gen-editor:focus { border-color: var(--accent); }
.gen-toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.gen-toolbar select { background: var(--bg-2); border: 1px solid var(--border-0); border-radius: var(--r-sm); color: var(--fg-0); font-size: 11px; padding: 4px 8px; outline: none; }
.gen-toolbar select:focus { border-color: var(--accent); }
.gen-preview { background: var(--bg-0); border: 1px solid var(--border-1); border-radius: var(--r-md); padding: var(--sp-3); min-height: 100px; max-height: 200px; overflow: auto; }
.gen-error { background: rgba(244, 63, 94, 0.1); border: 1px solid var(--danger); border-radius: var(--r-sm); padding: 8px; color: var(--danger); font-size: 11px; font-family: var(--font-mono); margin-top: 8px; }
.gen-success { background: rgba(45, 212, 191, 0.1); border: 1px solid var(--success); border-radius: var(--r-sm); padding: 8px; color: var(--success); font-size: 11px; font-family: var(--font-mono); margin-top: 8px; }

/* --- Plugin Marketplace --- */
.pm-installed, .pm-available { margin-bottom: var(--sp-4); }
.pm-plugin {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3); background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-md); margin-bottom: var(--sp-2);
}
.pm-plugin .pm-icon { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.pm-plugin .pm-meta { flex: 1; min-width: 0; }
.pm-plugin .pm-name { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--fg-0); }
.pm-plugin .pm-desc { font-size: 10px; color: var(--fg-3); margin-top: 1px; }
.pm-plugin .pm-ver { font-size: 10px; color: var(--fg-2); font-family: var(--font-mono); }
.pm-plugin .pm-actions { display: flex; gap: 4px; }
.pm-toggle { width: 28px; height: 16px; border-radius: var(--r-pill); background: var(--bg-3); position: relative; cursor: pointer; transition: background var(--dur-fast); flex-shrink: 0; }
.pm-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg-2); transition: all var(--dur-fast); }
.pm-toggle.on { background: var(--accent); }
.pm-toggle.on::after { left: 14px; background: var(--accent-fg); }

/* --- Theme Studio Enhanced --- */
.ts-group { margin-bottom: var(--sp-4); }
.ts-group-title { font-size: 10px; text-transform: uppercase; color: var(--fg-3); letter-spacing: 0.08em; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.ts-group-title .chev { transition: transform var(--dur-fast); font-size: 9px; }
.ts-group.collapsed .ts-group-items { display: none; }
.ts-group.collapsed .chev { transform: rotate(-90deg); }
.ts-token-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.ts-token-row .ts-name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); min-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ts-token-row input[type="color"] { width: 24px; height: 20px; border: 1px solid var(--border-1); border-radius: 3px; padding: 1px; cursor: pointer; background: none; }
.ts-token-row input[type="text"], .ts-token-row input[type="number"] { flex: 1; background: var(--bg-0); border: 1px solid var(--border-0); border-radius: 3px; color: var(--fg-0); font-family: var(--font-mono); font-size: 10px; padding: 3px 6px; outline: none; min-width: 0; }
.ts-token-row input[type="text"]:focus, .ts-token-row input[type="number"]:focus { border-color: var(--accent); }
.ts-create-btn { width: 100%; height: 32px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 600; cursor: pointer; border: none; transition: filter var(--dur-fast); }
.ts-create-btn:hover { filter: brightness(1.15); }
.ts-export-btn, .ts-import-btn { flex: 1; height: 28px; border-radius: var(--r-sm); background: var(--bg-3); color: var(--fg-1); font-size: 10px; cursor: pointer; border: 1px solid var(--border-0); }
.ts-export-btn:hover, .ts-import-btn:hover { background: var(--bg-2); color: var(--fg-0); }

/* --- Data Panel --- */
.data-key-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border-0); }
.data-key-name { font-family: var(--font-mono); font-size: 11px; color: var(--accent); min-width: 80px; }
.data-key-val { flex: 1; font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); background: var(--bg-0); border: 1px solid var(--border-0); border-radius: 3px; padding: 2px 6px; outline: none; }
.data-key-val:focus { border-color: var(--accent); }
.data-event-row { display: flex; gap: 6px; padding: 2px 0; font-family: var(--font-mono); font-size: 10px; border-bottom: 1px solid var(--border-0); }
.data-event-row .de-name { color: var(--info); min-width: 100px; }
.data-event-row .de-data { color: var(--fg-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- Connection panel in right sidebar --- */
.conn-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg-2); border-radius: var(--r-sm); margin-bottom: 4px; font-size: 11px; }
.conn-item .conn-arrow { color: var(--accent); }
.conn-item .conn-del { margin-left: auto; color: var(--fg-3); cursor: pointer; padding: 2px; }
.conn-item .conn-del:hover { color: var(--danger); }

/* --- Selection box --- */
#selection-box {
  position: absolute; border: 1px dashed var(--accent); background: var(--accent-soft);
  pointer-events: none; z-index: 95; display: none;
}

/* --- Snap indicator --- */
.snap-line { position: absolute; background: var(--accent); opacity: 0.5; z-index: 95; pointer-events: none; }
.snap-line.h { height: 1px; left: 0; right: 0; }
.snap-line.v { width: 1px; top: 0; bottom: 0; }

/* --- Multi-select node highlight --- */
.nexus-node.multi-selected { outline: 2px solid var(--info); outline-offset: 1px; }

/* --- Version history --- */
.version-timeline { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.version-entry { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg-2); border-radius: var(--r-sm); font-size: 11px; cursor: pointer; }
.version-entry:hover { background: var(--bg-3); }
.version-entry.current { border-left: 2px solid var(--accent); }
.version-entry .v-num { font-family: var(--font-mono); color: var(--accent); font-weight: 600; min-width: 24px; }
.version-entry .v-time { color: var(--fg-3); font-size: 10px; margin-left: auto; }
.version-entry .v-rollback { color: var(--fg-3); cursor: pointer; padding: 2px 4px; border-radius: 3px; }
.version-entry .v-rollback:hover { color: var(--warn); background: var(--bg-3); }

/* ============================================================
   NEXUS 3.0 — Tools Generator UI
   ============================================================ */

/* Tools Panel container */
.tools-panel { display: flex; flex-direction: column; gap: var(--sp-3); }
.tools-section { background: var(--bg-2); border: 1px solid var(--border-0); border-radius: var(--r-md); padding: var(--sp-3); }
.tools-section h4 {
  font-family: var(--font-display); font-size: var(--fs-xs); font-weight: var(--fw-bold);
  color: var(--fg-1); text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-2);
}
.tools-section h4 .ic { display: grid; place-items: center; color: var(--accent); }
.tools-section h4 .count {
  margin-left: auto; background: var(--accent-soft); color: var(--accent);
  padding: 1px 8px; border-radius: var(--r-pill); font-size: 10px; font-weight: var(--fw-bold);
}

/* Tool Generator Wizard */
.tg-wizard { display: flex; flex-direction: column; gap: var(--sp-3); }
.tg-step {
  display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs);
  color: var(--fg-2); padding: 4px 0;
}
.tg-step .step-num {
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg-3); color: var(--fg-2); font-size: 10px; font-weight: var(--fw-bold);
}
.tg-step.active .step-num { background: var(--accent); color: var(--accent-fg); }
.tg-step.done .step-num { background: var(--success); color: var(--bg-0); }
.tg-step .step-label { color: var(--fg-1); font-weight: var(--fw-medium); }

/* NL description input */
.tg-nl-input {
  width: 100%; min-height: 80px; resize: vertical;
  background: var(--bg-0); border: 1px solid var(--border-1);
  border-radius: var(--r-md); padding: var(--sp-3); color: var(--fg-0);
  font-size: var(--fs-sm); font-family: var(--font-sans);
  outline: none; transition: border-color var(--dur-fast);
}
.tg-nl-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tg-nl-input::placeholder { color: var(--fg-3); }

/* Tool category chips */
.tg-cat-chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.tg-cat-chip {
  padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid var(--border-1);
  background: var(--bg-2); color: var(--fg-2); font-size: var(--fs-xs);
  cursor: pointer; transition: all var(--dur-fast); user-select: none;
  display: inline-flex; align-items: center; gap: 4px;
}
.tg-cat-chip:hover { background: var(--bg-3); color: var(--fg-0); }
.tg-cat-chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* Schema builder */
.tg-schema-builder {
  background: var(--bg-0); border: 1px solid var(--border-0);
  border-radius: var(--r-md); padding: var(--sp-3);
}
.tg-schema-row {
  display: grid; grid-template-columns: 1.4fr 1fr 1fr 24px; gap: var(--sp-2);
  margin-bottom: var(--sp-2); align-items: center;
}
.tg-schema-row input, .tg-schema-row select {
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); padding: 4px 6px; font-size: var(--fs-xs);
  color: var(--fg-0); outline: none; font-family: var(--font-mono);
}
.tg-schema-row input:focus, .tg-schema-row select:focus { border-color: var(--accent); }
.tg-schema-row .tg-del {
  width: 24px; height: 24px; border-radius: var(--r-sm);
  background: var(--bg-3); color: var(--fg-2);
  display: grid; place-items: center; cursor: pointer;
  transition: all var(--dur-fast);
}
.tg-schema-row .tg-del:hover { background: var(--danger); color: #fff; }
.tg-schema-add {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--r-sm); background: var(--bg-2);
  border: 1px dashed var(--border-1); color: var(--fg-2); font-size: var(--fs-xs);
  cursor: pointer; transition: all var(--dur-fast);
}
.tg-schema-add:hover { border-color: var(--accent); color: var(--accent); }

/* Tool cards (browser) */
.tg-tool-grid { display: flex; flex-direction: column; gap: var(--sp-2); }
.tg-tool-card {
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-md); padding: var(--sp-3);
  cursor: pointer; transition: all var(--dur-fast);
  display: flex; flex-direction: column; gap: 6px; position: relative;
}
.tg-tool-card:hover { border-color: var(--accent); background: var(--bg-3); transform: translateY(-1px); }
.tg-tool-card.selected { border-color: var(--accent); box-shadow: var(--glow); }
.tg-tool-card .tc-head { display: flex; align-items: center; gap: var(--sp-2); }
.tg-tool-card .tc-icon {
  width: 28px; height: 28px; border-radius: var(--r-sm);
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.tg-tool-card .tc-title {
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--fg-0);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tg-tool-card .tc-cat {
  font-size: 9px; padding: 2px 6px; border-radius: var(--r-xs);
  background: var(--bg-3); color: var(--fg-2); font-family: var(--font-mono);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.tg-tool-card .tc-desc {
  font-size: var(--fs-xs); color: var(--fg-2); line-height: 1.5;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.tg-tool-card .tc-params {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;
}
.tg-tool-card .tc-param {
  font-size: 9px; padding: 1px 6px; border-radius: var(--r-xs);
  background: var(--bg-0); color: var(--fg-3); font-family: var(--font-mono);
  border: 1px solid var(--border-0);
}
.tg-tool-card .tc-actions {
  display: flex; gap: 4px; margin-top: 4px; opacity: 0;
  transition: opacity var(--dur-fast);
}
.tg-tool-card:hover .tc-actions { opacity: 1; }
.tg-tool-card .tc-act-btn {
  padding: 3px 8px; border-radius: var(--r-xs); background: var(--bg-1);
  border: 1px solid var(--border-0); color: var(--fg-2); font-size: 10px;
  cursor: pointer; transition: all var(--dur-fast);
}
.tg-tool-card .tc-act-btn:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tg-tool-card .tc-act-btn.danger:hover { background: var(--danger); border-color: var(--danger); }

/* Tool tester */
.tg-tester {
  background: var(--bg-0); border: 1px solid var(--border-1);
  border-radius: var(--r-md); padding: var(--sp-3);
}
.tg-tester-row { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.tg-tester-row label {
  font-size: var(--fs-xs); color: var(--fg-2); flex: 0 0 80px;
  font-family: var(--font-mono);
}
.tg-tester-row input, .tg-tester-row textarea {
  flex: 1; background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); padding: 6px 8px; font-size: var(--fs-xs);
  color: var(--fg-0); outline: none; font-family: var(--font-mono);
}
.tg-tester-row input:focus, .tg-tester-row textarea:focus { border-color: var(--accent); }
.tg-run-btn {
  padding: 6px 14px; border-radius: var(--r-sm); background: var(--accent);
  color: var(--accent-fg); font-size: var(--fs-xs); font-weight: var(--fw-bold);
  cursor: pointer; border: none; transition: all var(--dur-fast);
  display: inline-flex; align-items: center; gap: 4px;
}
.tg-run-btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
.tg-run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.tg-run-btn.running { background: var(--warn); animation: tg-pulse 1s infinite; }
@keyframes tg-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

/* Tool output */
.tg-output {
  background: var(--bg-0); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); padding: var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--fg-1); white-space: pre-wrap; max-height: 200px; overflow-y: auto;
  margin-top: var(--sp-2);
}
.tg-output.success { border-color: var(--success); }
.tg-output.error { border-color: var(--danger); }
.tg-output .tg-out-label {
  font-size: 9px; color: var(--fg-3); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 4px; display: block;
}

/* Export format selector */
.tg-export-bar {
  display: flex; gap: var(--sp-2); align-items: center;
  padding: var(--sp-2); background: var(--bg-2); border-radius: var(--r-md);
  margin-top: var(--sp-2);
}
.tg-export-bar select {
  background: var(--bg-0); border: 1px solid var(--border-0); border-radius: var(--r-sm);
  padding: 4px 8px; color: var(--fg-0); font-size: var(--fs-xs); outline: none;
  font-family: var(--font-mono);
}
.tg-export-bar button {
  padding: 4px 10px; border-radius: var(--r-sm); background: var(--bg-3);
  color: var(--fg-1); font-size: var(--fs-xs); cursor: pointer;
  border: 1px solid var(--border-0); transition: all var(--dur-fast);
}
.tg-export-bar button:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* Code preview (syntax highlighted) */
.tg-code-preview {
  background: #0d1117; border: 1px solid var(--border-1); border-radius: var(--r-md);
  padding: var(--sp-3); font-family: var(--font-mono); font-size: 11px;
  color: #c9d1d9; max-height: 300px; overflow: auto; line-height: 1.5;
  white-space: pre;
}
.tg-code-preview .tok-key { color: #79c0ff; }
.tg-code-preview .tok-str { color: #a5d6ff; }
.tg-code-preview .tok-num { color: #ffa657; }
.tg-code-preview .tok-bool { color: #d2a8ff; }
.tg-code-preview .tok-comment { color: #8b949e; font-style: italic; }
.tg-code-preview .tok-punc { color: #c9d1d9; }

/* Tool badges */
.tg-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; border-radius: var(--r-xs); font-size: 9px;
  font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.05em;
}
.tg-badge.search { background: rgba(56,189,248,0.15); color: var(--info); }
.tg-badge.data { background: rgba(45,212,191,0.15); color: var(--success); }
.tg-badge.ai { background: rgba(124,92,255,0.15); color: var(--accent); }
.tg-badge.file { background: rgba(251,191,36,0.15); color: var(--warn); }
.tg-badge.dev { background: rgba(244,63,94,0.15); color: var(--danger); }
.tg-badge.net { background: rgba(179,136,255,0.15); color: #b388ff; }

/* Tool node (canvas) */
.nexus-node.tool-node {
  border: 1px solid var(--accent) !important;
  box-shadow: 0 0 12px var(--accent-soft);
}
.nexus-node.tool-node::before {
  content: 'TOOL'; position: absolute; top: -8px; left: 8px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
  background: var(--accent); color: var(--accent-fg);
  padding: 1px 6px; border-radius: var(--r-xs);
}

/* Tool chain visualization */
.tg-chain {
  display: flex; flex-direction: column; gap: var(--sp-2);
  background: var(--bg-2); border-radius: var(--r-md); padding: var(--sp-3);
}
.tg-chain-step {
  display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2);
  background: var(--bg-1); border-radius: var(--r-sm); border: 1px solid var(--border-0);
}
.tg-chain-step .cs-num {
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
  color: var(--accent-fg); display: grid; place-items: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
}
.tg-chain-step .cs-name { flex: 1; font-size: var(--fs-xs); color: var(--fg-0); font-weight: var(--fw-medium); }
.tg-chain-step .cs-del { color: var(--fg-3); cursor: pointer; padding: 2px 4px; }
.tg-chain-step .cs-del:hover { color: var(--danger); }
.tg-chain-arrow {
  text-align: center; color: var(--accent); font-size: 14px; line-height: 1;
}

/* Tool history */
.tg-history-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
.tg-history-item {
  display: flex; align-items: center; gap: var(--sp-2); padding: 6px 8px;
  background: var(--bg-2); border-radius: var(--r-sm); cursor: pointer;
  border: 1px solid var(--border-0); transition: all var(--dur-fast);
}
.tg-history-item:hover { background: var(--bg-3); border-color: var(--border-1); }
.tg-history-item .hi-icon { color: var(--fg-3); display: grid; place-items: center; }
.tg-history-item .hi-text { flex: 1; font-size: var(--fs-xs); color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg-history-item .hi-time { font-size: 9px; color: var(--fg-3); font-family: var(--font-mono); }

/* Tool search/filter bar */
.tg-search-bar {
  display: flex; gap: var(--sp-2); margin-bottom: var(--sp-3); align-items: center;
}
.tg-search-bar input {
  flex: 1; background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-md); padding: 6px 10px; font-size: var(--fs-sm);
  color: var(--fg-0); outline: none;
}
.tg-search-bar input:focus { border-color: var(--accent); }
.tg-search-bar select {
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-md); padding: 6px 10px; font-size: var(--fs-xs);
  color: var(--fg-1); outline: none; cursor: pointer;
}

/* Tool stats footer */
.tg-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2);
  padding: var(--sp-3); background: var(--bg-2); border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
}
.tg-stat { text-align: center; }
.tg-stat .stat-num {
  font-family: var(--font-display); font-size: var(--fs-xl); font-weight: var(--fw-black);
  color: var(--accent); line-height: 1;
}
.tg-stat .stat-label {
  font-size: 9px; color: var(--fg-3); text-transform: uppercase;
  letter-spacing: 0.08em; margin-top: 2px;
}

/* Generator mode toggle */
.tg-mode-toggle {
  display: flex; gap: 2px; background: var(--bg-2); padding: 2px;
  border-radius: var(--r-md); border: 1px solid var(--border-0);
}
.tg-mode-toggle button {
  flex: 1; padding: 6px 10px; font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  color: var(--fg-2); border-radius: var(--r-sm); cursor: pointer;
  transition: all var(--dur-fast);
}
.tg-mode-toggle button.active { background: var(--accent); color: var(--accent-fg); }

/* Hints */
.tg-hint {
  font-size: 10px; color: var(--fg-3); padding: 6px 8px;
  background: var(--bg-2); border-radius: var(--r-sm);
  border-left: 2px solid var(--info); margin-top: var(--sp-2);
}
.tg-hint b { color: var(--info); }

/* Favorite star */
.tg-star {
  cursor: pointer; color: var(--fg-3); transition: color var(--dur-fast);
  display: grid; place-items: center; width: 16px; height: 16px;
}
.tg-star:hover { color: var(--warn); }
.tg-star.active { color: var(--warn); }

/* Responsive: hide some columns in narrow sidebar */
@media (max-width: 1400px) {
  .tg-stats { grid-template-columns: repeat(2, 1fr); }
}

</style>

  <!-- SIDEBAR : Component Registry Browser -->
