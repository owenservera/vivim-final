<script>
/* ============================================================
   NEXUS SHELL — Single-file pure-HTML application
   ============================================================
   Architecture:
     1. DesignSystem   — CSS-variable theme tokens (in <style>)
     2. SchemaValidator— validates component configs against JSON-schema
     3. ComponentRegistry — central store of components + plugins
     4. PluginLoader   — hot-swap plugins / themes at runtime
     5. ThemeEngine    — swap [data-theme] and custom token overrides
     6. Canvas3D       — Three.js infinite XYZ canvas + Z-layer system
     7. WorkspaceManager — multi-workspace isolation
     8. CommandParser  — chat-box natural-language command interpreter
     9. BackendBridge  — chrome slave fleet connector + app adapters
    10. ComponentLibrary — 100 default components (defined later in file)
   ============================================================ */
window.NEXUS = window.NEXUS || {};
</script>


<script>
window.NEXUS = window.NEXUS || {};
</script>
<script>
"use strict";
/* ============================================================
   1. SCHEMA VALIDATOR
   Lightweight JSON-schema-like validator. Validates component
   configs, plugin manifests, and command payloads.
   ============================================================ */
NEXUS.SchemaValidator = (function() {
  const types = {
    string: v => typeof v === 'string',
    number: v => typeof v === 'number' && !isNaN(v),
    integer: v => Number.isInteger(v),
    boolean: v => typeof v === 'boolean',
    array: v => Array.isArray(v),
    object: v => v && typeof v === 'object' && !Array.isArray(v),
    color: v => typeof v === 'string' && /^(#([0-9a-f]{3}|[0-9a-f]{6})|rgb|hsl|var\(--|linear-gradient)/i.test(v),
    url: v => typeof v === 'string' && /^(https?:|file:|data:|blob:|~\/|\.\/|\.\.\/)/.test(v),
    enum: (v, opts) => opts.includes(v),
  };
  function validate(value, schema, path = '') {
    if (!schema) return { ok: true };
    if (schema.$ref) return validate(value, NEXUS.SchemaValidator._refs[schema.$ref], path);
    const errs = [];
    if (schema.type && !types[schema.type](value, schema.enum || schema.options || [])) {
      errs.push({ path, msg: `expected ${schema.type}, got ${typeof value}` });
      return errs;
    }
    if (schema.enum && !schema.enum.includes(value)) {
      errs.push({ path, msg: `must be one of: ${schema.enum.join(', ')}` });
    }
    if (schema.min !== undefined && value < schema.min) errs.push({ path, msg: `must be >= ${schema.min}` });
    if (schema.max !== undefined && value > schema.max) errs.push({ path, msg: `must be <= ${schema.max}` });
    if (schema.pattern && !new RegExp(schema.pattern).test(value)) errs.push({ path, msg: `pattern mismatch` });
    if (schema.required && (value === undefined || value === null || value === '')) {
      errs.push({ path, msg: 'is required' });
    }
    if (schema.properties && typeof value === 'object') {
      for (const key in schema.properties) {
        const sub = schema.properties[key];
        if (value[key] !== undefined || (sub && sub.required)) {
          errs.push(...validate(value[key], sub, path ? `${path}.${key}` : key));
        }
      }
    }
    if (schema.items && Array.isArray(value)) {
      value.forEach((item, i) => errs.push(...validate(item, schema.items, `${path}[${i}]`)));
    }
    return errs;
  }
  return { validate, types, _refs: {} };
})();
NEXUS.S = NEXUS.SchemaValidator; // shorthand

/* ============================================================
   2. COMPONENT REGISTRY
   Central store for components and plugins. Each component has:
     - id, name, category, taxonomy, schema, defaultProps, render()
   Plugins are bundles of components + themes + commands.
   ============================================================ */
NEXUS.ComponentRegistry = (function() {
  const _components = new Map();
  const _plugins = new Map();
  const _categories = new Map();

  function register(comp) {
    if (!comp.id) throw new Error('Component must have id');
    if (_components.has(comp.id)) console.warn('[Registry] Overwriting component:', comp.id);
    // Validate component definition against plugin taxonomy schema
    const schema = {
      type: 'object',
      properties: {
        id: { type: 'string', required: true, pattern: /^[a-z][a-z0-9-]*$/ },
        name: { type: 'string', required: true },
        category: { type: 'string', required: true },
        taxonomy: { type: 'object' },
        schema: { type: 'object' },
        defaultProps: { type: 'object' },
        render: { type: 'object' }, // function serialized indicator
        icon: { type: 'string' },
        tags: { type: 'array' },
      }
    };
    const errs = NEXUS.S.validate(comp, schema);
    if (errs.length) console.warn('[Registry] Validation issues for', comp.id, errs);

    _components.set(comp.id, comp);
    if (!_categories.has(comp.category)) _categories.set(comp.category, []);
    _categories.get(comp.category).push(comp);
    return comp;
  }

  function get(id) { return _components.get(id); }
  function all() { return Array.from(_components.values()); }
  function categories() { return Array.from(_categories.keys()); }
  function byCategory(cat) { return _categories.get(cat) || []; }
  function search(q) {
    if (!q) return all();
    const ql = q.toLowerCase();
    return all().filter(c =>
      c.name.toLowerCase().includes(ql) ||
      c.id.includes(ql) ||
      c.category.toLowerCase().includes(ql) ||
      (c.tags || []).some(t => t.toLowerCase().includes(ql))
    );
  }

  function registerPlugin(plugin) {
    if (!plugin.id) throw new Error('Plugin must have id');
    _plugins.set(plugin.id, plugin);
    (plugin.components || []).forEach(register);
    if (plugin.themes) plugin.themes.forEach(t => NEXUS.ThemeEngine.registerTheme(t));
    if (plugin.commands) plugin.commands.forEach(c => NEXUS.CommandParser.registerCommand(c));
    console.log(`[Registry] Plugin loaded: ${plugin.id} (${(plugin.components || []).length} components)`);
    return plugin;
  }

  function unregisterPlugin(pluginId) {
    const plugin = _plugins.get(pluginId);
    if (!plugin) return;
    (plugin.components || []).forEach(c => {
      _components.delete(c.id);
      const cat = _categories.get(c.category);
      if (cat) {
        const i = cat.indexOf(c);
        if (i >= 0) cat.splice(i, 1);
        if (!cat.length) _categories.delete(c.category);
      }
    });
    _plugins.delete(pluginId);
    console.log(`[Registry] Plugin unloaded: ${pluginId}`);
  }

  function hotSwap(pluginId, newPlugin) {
    unregisterPlugin(pluginId);
    return registerPlugin(newPlugin);
  }

  function exportSchema() {
    return {
      version: '1.0.0',
      generatedAt: new Date().toISOString(),
      plugins: Array.from(_plugins.values()).map(p => ({
        id: p.id, name: p.name, version: p.version,
        components: (p.components || []).map(c => c.id),
      })),
      components: all().map(c => ({
        id: c.id, name: c.name, category: c.category,
        taxonomy: c.taxonomy, schema: c.schema, defaultProps: c.defaultProps,
        tags: c.tags || [],
      })),
      categories: categories().map(cat => ({
        name: cat, count: byCategory(cat).length,
      })),
    };
  }

  return { register, get, all, categories, byCategory, search,
           registerPlugin, unregisterPlugin, hotSwap, exportSchema,
           get plugins() { return Array.from(_plugins.values()); },
           get count() { return _components.size; },
           get pluginCount() { return _plugins.size; } };
})();

/* ============================================================
   3. PLUGIN LOADER
   Hot-swappable plugin system. Plugins can be:
     - Inline JS objects (registered directly)
     - URLs (fetched and eval'd in sandbox)
     - Data URIs (user-authored snippets)
   ============================================================ */
NEXUS.PluginLoader = (function() {
  const _loaded = new Map();
  async function loadFromObject(plugin) {
    if (!plugin.id) throw new Error('Plugin requires id');
    if (_loaded.has(plugin.id)) {
      console.warn('[PluginLoader] Reloading plugin (hot-swap):', plugin.id);
      NEXUS.ComponentRegistry.unregisterPlugin(plugin.id);
    }
    NEXUS.ComponentRegistry.registerPlugin(plugin);
    _loaded.set(plugin.id, { plugin, loadedAt: Date.now() });
    return plugin;
  }
  async function loadFromUrl(url) {
    const res = await fetch(url);
    const code = await res.text();
    return loadFromCode(code, url);
  }
  async function loadFromCode(code, source = 'inline') {
    try {
      const fn = new Function('NEXUS', code);
      const exports = {};
      fn({ ...NEXUS, exports });
      const plugin = exports.plugin || exports.default || exports;
      if (!plugin.id) plugin.id = `user-${Date.now()}`;
      plugin._source = source;
      return loadFromObject(plugin);
    } catch (e) {
      console.error('[PluginLoader] Failed to load:', e);
      throw e;
    }
  }
  function unload(pluginId) {
    NEXUS.ComponentRegistry.unregisterPlugin(pluginId);
    _loaded.delete(pluginId);
  }
  function list() { return Array.from(_loaded.values()); }
  return { loadFromObject, loadFromUrl, loadFromCode, unload, list };
})();

/* ============================================================
   4. THEME ENGINE
   Hot-swap themes at runtime. Themes are CSS-variable bundles.
   Users can override individual tokens via command box.
   ============================================================ */
NEXUS.ThemeEngine = (function() {
  const _themes = new Map();
  const _overrides = {}; // user-level token overrides

  function registerTheme(theme) {
    _themes.set(theme.id, theme);
  }

  function apply(themeId) {
    const theme = _themes.get(themeId);
    if (!theme) { console.warn('[ThemeEngine] Unknown theme:', themeId); return; }
    document.documentElement.setAttribute('data-theme', theme.id);
    // Apply any custom tokens
    if (theme.tokens) {
      Object.entries(theme.tokens).forEach(([k, v]) => {
        document.documentElement.style.setProperty(k, v);
      });
    }
    // Re-apply user overrides
    Object.entries(_overrides).forEach(([k, v]) => {
      document.documentElement.style.setProperty(k, v);
    });
    NEXUS.Toast.show({ title: 'Theme applied', message: theme.name, type: 'success' });
  }

  function setToken(token, value) {
    _overrides[token] = value;
    document.documentElement.style.setProperty(token, value);
  }

  function resetToken(token) {
    delete _overrides[token];
    document.documentElement.style.removeProperty(token);
  }

  function list() { return Array.from(_themes.values()); }
  function get(id) { return _themes.get(id); }

  // Register the 5 built-in themes
  [
    { id: 'midnight', name: 'Midnight', accent: '#7c5cff' },
    { id: 'daylight', name: 'Daylight', accent: '#4f46e5' },
    { id: 'carbon', name: 'Carbon', accent: '#f97316' },
    { id: 'cyber', name: 'Cyber', accent: '#00f0ff' },
    { id: 'paper', name: 'Paper', accent: '#b45309' },
  ].forEach(registerTheme);

  return { registerTheme, apply, setToken, resetToken, list, get };
})();

/* ============================================================
   5. WORKSPACE MANAGER
   Each workspace has its own: nodes, Z-layers, viewport state.
   ============================================================ */
NEXUS.WorkspaceManager = (function() {
  const _workspaces = new Map();
  let _active = null;
  const _listeners = [];

  function create(id, name) {
    const ws = {
      id: id || `ws-${Date.now()}`,
      name: name || 'Untitled Workspace',
      icon: (name || 'U')[0].toUpperCase(),
      nodes: [],            // { id, componentId, x, y, z, w, h, props }
      zLayers: [
        { id: 'z0', z: 0, name: 'Base Layer', visible: true, locked: false },
        { id: 'z1', z: 100, name: 'Overlay', visible: true, locked: false },
        { id: 'z2', z: 200, name: 'HUD', visible: true, locked: false },
      ],
      activeLayerId: 'z0',
      viewport: { x: 0, y: 0, zoom: 1 },
      createdAt: Date.now(),
    };
    _workspaces.set(ws.id, ws);
    return ws;
  }

  function activate(id) {
    _active = _workspaces.get(id);
    _listeners.forEach(fn => fn(_active));
  }

  function getActive() { return _active; }
  function list() { return Array.from(_workspaces.values()); }
  function get(id) { return _workspaces.get(id); }

  function addNode(node) {
    if (!_active) return;
    _active.nodes.push(node);
    _listeners.forEach(fn => fn(_active));
  }

  function removeNode(nodeId) {
    if (!_active) return;
    _active.nodes = _active.nodes.filter(n => n.id !== nodeId);
    _listeners.forEach(fn => fn(_active));
  }

  function updateNode(nodeId, patch) {
    if (!_active) return;
    const n = _active.nodes.find(n => n.id === nodeId);
    if (n) Object.assign(n, patch);
    _listeners.forEach(fn => fn(_active));
  }

  function addLayer(name) {
    if (!_active) return;
    const idx = _active.zLayers.length;
    const layer = {
      id: `z${idx}_${Date.now()}`,
      z: idx * 100,
      name: name || `Layer ${idx + 1}`,
      visible: true, locked: false,
    };
    _active.zLayers.push(layer);
    _active.activeLayerId = layer.id;
    _listeners.forEach(fn => fn(_active));
    return layer;
  }

  function toggleLayer(layerId) {
    if (!_active) return;
    const l = _active.zLayers.find(l => l.id === layerId);
    if (l) l.visible = !l.visible;
    _listeners.forEach(fn => fn(_active));
  }

  function setActiveLayer(layerId) {
    if (!_active) return;
    _active.activeLayerId = layerId;
    _listeners.forEach(fn => fn(_active));
  }

  function on(fn) { _listeners.push(fn); }

  // Seed with default workspaces
  create('ws-primary', 'Primary');
  create('ws-chat', 'Chat Studio');
  create('ws-research', 'Research Lab');
  activate('ws-primary');

  return { create, activate, getActive, list, get, addNode, removeNode,
           updateNode, addLayer, toggleLayer, setActiveLayer, on };
})();

/* ============================================================
   6. TOAST + MODAL helpers
   ============================================================ */
NEXUS.Toast = (function() {
  function show({ title, message, type = 'info', duration = 4000 }) {
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const icons = {
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
      danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
    };
    el.innerHTML = `
      <div class="toast-ic" style="color: var(--${type === 'info' ? 'accent' : type})">${icons[type] || icons.info}</div>
      <div class="toast-body">
        <div class="toast-title">${title}</div>
        ${message ? `<div class="toast-msg">${message}</div>` : ''}
      </div>`;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateX(20px)';
      setTimeout(() => el.remove(), 300);
    }, duration);
  }
  return { show };
})();

NEXUS.Modal = (function() {
  function show({ title, body, actions = [] }) {
    const root = document.getElementById('modal-root');
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal">
        <div class="modal-header"><h3>${title}</h3></div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">
          ${actions.map((a, i) => `<button class="cmd-btn ${a.primary ? 'primary' : ''}" data-act="${i}">${a.label}</button>`).join('')}
        </div>
      </div>`;
    root.appendChild(back);
    actions.forEach((a, i) => {
      back.querySelector(`[data-act="${i}"]`).onclick = () => {
        if (a.onClick) a.onClick(back);
        if (a.close !== false) back.remove();
      };
    });
    back.onclick = e => { if (e.target === back) back.remove(); };
    return back;
  }
  return { show };
})();
</script>
<script>
"use strict";
/* ============================================================
   7. CANVAS 3D
   Three.js orthographic infinite canvas. The HTML overlay floats
   above the 3D scene and is transformed (translate + scale) to
   match camera pan/zoom. Z-layers are real Z-axis offsets that
   give a parallax depth effect.
   ============================================================ */
NEXUS.Canvas3D = (function() {
  let renderer, camera, scene, grid, gridBack, gridFar;
  let canvasEl, overlayEl;
  const VIEW = { x: 0, y: 0, zoom: 1 };
  const DEPTH_SCALE = 50;  // 1 z-layer unit = 50 Three.js units of depth
  const LAYER_GAP = 1;     // z-step between layers
  let _onChange = () => {};
  let _rafId = null;

  function init() {
    canvasEl = document.getElementById('three-canvas');
    overlayEl = document.getElementById('canvas-overlay');
    const rect = canvasEl.parentElement.getBoundingClientRect();

    renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(rect.width, rect.height);

    // Orthographic camera = no perspective, perfect for "infinite 2D canvas" feel
    // but we still keep a Z axis for layer depth (parallax via small perspective)
    camera = new THREE.OrthographicCamera(
      -rect.width / 2, rect.width / 2,
      rect.height / 2, -rect.height / 2,
      -10000, 10000
    );
    camera.position.set(0, 0, 1000);

    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 2000, 8000);

    // Multi-depth grid system = the "infinite canvas" feel
    grid = makeGrid(10000, 100, 0x7c5cff, 0.08);
    grid.position.z = -10;
    scene.add(grid);

    gridBack = makeGrid(20000, 500, 0x7c5cff, 0.04);
    gridBack.position.z = -100;
    scene.add(gridBack);

    gridFar = makeGrid(40000, 1000, 0x7c5cff, 0.02);
    gridFar.position.z = -500;
    scene.add(gridFar);

    // Center origin marker
    const origin = new THREE.Group();
    const originDot = new THREE.Mesh(
      new THREE.RingGeometry(8, 12, 32),
      new THREE.MeshBasicMaterial({ color: 0x7c5cff, transparent: true, opacity: 0.6 })
    );
    originDot.position.z = -5;
    origin.add(originDot);
    scene.add(origin);

    bindEvents();
    window.addEventListener('resize', onResize);
    animate();
    updateOverlay();
  }

  function makeGrid(size, div, color, opacity) {
    const g = new THREE.GridHelper(size, div, color, color);
    g.material.transparent = true;
    g.material.opacity = opacity;
    g.rotation.x = Math.PI / 2;
    return g;
  }

  function bindEvents() {
    const host = canvasEl.parentElement;
    let isPanning = false;
    let panStart = { x: 0, y: 0 };
    let viewStart = { x: 0, y: 0 };

    host.addEventListener('mousedown', e => {
      // Only pan if clicking on canvas background, not on a node
      if (e.target.closest('.nexus-node')) return;
      if (e.button === 1 || (e.button === 0 && (e.shiftKey || NEXUS.Shell.activeTool === 'pan'))) {
        isPanning = true;
        panStart = { x: e.clientX, y: e.clientY };
        viewStart = { x: VIEW.x, y: VIEW.y };
        host.style.cursor = 'grabbing';
        e.preventDefault();
      }
    });
    window.addEventListener('mousemove', e => {
      if (!isPanning) return;
      const dx = (e.clientX - panStart.x) / VIEW.zoom;
      const dy = (e.clientY - panStart.y) / VIEW.zoom;
      VIEW.x = viewStart.x - dx;
      VIEW.y = viewStart.y + dy;
      updateOverlay();
      updateHUD();
    });
    window.addEventListener('mouseup', () => {
      if (isPanning) { isPanning = false; host.style.cursor = ''; }
    });

    host.addEventListener('wheel', e => {
      if (e.target.closest('.nexus-node')) return;
      e.preventDefault();
      const rect = host.getBoundingClientRect();
      const mx = e.clientX - rect.left - rect.width / 2;
      const my = -(e.clientY - rect.top - rect.height / 2);
      const oldZoom = VIEW.zoom;
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      VIEW.zoom = Math.max(0.1, Math.min(5, VIEW.zoom * delta));
      // Zoom toward mouse position
      const ratio = VIEW.zoom / oldZoom;
      VIEW.x = mx - (mx - VIEW.x) * (1 / ratio) - (mx - VIEW.x);
      VIEW.y = my - (my - VIEW.y) * (1 / ratio) - (my - VIEW.y);
      // Simpler: keep view centered on mouse pre-zoom
      VIEW.x = (VIEW.x - mx) * (VIEW.zoom / oldZoom) + mx;
      VIEW.y = (VIEW.y - my) * (VIEW.zoom / oldZoom) + my;
      updateOverlay();
      updateHUD();
    }, { passive: false });

    // Keyboard navigation
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const step = 50 / VIEW.zoom;
      if (e.key === 'ArrowUp') { VIEW.y += step; updateOverlay(); updateHUD(); }
      if (e.key === 'ArrowDown') { VIEW.y -= step; updateOverlay(); updateHUD(); }
      if (e.key === 'ArrowLeft') { VIEW.x -= step; updateOverlay(); updateHUD(); }
      if (e.key === 'ArrowRight') { VIEW.x += step; updateOverlay(); updateHUD(); }
      if (e.key === '+' || e.key === '=') { VIEW.zoom = Math.min(5, VIEW.zoom * 1.2); updateOverlay(); updateHUD(); }
      if (e.key === '-' || e.key === '_') { VIEW.zoom = Math.max(0.1, VIEW.zoom / 1.2); updateOverlay(); updateHUD(); }
      if (e.key === '0') { VIEW.x = 0; VIEW.y = 0; VIEW.zoom = 1; updateOverlay(); updateHUD(); }
    });
  }

  function updateOverlay() {
    // Translate world coords to screen coords. World (0,0) should map to center of canvas.
    const rect = canvasEl.parentElement.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const screenX = cx - VIEW.x * VIEW.zoom;
    const screenY = cy + VIEW.y * VIEW.zoom;
    overlayEl.style.transform = `translate(${screenX}px, ${screenY}px) scale(${VIEW.zoom})`;
    _onChange(VIEW);
  }

  function updateHUD() {
    const hud = id => document.getElementById(id);
    if (hud('hud-x')) hud('hud-x').textContent = Math.round(VIEW.x);
    if (hud('hud-y')) hud('hud-y').textContent = Math.round(VIEW.y);
    if (hud('hud-zoom')) hud('hud-zoom').textContent = Math.round(VIEW.zoom * 100) + '%';
    if (hud('hud-nodes')) {
      const ws = NEXUS.WorkspaceManager.getActive();
      hud('hud-nodes').textContent = ws ? ws.nodes.length : 0;
    }
  }

  function onResize() {
    const rect = canvasEl.parentElement.getBoundingClientRect();
    renderer.setSize(rect.width, rect.height);
    camera.left = -rect.width / 2;
    camera.right = rect.width / 2;
    camera.top = rect.height / 2;
    camera.bottom = -rect.height / 2;
    camera.updateProjectionMatrix();
    updateOverlay();
  }

  function animate() {
    _rafId = requestAnimationFrame(animate);
    // Subtle parallax on background grids for "alive" feel
    if (grid) grid.position.x = VIEW.x * 0.02;
    if (grid) grid.position.y = VIEW.y * 0.02;
    if (gridBack) gridBack.position.x = VIEW.x * 0.01;
    if (gridBack) gridBack.position.y = VIEW.y * 0.01;
    if (gridFar) gridFar.position.x = VIEW.x * 0.005;
    if (gridFar) gridFar.position.y = VIEW.y * 0.005;
    renderer.render(scene, camera);
  }

  // Convert screen (mouse) -> world coords
  function screenToWorld(sx, sy) {
    const rect = canvasEl.parentElement.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    return {
      x: (sx - cx) / VIEW.zoom + VIEW.x,
      y: -(sy - cy) / VIEW.zoom + VIEW.y,
    };
  }

  function setZoom(z) { VIEW.zoom = z; updateOverlay(); updateHUD(); }
  function reset() { VIEW.x = 0; VIEW.y = 0; VIEW.zoom = 1; updateOverlay(); updateHUD(); }
  function onChange(fn) { _onChange = fn; }
  function getView() { return { ...VIEW }; }

  return { init, screenToWorld, setZoom, reset, onChange, getView, updateHUD };
})();
</script>
<script>
"use strict";
/* ============================================================
   8. COMMAND PARSER
   Natural-language command interpreter for the chat box.
   Patterns are registered as { match, parse, execute }.
   Supports: theme swap, bg change, icon swap, add component,
   layer control, workspace switch, app connect/disconnect, etc.
   ============================================================ */
NEXUS.CommandParser = (function() {
  const _commands = [];
  const _suggestions = [];

  function registerCommand(cmd) {
    _commands.push(cmd);
    if (cmd.suggestions) _suggestions.push(...cmd.suggestions);
  }

  function parse(input) {
    const text = input.trim();
    if (!text) return null;
    // Sort by specificity (longer match patterns first)
    const sorted = [..._commands].sort((a, b) => (b.match.length || 0) - (a.match.length || 0));
    for (const cmd of sorted) {
      let m;
      if (cmd.match instanceof RegExp) m = cmd.match.exec(text);
      else if (Array.isArray(cmd.match)) m = cmd.match.find(p => new RegExp(p, 'i').test(text));
      else if (typeof cmd.match === 'string') m = new RegExp(cmd.match, 'i').exec(text);
      if (m) {
        try {
          return { cmd, match: m, text };
        } catch (e) {
          console.error('[CommandParser] Parse error:', e);
          return { error: e.message, text };
        }
      }
    }
    return { error: 'No matching command. Type ? for help.', text };
  }

  async function execute(input) {
    const parsed = parse(input);
    if (!parsed) return { ok: false, msg: 'Empty command' };
    if (parsed.error) return { ok: false, msg: parsed.error };
    if (parsed.cmd.execute) {
      try {
        const result = await parsed.cmd.execute(parsed.match, parsed.text);
        return { ok: true, msg: parsed.cmd.successMsg || 'Done', result };
      } catch (e) {
        return { ok: false, msg: e.message };
      }
    }
    return { ok: false, msg: 'Command has no execute handler' };
  }

  function getSuggestions(q) {
    if (!q) return _suggestions.slice(0, 8);
    const ql = q.toLowerCase();
    return _suggestions.filter(s =>
      s.text.toLowerCase().includes(ql) || s.category.toLowerCase().includes(ql)
    ).slice(0, 8);
  }

  // ---- BUILT-IN COMMANDS ----

  registerCommand({
    id: 'help',
    match: /^\?|help/i,
    category: 'system',
    execute: () => {
      const helpHtml = _commands.map(c => `
        <div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-0);">
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--accent);min-width:120px;">${c.id}</div>
          <div style="font-size:12px;color:var(--fg-1);">${c.help || c.description || ''}</div>
        </div>`).join('');
      NEXUS.Modal.show({
        title: 'Command Reference',
        body: `<div style="font-size:13px;color:var(--fg-2);margin-bottom:12px;">Type any of these into the command box. Patterns support natural language.</div>${helpHtml}`,
        actions: [{ label: 'Close', primary: true }],
      });
    },
    successMsg: 'Opened help',
    suggestions: [{ text: '? — show all commands', category: 'system' }],
  });

  registerCommand({
    id: 'set-theme',
    match: [/^theme\s+(\w+)/i, /^set\s+theme\s+(\w+)/i, /^switch\s+theme\s+(\w+)/i],
    category: 'theme',
    description: 'Switch active theme',
    help: 'theme <name> — switch to a theme (midnight, daylight, carbon, cyber, paper)',
    execute: (m) => {
      const name = m[1].toLowerCase();
      NEXUS.ThemeEngine.apply(name);
      return `Theme: ${name}`;
    },
    successMsg: 'Theme applied',
    suggestions: [
      { text: 'theme midnight', category: 'theme' },
      { text: 'theme daylight', category: 'theme' },
      { text: 'theme carbon', category: 'theme' },
      { text: 'theme cyber', category: 'theme' },
      { text: 'theme paper', category: 'theme' },
    ],
  });

  registerCommand({
    id: 'set-bg-image',
    match: [/^set\s+background\s+(?:to\s+)?(.+\.(?:jpg|jpeg|png|gif|webp|svg))/i,
            /^background\s+(?:to\s+)?(.+\.(?:jpg|jpeg|png|gif|webp|svg))/i,
            /^bg\s+(?:to\s+)?(.+\.(?:jpg|jpeg|png|gif|webp|svg))/i],
    category: 'theme',
    description: 'Set canvas background to an image',
    help: 'set background to <path> — apply image as canvas background',
    execute: (m) => {
      const path = m[1].trim();
      // Expand ~ to user home path representation
      const display = path.replace(/^~/, '~');
      const canvas3d = document.getElementById('canvas-3d');
      canvas3d.style.background = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('${display}') center/cover no-repeat, var(--bg-0)`;
      NEXUS.Shell._bgOverride = display;
      NEXUS.Toast.show({ title: 'Background updated', message: display, type: 'success' });
      return display;
    },
    successMsg: 'Background set',
    suggestions: [
      { text: 'set background to ~/pictures/aurora.jpg', category: 'theme' },
      { text: 'set background to ~/wallpapers/nebula.png', category: 'theme' },
    ],
  });

  registerCommand({
    id: 'set-bg-color',
    match: [/^set\s+background\s+(?:to\s+)?(#[0-9a-f]{3,8})/i, /^bg\s+(#[0-9a-f]{3,8})/i],
    category: 'theme',
    description: 'Set canvas background to a solid color',
    help: 'set background to #rrggbb',
    execute: (m) => {
      const color = m[1];
      document.getElementById('canvas-3d').style.background = color;
      NEXUS.Shell._bgOverride = color;
      return color;
    },
    successMsg: 'Background color set',
    suggestions: [{ text: 'set background to #0a0e1a', category: 'theme' }],
  });

  registerCommand({
    id: 'reset-bg',
    match: /^reset\s+background/i,
    category: 'theme',
    execute: () => {
      const c = document.getElementById('canvas-3d');
      c.style.background = '';
      NEXUS.Shell._bgOverride = null;
      return 'reset';
    },
    successMsg: 'Background reset',
    suggestions: [{ text: 'reset background', category: 'theme' }],
  });

  registerCommand({
    id: 'set-token',
    match: [/^set\s+(--[\w-]+)\s+(.+)/i, /^token\s+(--[\w-]+)\s+(.+)/i],
    category: 'theme',
    description: 'Override any design token',
    help: 'set --accent #ff0000 — override a CSS variable',
    execute: (m) => {
      const [_, token, value] = m;
      NEXUS.ThemeEngine.setToken(token, value);
      NEXUS.Toast.show({ title: 'Token updated', message: `${token} = ${value}`, type: 'success' });
      return `${token}=${value}`;
    },
    successMsg: 'Token updated',
    suggestions: [
      { text: 'set --accent #ff6b6b', category: 'theme' },
      { text: 'set --shell-sidebar-w 320px', category: 'theme' },
      { text: 'set --font-sans "JetBrains Mono"', category: 'theme' },
    ],
  });

  registerCommand({
    id: 'swap-icon',
    match: [/^swap\s+(.+?)\s+icon\s+(?:to\s+)?(.+)/i, /^change\s+(.+?)\s+icon\s+(?:to\s+)?(.+)/i],
    category: 'icon',
    description: 'Swap an icon used by UI buttons',
    help: 'swap <button-type> icon to <icon-name> — supported: send, attach, voice, mic, settings, search, menu, close, plus, check, arrow, lightning, star, heart, fire, bolt, sparkle, gem, crown, shield',
    execute: (m) => {
      const [_, target, iconName] = m;
      const iconSvg = NEXUS.Icons.get(iconName.trim());
      if (!iconSvg) throw new Error(`Unknown icon: ${iconName}. Available: ${NEXUS.Icons.list().join(', ')}`);
      NEXUS.Shell._iconOverrides[target.trim()] = iconName.trim();
      NEXUS.Shell.rerenderNodes();
      NEXUS.Toast.show({ title: 'Icon swapped', message: `${target} → ${iconName}`, type: 'success' });
      return `${target} → ${iconName}`;
    },
    successMsg: 'Icon swapped',
    suggestions: [
      { text: 'swap send icon to lightning', category: 'icon' },
      { text: 'swap attach icon to sparkle', category: 'icon' },
      { text: 'swap settings icon to bolt', category: 'icon' },
    ],
  });

  registerCommand({
    id: 'add-component',
    match: [/^add\s+(.+?)\s+(?:at\s+)?(-?\d+)[,\s]+(-?\d+)(?:[,\s]+(-?\d+))?/i,
            /^place\s+(.+?)\s+(?:at\s+)?(-?\d+)[,\s]+(-?\d+)(?:[,\s]+(-?\d+))?/i],
    category: 'canvas',
    description: 'Add a component to the canvas at x,y[,z]',
    help: 'add <component-id> at <x> <y> [<z>] — example: add chatgpt-panel at 0 0 0',
    execute: (m) => {
      const [_, id, x, y, z] = m;
      const comp = NEXUS.ComponentRegistry.get(id.trim());
      if (!comp) throw new Error(`Unknown component: ${id}. Use the sidebar to browse.`);
      const node = NEXUS.Shell.createNode(comp, parseFloat(x), parseFloat(y), parseFloat(z || 0));
      return node.id;
    },
    successMsg: 'Component added',
    suggestions: [
      { text: 'add chatgpt-panel at 0 0 0', category: 'canvas' },
      { text: 'add claude-panel at 400 0 0', category: 'canvas' },
      { text: 'add gemini-panel at 800 0 0', category: 'canvas' },
      { text: 'add chat-input at 0 300 0', category: 'canvas' },
    ],
  });

  registerCommand({
    id: 'add-layer',
    match: [/^add\s+(?:z-?layer|layer)\s+(.+)/i, /^new\s+layer\s+(.+)/i],
    category: 'canvas',
    description: 'Add a new Z-layer',
    help: 'add layer <name> — creates a new Z-layer in the active workspace',
    execute: (m) => {
      const layer = NEXUS.WorkspaceManager.addLayer(m[1]);
      NEXUS.Shell.refreshZHUD();
      return layer.id;
    },
    successMsg: 'Layer added',
    suggestions: [{ text: 'add layer Background', category: 'canvas' }],
  });

  registerCommand({
    id: 'switch-workspace',
    match: [/^workspace\s+(\w[\w-]*)/i, /^switch\s+workspace\s+(\w[\w-]*)/i, /^ws\s+(\w[\w-]*)/i],
    category: 'workspace',
    description: 'Switch to a workspace',
    help: 'workspace <id> — switch active workspace',
    execute: (m) => {
      const id = m[1];
      const ws = NEXUS.WorkspaceManager.get(id);
      if (!ws) throw new Error(`Unknown workspace. Available: ${NEXUS.WorkspaceManager.list().map(w => w.id).join(', ')}`);
      NEXUS.WorkspaceManager.activate(id);
      NEXUS.Shell.refreshAll();
      return id;
    },
    successMsg: 'Workspace switched',
    suggestions: [
      { text: 'workspace ws-primary', category: 'workspace' },
      { text: 'workspace ws-chat', category: 'workspace' },
      { text: 'workspace ws-research', category: 'workspace' },
    ],
  });

  registerCommand({
    id: 'connect-app',
    match: [/^connect\s+(\w+)/i, /^login\s+(\w+)/i],
    category: 'apps',
    description: 'Connect to an AI WebApp via chrome slave',
    help: 'connect <app> — app: chatgpt, claude, gemini, perplexity',
    execute: async (m) => {
      const app = m[1].toLowerCase();
      const res = await NEXUS.BackendBridge.connectApp(app);
      NEXUS.Shell.refreshAppsPanel();
      return res;
    },
    successMsg: 'App connected',
    suggestions: [
      { text: 'connect chatgpt', category: 'apps' },
      { text: 'connect claude', category: 'apps' },
      { text: 'connect gemini', category: 'apps' },
      { text: 'connect perplexity', category: 'apps' },
    ],
  });

  registerCommand({
    id: 'disconnect-app',
    match: [/^disconnect\s+(\w+)/i, /^logout\s+(\w+)/i],
    category: 'apps',
    execute: async (m) => {
      const app = m[1].toLowerCase();
      await NEXUS.BackendBridge.disconnectApp(app);
      NEXUS.Shell.refreshAppsPanel();
      return app;
    },
    successMsg: 'App disconnected',
    suggestions: [{ text: 'disconnect chatgpt', category: 'apps' }],
  });

  registerCommand({
    id: 'send-message',
    match: [/^send\s+"(.+?)"\s+to\s+(\w+)/i, /^ask\s+(\w+)\s+"(.+?)"/i, /^prompt\s+(\w+)\s+"(.+?)"/i],
    category: 'apps',
    description: 'Send a prompt to a connected AI app',
    help: 'send "your prompt" to <app> — routes through the chrome slave',
    execute: async (m) => {
      // Handle both "send X to app" and "ask app X" patterns
      let prompt, app;
      if (m[1] && m[2] && m[1].startsWith('"') === false && /^\w+$/.test(m[1])) {
        // ask pattern: m[1]=app, m[2]=prompt
        app = m[1].toLowerCase(); prompt = m[2];
      } else {
        prompt = m[1]; app = m[2].toLowerCase();
      }
      const res = await NEXUS.BackendBridge.sendPrompt(app, prompt);
      NEXUS.Toast.show({ title: `${app} responded`, message: res.response.slice(0, 80) + '...', type: 'success' });
      return res;
    },
    successMsg: 'Prompt sent',
    suggestions: [{ text: 'send "hello world" to chatgpt', category: 'apps' }],
  });

  registerCommand({
    id: 'list-components',
    match: [/^list\s+components/i, /^show\s+components/i],
    category: 'registry',
    execute: () => {
      const cats = NEXUS.ComponentRegistry.categories().map(cat => {
        const items = NEXUS.ComponentRegistry.byCategory(cat);
        return `<div style="margin-bottom:16px;">
          <div style="font-size:11px;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;">${cat} (${items.length})</div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1);">${items.map(i => i.id).join(', ')}</div>
        </div>`;
      }).join('');
      NEXUS.Modal.show({
        title: `Component Registry (${NEXUS.ComponentRegistry.count})`,
        body: cats,
        actions: [{ label: 'Close', primary: true }],
      });
      return 'listed';
    },
    successMsg: 'Listed components',
    suggestions: [{ text: 'list components', category: 'registry' }],
  });

  registerCommand({
    id: 'export-schema',
    match: [/^export\s+schema/i, /^export\s+registry/i],
    category: 'registry',
    execute: () => {
      const schema = NEXUS.ComponentRegistry.exportSchema();
      const blob = new Blob([JSON.stringify(schema, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'nexus-registry-schema.json'; a.click();
      URL.revokeObjectURL(url);
      return 'exported';
    },
    successMsg: 'Schema exported',
    suggestions: [{ text: 'export schema', category: 'registry' }],
  });

  registerCommand({
    id: 'reset-view',
    match: [/^reset\s+view/i, /^home/i, /^center/i],
    category: 'canvas',
    execute: () => { NEXUS.Canvas3D.reset(); return 'centered'; },
    successMsg: 'View reset',
    suggestions: [{ text: 'reset view', category: 'canvas' }],
  });

  registerCommand({
    id: 'clear-canvas',
    match: [/^clear\s+canvas/i, /^clear\s+all/i],
    category: 'canvas',
    execute: () => {
      const ws = NEXUS.WorkspaceManager.getActive();
      if (ws) ws.nodes = [];
      NEXUS.Shell.rerenderNodes();
      return 'cleared';
    },
    successMsg: 'Canvas cleared',
    suggestions: [{ text: 'clear canvas', category: 'canvas' }],
  });

  return { parse, execute, registerCommand, getSuggestions, get commands() { return _commands; } };
})();
</script>
<script>
"use strict";
/* ============================================================
   9. ICONS — Hot-swappable icon registry
   Users can override any icon via command box: "swap send icon to lightning"
   ============================================================ */
NEXUS.Icons = (function() {
  const _icons = {
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
    attach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>',

  function register(name, svg) { _icons[name] = svg; }
  function resolve(nameOrSvg) {
    if (!nameOrSvg) return _icons.bolt;
    if (nameOrSvg.startsWith('<svg')) return nameOrSvg;

/* ============================================================
   10. BACKEND BRIDGE
   Mock connector to a local chrome slave fleet. Each slave is a
   headless Chrome instance dedicated to one AI WebApp. The
   frontend talks to NEXUS.BackendBridge; the bridge would (in a
   real deployment) talk to a local websocket that controls the
   slave fleet. Here we simulate responses for demonstration.
   ============================================================ */
NEXUS.BackendBridge = (function() {
  const APPS = {
    chatgpt:    { name: 'ChatGPT',    url: 'https://chat.openai.com',     icon: 'gpt',    color: '#10a37f' },
    claude:     { name: 'Claude',     url: 'https://claude.ai',           icon: 'claude', color: '#d97757' },
    gemini:     { name: 'Gemini',     url: 'https://gemini.google.com',   icon: 'gemini', color: '#4285f4' },
    perplexity: { name: 'Perplexity', url: 'https://perplexity.ai',       icon: 'perplex',color: '#20808d' },
  };

  const _slaves = new Map(); // slaveId -> { app, status, tabCount, lastSeen }
  const _connections = new Map(); // appId -> { slaveId, account, history }
  let _ws = null; // would be WebSocket in production

  function init() {
    // Seed: 3 chrome slaves online
    ['slave-1', 'slave-2', 'slave-3'].forEach((id, i) => {
      _slaves.set(id, {
        id, app: i === 0 ? 'chatgpt' : i === 1 ? 'claude' : 'gemini',
        status: 'online', tabCount: 1, lastSeen: Date.now(),
      });
    });
    _connections.set('chatgpt', { slaveId: 'slave-1', account: 'user@example.com', history: [] });
    _connections.set('claude', { slaveId: 'slave-2', account: 'user@example.com', history: [] });
    _connections.set('gemini', { slaveId: 'slave-3', account: 'user@gmail.com', history: [] });
    updateFleetStatus();
  }

  function updateFleetStatus() {
    const online = Array.from(_slaves.values()).filter(s => s.status === 'online').length;
    const dot = document.getElementById('fleet-dot');
    const count = document.getElementById('fleet-count');
    const badge = document.getElementById('rail-fleet-badge');
    if (dot) dot.className = 'fleet-dot' + (online === 0 ? ' idle' : '');
    if (count) count.textContent = online;
    if (badge) badge.textContent = online;
  }

  function listSlaves() { return Array.from(_slaves.values()); }
  function listApps() { return Object.entries(APPS).map(([id, a]) => ({ id, ...a, connected: _connections.has(id) })); }
  function getApp(id) { return APPS[id]; }

  async function connectApp(appId) {
    if (!APPS[appId]) throw new Error(`Unknown app: ${appId}. Available: ${Object.keys(APPS).join(', ')}`);
    // Find an available slave
    let slave = Array.from(_slaves.values()).find(s => s.status === 'online' && !_connections.has(s.app === appId ? s.app : ''));
    if (!slave) {
      // Spawn a new slave
      const newId = `slave-${_slaves.size + 1}`;
      slave = { id: newId, app: appId, status: 'online', tabCount: 0, lastSeen: Date.now() };
      _slaves.set(newId, slave);
    }
    slave.app = appId;
    slave.tabCount = 1;
    // Simulate connection delay
    await new Promise(r => setTimeout(r, 600));
    _connections.set(appId, {
      slaveId: slave.id,
      account: `user@${appId}.com`,
      history: [],
      connectedAt: Date.now(),
    });
    updateFleetStatus();
    NEXUS.Toast.show({
      title: `${APPS[appId].name} connected`,
      message: `Routed through ${slave.id}`,
      type: 'success',
    });
    return _connections.get(appId);
  }

  async function disconnectApp(appId) {
    const conn = _connections.get(appId);
    if (!conn) throw new Error(`${appId} is not connected`);
    const slave = _slaves.get(conn.slaveId);
    if (slave) { slave.tabCount = 0; }
    _connections.delete(appId);
    updateFleetStatus();
    NEXUS.Toast.show({
      title: `${APPS[appId].name} disconnected`,
      type: 'info',
    });
  }

  async function sendPrompt(appId, prompt) {
    const conn = _connections.get(appId);
    if (!conn) {
      // Auto-connect if not connected
      await connectApp(appId);
    }
    const c = _connections.get(appId);
    // Simulate streaming response
    const responses = {
      chatgpt: `As ChatGPT, I'd respond to "${prompt}" with: This is a simulated response from the OpenAI ChatGPT slave. In production, this would be the actual streaming response captured from chat.openai.com via the Chrome slave's CDP session. The response would include markdown formatting, code blocks, and full conversational context.`,
      claude: `As Claude, responding to "${prompt}": This is a simulated Anthropic Claude response. In production, the slave captures streaming output from claude.ai. Claude's responses tend to be more reflective and nuanced, often acknowledging the question before answering.`,
      gemini: `Gemini response to "${prompt}": Simulated Google Gemini output. In production, this would be the live response from gemini.google.com. Gemini tends to integrate search results and provide source citations.`,
      perplexity: `Perplexity on "${prompt}": Simulated response with citations [1][2]. Perplexity aggregates web search results and synthesizes them into a coherent answer with inline citations to source URLs.`,
    };
    await new Promise(r => setTimeout(r, 800 + Math.random() * 600));
    const response = responses[appId] || `Unknown app: ${appId}`;
    c.history.push({ role: 'user', content: prompt, ts: Date.now() });
    c.history.push({ role: 'assistant', content: response, ts: Date.now() });
    return { response, history: c.history, slaveId: c.slaveId };
  }

  async function getHistory(appId) {
    const c = _connections.get(appId);
    return c ? c.history : [];
  }

  // In production, this would open a real WebSocket:
  // _ws = new WebSocket('ws://localhost:9222/nexus-fleet');
  // _ws.onmessage = (e) => { ... route to listeners ... }
  function connect(url = 'ws://localhost:9222/nexus-fleet') {
    console.log('[BackendBridge] Would connect to:', url);
    NEXUS.Toast.show({
      title: 'Fleet bridge',
      message: `Would connect to ${url} (simulated)`,
      type: 'info',
    });
  }

  return { init, connectApp, disconnectApp, sendPrompt, getHistory,
           listSlaves, listApps, getApp, connect,
           get connections() { return _connections; } };
})();
</script>
<script>
"use strict";
/* ============================================================
   11. SHELL — Main controller / orchestrator
   Wires together: registry, canvas, command bar, sidebar,
   inspector, Z-layer HUD, workspaces, fleet status.
   ============================================================ */
NEXUS.Shell = (function() {
  const state = {
    activeTool: 'select',
    selectedNodeId: null,
    activeRightTab: 'inspector',
    _bgOverride: null,
    _iconOverrides: {},  // target -> iconName
    _nodeCounter: 0,
  };

  /* -------- Node lifecycle -------- */
  function createNode(comp, x, y, z = 0) {
    const ws = NEXUS.WorkspaceManager.getActive();
    if (!ws) return;
    const layer = ws.zLayers.find(l => l.id === ws.activeLayerId) || ws.zLayers[0];
    const node = {
      id: `node-${++state._nodeCounter}`,
      componentId: comp.id,
      x, y, z: layer.z + z,
      w: comp.defaultProps?.w || 320,
      h: comp.defaultProps?.h || 200,
      layerId: layer.id,
      props: JSON.parse(JSON.stringify(comp.defaultProps || {})),
      createdAt: Date.now(),
    };
    NEXUS.WorkspaceManager.addNode(node);
    renderNode(node);
    refreshZHUD();
    NEXUS.Canvas3D.updateHUD();
    return node;
  }

  function renderNode(node) {
    const comp = NEXUS.ComponentRegistry.get(node.componentId);
    if (!comp) return;
    const overlay = document.getElementById('canvas-overlay');
    // Remove existing render
    const existing = document.getElementById(`node-${node.id}`);
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'nexus-node';
    el.id = `node-${node.id}`;
    el.style.left = node.x + 'px';
    el.style.top = (-node.y) + 'px'; // invert Y for screen coords
    el.style.width = node.w + 'px';
    el.style.height = node.h + 'px';
    el.style.zIndex = 100 + Math.round(node.z);
    el.dataset.nodeId = node.id;
    el.innerHTML = `
      <div class="node-handle">
        <span class="nm">${comp.name}</span>
        <span class="del" data-action="delete">×</span>
      </div>
      <div class="node-body">${comp.render(node.props, node) || ''}</div>
      <div class="node-resize" data-action="resize"></div>`;
    // Bind interactions
    bindNodeDrag(el, node);
    bindNodeResize(el, node);
    el.querySelector('.node-handle').addEventListener('click', e => {
      if (e.target.dataset.action === 'delete') {
        NEXUS.WorkspaceManager.removeNode(node.id);
        el.remove();
        NEXUS.Canvas3D.updateHUD();
        return;
      }
      selectNode(node.id);
    });
    el.addEventListener('mousedown', e => {
      if (e.target.closest('.node-resize') || e.target.dataset.action === 'delete') return;
      selectNode(node.id);
    });
    overlay.appendChild(el);
  }

  function bindNodeDrag(el, node) {
    const handle = el.querySelector('.node-handle');
    let dragging = false, startX = 0, startY = 0, nodeStart = { x: 0, y: 0 };
    handle.addEventListener('mousedown', e => {
      if (e.target.dataset.action === 'delete') return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      nodeStart = { x: node.x, y: node.y };
      e.preventDefault();
      e.stopPropagation();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const view = NEXUS.Canvas3D.getView();
      node.x = nodeStart.x + (e.clientX - startX) / view.zoom;
      node.y = nodeStart.y - (e.clientY - startY) / view.zoom;
      el.style.left = node.x + 'px';
      el.style.top = -node.y + 'px';
      NEXUS.Canvas3D.updateHUD();
    });
    window.addEventListener('mouseup', () => { dragging = false; });
  }

  function bindNodeResize(el, node) {
    const grip = el.querySelector('.node-resize');
    let resizing = false, startX = 0, startY = 0, startW = 0, startH = 0;
    grip.addEventListener('mousedown', e => {
      resizing = true;
      startX = e.clientX; startY = e.clientY;
      startW = node.w; startH = node.h;
      e.preventDefault();
      e.stopPropagation();
    });
    window.addEventListener('mousemove', e => {
      if (!resizing) return;
      const view = NEXUS.Canvas3D.getView();
      node.w = Math.max(80, startW + (e.clientX - startX) / view.zoom);
      node.h = Math.max(60, startH + (e.clientY - startY) / view.zoom);
      el.style.width = node.w + 'px';
      el.style.height = node.h + 'px';
      // Re-render body to allow responsive layouts
      const comp = NEXUS.ComponentRegistry.get(node.componentId);
      const body = el.querySelector('.node-body');
      if (comp && body) body.innerHTML = comp.render(node.props, node) || '';
    });
    window.addEventListener('mouseup', () => { resizing = false; });
  }

  function selectNode(nodeId) {
    state.selectedNodeId = nodeId;
    document.querySelectorAll('.nexus-node').forEach(n => n.classList.remove('selected'));
    const el = document.getElementById(`node-${nodeId}`);
    if (el) el.classList.add('selected');
    refreshInspector();
  }

  function rerenderNodes() {
    const overlay = document.getElementById('canvas-overlay');
    overlay.innerHTML = '';
    const ws = NEXUS.WorkspaceManager.getActive();
    if (!ws) return;
    ws.nodes.forEach(renderNode);
    NEXUS.Canvas3D.updateHUD();
  }

  /* -------- Sidebar tree -------- */
  function renderSidebarTree(filter = '') {
    const tree = document.getElementById('sb-tree');
    const cats = NEXUS.ComponentRegistry.categories().sort();
    tree.innerHTML = cats.map(cat => {
      const items = NEXUS.ComponentRegistry.byCategory(cat)
        .filter(c => !filter || c.name.toLowerCase().includes(filter.toLowerCase()) || c.id.includes(filter.toLowerCase()));
      if (!items.length) return '';
      return `
        <div class="sb-group" data-cat="${cat}">
          <div class="sb-group-header">
            <span class="chev">▾</span>
            <span>${cat}</span>
            <span class="count">${items.length}</span>
          </div>
          <div class="sb-group-items">
            ${items.map(c => `
              <div class="sb-item" draggable="true" data-comp-id="${c.id}" title="${c.id}">
                <span class="ic">${c.icon || NEXUS.Icons.get('cube')}</span>
                <span class="nm">${c.name}</span>
                ${c.taxonomy?.primitive ? '<span class="tag prim">P</span>' : ''}
                ${c.taxonomy?.app ? '<span class="tag app">A</span>' : ''}
              </div>`).join('')}
          </div>
        </div>`;
    }).join('');

    // Bind: collapse groups
    tree.querySelectorAll('.sb-group-header').forEach(h => {
      h.onclick = () => h.parentElement.classList.toggle('collapsed');
    });
    // Bind: drag components to canvas
    tree.querySelectorAll('.sb-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/component-id', item.dataset.compId);
        e.dataTransfer.effectAllowed = 'copy';
      });
      // Click to add at viewport center
      item.addEventListener('click', () => {
        const comp = NEXUS.ComponentRegistry.get(item.dataset.compId);
        if (!comp) return;
        const canvas = document.getElementById('canvas-3d');
        const rect = canvas.getBoundingClientRect();
        const world = NEXUS.Canvas3D.screenToWorld(rect.width / 2, rect.height / 2);
        createNode(comp, world.x - (comp.defaultProps?.w || 320) / 2, world.y + (comp.defaultProps?.h || 200) / 2, 0);
        NEXUS.Toast.show({ title: 'Added to canvas', message: comp.name, type: 'success' });
      });
    });
  }

  /* -------- Right panel: inspector / slots / apps / theme -------- */
  function refreshRightPanel() {
    const tab = state.activeRightTab;
    const body = document.getElementById('rp-body');
    if (tab === 'inspector') body.innerHTML = renderInspector();
    else if (tab === 'slots') body.innerHTML = renderSlots();
    else if (tab === 'apps') body.innerHTML = renderApps();
    else if (tab === 'theme') body.innerHTML = renderThemePicker();
    bindRightPanel();
  }

  function refreshInspector() {
    if (state.activeRightTab !== 'inspector') return;
    refreshRightPanel();
  }

  function renderInspector() {
    const ws = NEXUS.WorkspaceManager.getActive();
    const node = ws && state.selectedNodeId
      ? ws.nodes.find(n => n.id === state.selectedNodeId)
      : null;
    if (!node) {
      return `<div class="rp-section">
        <h3>Workspace</h3>
        <div class="rp-row"><label>Name</label><input type="text" value="${ws ? ws.name : ''}" data-ws="name" /></div>
        <div class="rp-row"><label>Nodes</label><div class="muted tiny">${ws ? ws.nodes.length : 0} on canvas</div></div>
        <div class="rp-row"><label>Layers</label><div class="muted tiny">${ws ? ws.zLayers.length : 0} Z-layers</div></div>
      </div>
      <div class="rp-section">
        <h3>Quick Actions</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <button class="cmd-btn" data-action="reset-view" style="height:36px;">Reset View</button>
          <button class="cmd-btn" data-action="clear-canvas" style="height:36px;">Clear Canvas</button>
          <button class="cmd-btn" data-action="export-schema" style="height:36px;">Export Schema</button>
          <button class="cmd-btn" data-action="help" style="height:36px;">Commands</button>
        </div>
      </div>`;
    }
    const comp = NEXUS.ComponentRegistry.get(node.componentId);
    if (!comp) return '<div class="rp-section">Component not found</div>';
    const schemaProps = comp.schema?.properties || {};
    const propRows = Object.entries(schemaProps).map(([key, prop]) => {
      const val = node.props[key];
      const label = prop.label || key;
      if (prop.type === 'boolean') {
        return `<div class="rp-row"><label>${label}</label><div class="toggle ${val ? 'on' : ''}" data-prop="${key}"></div></div>`;
      }
      if (prop.enum) {
        return `<div class="rp-row"><label>${label}</label><select data-prop="${key}">${prop.enum.map(o => `<option ${o === val ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
      }
      if (prop.type === 'number' || prop.type === 'integer') {
        if (prop.min !== undefined && prop.max !== undefined) {
          return `<div class="rp-row"><label>${label}</label><input type="range" data-prop="${key}" min="${prop.min}" max="${prop.max}" value="${val}" /><span class="tiny mono" style="min-width:32px;text-align:right;">${val}</span></div>`;
        }
        return `<div class="rp-row"><label>${label}</label><input type="number" data-prop="${key}" value="${val}" /></div>`;
      }
      if (prop.type === 'color') {
        return `<div class="rp-row"><label>${label}</label><input type="color" data-prop="${key}" value="${val}" /><input type="text" data-prop="${key}" value="${val}" style="flex:1;" /></div>`;
      }
      if (prop.type === 'string' && (val || '').length > 30) {
        return `<div class="rp-row"><label>${label}</label><textarea data-prop="${key}" rows="3">${val || ''}</textarea></div>`;
      }
      return `<div class="rp-row"><label>${label}</label><input type="text" data-prop="${key}" value="${val || ''}" /></div>`;
    }).join('');

    return `<div class="rp-section">
      <h3>${comp.name}</h3>
      <div class="tiny muted mono" style="margin-bottom:8px;">${comp.id} · ${comp.category}</div>
      <div class="rp-row"><label>X</label><input type="number" data-node="x" value="${Math.round(node.x)}" /></div>
      <div class="rp-row"><label>Y</label><input type="number" data-node="y" value="${Math.round(node.y)}" /></div>
      <div class="rp-row"><label>Z</label><input type="number" data-node="z" value="${Math.round(node.z)}" /></div>
      <div class="rp-row"><label>Width</label><input type="number" data-node="w" value="${node.w}" /></div>
      <div class="rp-row"><label>Height</label><input type="number" data-node="h" value="${node.h}" /></div>
    </div>
    <div class="rp-section">
      <h3>Properties</h3>
      ${propRows || '<div class="tiny muted">No configurable properties.</div>'}
    </div>
    <div class="rp-section">
      <h3>Actions</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <button class="cmd-btn" data-action="duplicate-node" style="height:32px;">Duplicate</button>
        <button class="cmd-btn" data-action="delete-node" style="height:32px;">Delete</button>
      </div>
    </div>`;
  }

      <h3>Theme</h3>
      <div class="theme-grid">

      <div class="rp-row"><label>--bg-1</label><input type="color" data-token="--bg-1" value="${getComputedStyle(document.documentElement).getPropertyValue('--bg-1').trim()}" /></div>
      <div class="rp-row"><label>--fg-0</label><input type="color" data-token="--fg-0" value="${getComputedStyle(document.documentElement).getPropertyValue('--fg-0').trim()}" /></div>
      <div class="rp-row"><label>sidebar</label><input type="range" data-token="--shell-sidebar-w" min="200" max="480" value="${parseInt(getComputedStyle(document.documentElement).getPropertyValue('--shell-sidebar-w'))}" /></div>
      <button class="cmd-btn" data-action="reset-tokens" style="width:100%;height:32px;">Reset All Overrides</button>
    </div>`;

  function bindRightPanel() {
    const body = document.getElementById('rp-body');
    // Property changes
    body.querySelectorAll('[data-prop]').forEach(input => {
      const handler = (v) => {
        const ws = NEXUS.WorkspaceManager.getActive();
        const node = ws && state.selectedNodeId ? ws.nodes.find(n => n.id === state.selectedNodeId) : null;
        if (!node) return;
        node.props[input.dataset.prop] = v;
        renderNode(node);
      };
      if (input.type === 'checkbox') input.onchange = () => handler(input.checked);
      else if (input.tagName === 'SELECT') input.onchange = () => handler(input.value);
      else if (input.type === 'range') input.oninput = () => { handler(parseFloat(input.value)); input.nextElementSibling.textContent = input.value; };
      else input.oninput = () => handler(input.value);
      if (input.classList.contains('toggle')) input.onclick = () => {
        input.classList.toggle('on');
        handler(input.classList.contains('on'));
      };
    });
    // Node geometry
    body.querySelectorAll('[data-node]').forEach(input => {
      input.oninput = () => {
        const ws = NEXUS.WorkspaceManager.getActive();
        const node = ws && state.selectedNodeId ? ws.nodes.find(n => n.id === state.selectedNodeId) : null;
        if (!node) return;
        node[input.dataset.node] = parseFloat(input.value) || 0;
        const el = document.getElementById(`node-${node.id}`);
        if (el) {
          el.style.left = node.x + 'px';
          el.style.top = -node.y + 'px';
          el.style.width = node.w + 'px';
          el.style.height = node.h + 'px';
        }
      };
    });
    // Theme swatches
    body.querySelectorAll('[data-theme-id]').forEach(s => s.onclick = () => NEXUS.ThemeEngine.apply(s.dataset.themeId));
    // Token color pickers
    body.querySelectorAll('[data-token]').forEach(t => {
      if (t.tagName === 'INPUT') {
        t.oninput = () => {
          NEXUS.ThemeEngine.setToken(t.dataset.token, t.type === 'range' ? t.value + 'px' : t.value);
        };
      }
    });
    // Layer visibility
    body.querySelectorAll('[data-layer-vis]').forEach(b => b.onclick = () => {
      NEXUS.WorkspaceManager.toggleLayer(b.dataset.layerVis);
      rerenderNodes();
      refreshRightPanel();
    });
    // Set active layer
    body.querySelectorAll('[data-set-active-layer]').forEach(b => b.onclick = () => {
      NEXUS.WorkspaceManager.setActiveLayer(b.dataset.setActiveLayer);
      refreshRightPanel();
    });
    // Workspace name
    body.querySelectorAll('[data-ws]').forEach(i => i.oninput = () => {
      const ws = NEXUS.WorkspaceManager.getActive();
      if (ws) ws.name = i.value;
    });
    // Action buttons
    body.querySelectorAll('[data-action]').forEach(b => b.onclick = () => {
      const a = b.dataset.action;
      if (a === 'reset-view') NEXUS.Canvas3D.reset();
      else if (a === 'clear-canvas') NEXUS.CommandParser.execute('clear canvas');
      else if (a === 'export-schema') NEXUS.CommandParser.execute('export schema');
      else if (a === 'help') NEXUS.CommandParser.execute('?');
      else if (a === 'add-layer') {
        const name = prompt('Layer name?');
        if (name) NEXUS.CommandParser.execute(`add layer ${name}`);
      }
      else if (a === 'delete-node' && state.selectedNodeId) {
        NEXUS.WorkspaceManager.removeNode(state.selectedNodeId);
        state.selectedNodeId = null;
        rerenderNodes();
        refreshRightPanel();
      }
      else if (a === 'duplicate-node' && state.selectedNodeId) {
        const ws = NEXUS.WorkspaceManager.getActive();
        const n = ws.nodes.find(n => n.id === state.selectedNodeId);
        if (n) {
          const comp = NEXUS.ComponentRegistry.get(n.componentId);
          createNode(comp, n.x + 20, n.y + 20, n.z);
        }
      }
      else if (a === 'reset-tokens') {
        Object.keys(NEXUS.ThemeEngine._overrides || {}).forEach(t => NEXUS.ThemeEngine.resetToken(t));
        location.reload();
      }
    });
  }

  function refreshZHUD() {

    const pills = document.getElementById('z-pills');
    pills.innerHTML = ws.zLayers.map(l => `
      <span class="z-pill ${l.id === ws.activeLayerId ? 'active' : ''}" data-z="${l.id}" style="${l.visible ? '' : 'opacity:0.4;'}">Z${l.z}</span>`).join('');
    pills.querySelectorAll('[data-z]').forEach(p => p.onclick = () => {

    if (meta) meta.textContent = `${ws.zLayers.length} layers · ${ws.nodes.length} nodes`;

    if (name) name.textContent = ws.name;

    if (icon) icon.textContent = ws.name[0].toUpperCase();

  /* -------- Command bar -------- */
  function bindCommandBar() {
    const input = document.getElementById('cmd-input');
    const sugg = document.getElementById('cmd-suggestions');
    let selIdx = -1;

    async function run() {
      const text = input.value.trim();
      if (!text) return;
      const res = await NEXUS.CommandParser.execute(text);
      if (res.ok) {
        NEXUS.Toast.show({ title: res.msg, message: typeof res.result === 'string' ? res.result : '', type: 'success' });
        input.value = '';
        sugg.classList.remove('show');
        refreshAll();
      } else {
        NEXUS.Toast.show({ title: 'Command failed', message: res.msg, type: 'danger' });
      }
    }

    input.addEventListener('input', () => {
      const list = NEXUS.CommandParser.getSuggestions(input.value);
      selIdx = -1;
      if (!list.length) { sugg.classList.remove('show'); return; }
      sugg.innerHTML = list.map((s, i) => `
        <div class="cmd-sugg-item ${i === 0 ? 'sel' : ''}" data-idx="${i}">
          <span class="cmd-cat">${s.category}</span>
          <span class="cmd-txt">${s.text}</span>
        </div>`).join('');
      sugg.classList.add('show');
      sugg.querySelectorAll('.cmd-sugg-item').forEach((el, i) => {
        el.onclick = () => { input.value = el.querySelector('.cmd-txt').textContent; sugg.classList.remove('show'); run(); };
      });
    });

    input.addEventListener('keydown', e => {
      const items = sugg.querySelectorAll('.cmd-sugg-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selIdx = Math.min(items.length - 1, selIdx + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selIdx = Math.max(-1, selIdx - 1);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selIdx >= 0 && items[selIdx]) {
          input.value = items[selIdx].querySelector('.cmd-txt').textContent;
        }
        sugg.classList.remove('show');
        run();
        return;
      } else if (e.key === 'Escape') {
        sugg.classList.remove('show');
        input.value = '';
        return;
      }
      items.forEach((el, i) => el.classList.toggle('sel', i === selIdx));
    });

    document.getElementById('cmd-run').onclick = run;
    document.getElementById('cmd-clear').onclick = () => { input.value = ''; sugg.classList.remove('show'); };
    document.getElementById('cmd-help').onclick = () => NEXUS.CommandParser.execute('?');
    input.addEventListener('blur', () => setTimeout(() => sugg.classList.remove('show'), 200));
  }

  /* -------- Drop on canvas -------- */
  function bindCanvasDrop() {
    const canvas = document.getElementById('canvas-3d');
    canvas.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    canvas.addEventListener('drop', e => {
      e.preventDefault();
      const compId = e.dataTransfer.getData('text/component-id');
      if (!compId) return;
      const comp = NEXUS.ComponentRegistry.get(compId);
      if (!comp) return;
      const rect = canvas.getBoundingClientRect();
      const world = NEXUS.Canvas3D.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
      createNode(comp, world.x - (comp.defaultProps?.w || 320) / 2, world.y + (comp.defaultProps?.h || 200) / 2, 0);
    });
  }

  /* -------- Rail buttons -------- */
  function bindRail() {
    document.querySelectorAll('#rail .rail-btn').forEach(b => {
      b.onclick = () => {
        if (b.dataset.tool) {
          state.activeTool = b.dataset.tool;
          document.querySelectorAll('#rail .rail-btn[data-tool]').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
        } else if (b.dataset.view) {
          const v = b.dataset.view;
          if (v === 'registry') document.getElementById('sb-search-input')?.focus();
          else if (v === 'plugins') NEXUS.CommandParser.execute('list components');
          else if (v === 'fleet') { state.activeRightTab = 'apps'; refreshRightPanel(); }
          else if (v === 'settings') { state.activeRightTab = 'theme'; refreshRightPanel(); }
        }
      };
    });
    // Default to select tool
    document.querySelector('#rail .rail-btn[data-tool="select"]').classList.add('active');
  }

  function bindRightTabs() {
    document.querySelectorAll('.rp-tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.rp-tab').forEach(x => x.classList.remove('active'));

        refreshRightPanel();

  function bindSidebarSearch() {

    input.addEventListener('input', () => renderSidebarTree(input.value));
  }

  function bindWorkspaceSwitcher() {
    const sw = document.getElementById('ws-switcher');
    sw.onclick = () => {
      const list = NEXUS.WorkspaceManager.list();
      const html = list.map(w => `
        <div class="cmd-sugg-item" data-ws-id="${w.id}">
          <span class="cmd-cat">${w.icon}</span>
          <span class="cmd-txt">${w.name} · ${w.nodes.length} nodes</span>
        </div>`).join('') + `
        <div class="cmd-sugg-item" data-ws-id="__new">
          <span class="cmd-cat">+</span>
          <span class="cmd-txt">Create new workspace…</span>
        </div>`;
      NEXUS.Modal.show({
        title: 'Switch Workspace',
        body: `<div style="display:flex;flex-direction:column;gap:4px;">${html}</div>`,
        actions: [{ label: 'Close', primary: true }],
      });
      document.querySelectorAll('[data-ws-id]').forEach(el => {
        el.onclick = () => {
          if (el.dataset.wsId === '__new') {
            const name = prompt('Workspace name?');
            if (name) {
              const ws = NEXUS.WorkspaceManager.create(null, name);
              NEXUS.WorkspaceManager.activate(ws.id);
            }
          } else {
            NEXUS.WorkspaceManager.activate(el.dataset.wsId);
          }
          refreshAll();
          document.querySelector('.modal-backdrop')?.remove();
        };
      });
    };
    document.getElementById('sb-add-ws').onclick = () => {
      const name = prompt('Workspace name?');
      if (name) {
        const ws = NEXUS.WorkspaceManager.create(null, name);
        NEXUS.WorkspaceManager.activate(ws.id);
        refreshAll();
      }
    };
  }

  function bindSidebarExport() {
    document.getElementById('sb-export').onclick = () => NEXUS.CommandParser.execute('export schema');
  }

  /* -------- Z-HUD add button -------- */
  function bindZHUD() {
    document.getElementById('z-add').onclick = () => {
      const name = prompt('Layer name?', `Layer ${NEXUS.WorkspaceManager.getActive().zLayers.length + 1}`);
      if (name) NEXUS.CommandParser.execute(`add layer ${name}`);
    };
  }

  /* -------- Init -------- */
  function init() {
    NEXUS.BackendBridge.init();
    NEXUS.Canvas3D.init();
    bindRail();
    bindRightTabs();
    bindSidebarSearch();
    bindWorkspaceSwitcher();
    bindSidebarExport();
    bindCommandBar();
    bindCanvasDrop();
    bindZHUD();
    renderSidebarTree();
    refreshZHUD();
    refreshRightPanel();
    // Re-render on workspace change
    NEXUS.WorkspaceManager.on(() => refreshAll());
    // Seed: drop a couple of starter components on the canvas
    setTimeout(() => {
      const chatgpt = NEXUS.ComponentRegistry.get('chatgpt-panel');
      const chatInput = NEXUS.ComponentRegistry.get('chat-input');
      if (chatgpt) createNode(chatgpt, -200, 100, 0);
      if (chatInput) createNode(chatInput, -200, -180, 0);
      const claude = NEXUS.ComponentRegistry.get('claude-panel');
      if (claude) createNode(claude, 240, 100, 0);
    }, 100);
    // Welcome toast
    setTimeout(() => {
      NEXUS.Toast.show({
        title: 'NEXUS Shell ready',
        message: '100 components loaded · 3 chrome slaves online · Try "?" for commands',
        type: 'success', duration: 6000,
      });
    }, 500);
    // Update registry count display
    const cnt = document.getElementById('registry-count');
    if (cnt) cnt.textContent = NEXUS.ComponentRegistry.count;
    const pc = document.getElementById('registry-plugins');
    if (pc) pc.textContent = NEXUS.ComponentRegistry.pluginCount;
  }

  return { init, createNode, renderNode, rerenderNodes, selectNode,
           refreshInspector, refreshRightPanel, refreshZHUD,
           refreshAppsPanel, refreshAll, renderSidebarTree, bindRail, bindRightTabs,
           state,
           get activeTool() { return state.activeTool; },
           get selectedNodeId() { return state.selectedNodeId; },
           set selectedNodeId(v) { state.selectedNodeId = v; },
           _bgOverride: null, _iconOverrides: state._iconOverrides };
})();

// Boot
window.addEventListener('DOMContentLoaded', () => NEXUS.Shell.init());
</script>
<script>
"use strict";
/* ============================================================

    {

      schema: { properties: { content: { type: 'string' } } },
      render: (p) => {
        // Minimal markdown rendering
        let html = p.content
          .replace(/^### (.+)$/gm, '<h3 style="font-size:14px;font-weight:600;margin:8px 0 4px;">$1</h3>')
          .replace(/^## (.+)$/gm, '<h2 style="font-size:16px;font-weight:700;margin:12px 0 6px;">$1</h2>')

  const NAV = [
    {
      id: 'sidebar', name: 'Sidebar', category: 'Navigation',

    {

      defaultProps: { title: 'Token Usage', points: 8, trend: 'up' },
      schema: { properties: { title: { type: 'string' }, points: { type: 'integer' }, trend: { type: 'string' } } },
      render: (p) => {
        const w = 280, h = 100, pad = 8;
        const pts = Array.from({length: p.points}).map((_,i) => ({
          x: pad + (i * (w - 2*pad)) / (p.points - 1),
          y: h - pad - (Math.sin(i*0.7) * 30 + 40 + (p.trend==='up'?i*3:-i*3)),
        }));
        const path = pts.map((pt,i) => (i===0?'M':'L') + pt.x + ',' + pt.y).join(' ');
        const area = path + ` L${pts[pts.length-1].x},${h-pad} L${pts[0].x},${h-pad} Z`;
        return `<div>
          <div style="font-size:11px;color:var(--fg-2);margin-bottom:6px;">${p.title}</div>
          <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
            <defs><linearGradient id="lg${p.points}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
            <path d="${area}" fill="url(#lg${p.points})"/>
            <path d="${path}" stroke="var(--accent)" stroke-width="2" fill="none"/>
            ${pts.map(pt => `<circle cx="${pt.x}" cy="${pt.y}" r="2" fill="var(--accent)"/>`).join('')}
          </svg>
        </div>`;
      },
    },

        const labels = Array.isArray(p.labels) ? p.labels : ['A','B','C'];
        const values = Array.isArray(p.values) ? p.values : [10,20,15];
        const max = Math.max(...values, 1);
        return `<div>
          <div style="font-size:11px;color:var(--fg-2);margin-bottom:8px;">${p.title}</div>
          <div style="display:flex;align-items:flex-end;gap:6px;height:100px;">

              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">

              </div>`).join('')}
          </div>
        </div>`;

    },
    {
      id: 'pie-chart', name: 'Pie Chart', category: 'Data Viz',

        const colors = ['var(--accent)','var(--info)','var(--success)','var(--warn)','var(--danger)'];
        const values = [40, 25, 20, 15];
        const total = values.reduce((a,b) => a+b, 0);
        let offset = 0;
        const radius = 50, cx = 60, cy = 60;
        return `<div style="display:flex;gap:12px;align-items:center;">
          <svg width="120" height="120" viewBox="0 0 120 120">
            ${values.slice(0, p.segments).map((v,i) => {

              const dash = pct * 2 * Math.PI * radius;
              const seg = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${colors[i]}" stroke-width="20" stroke-dasharray="${dash} ${2*Math.PI*radius - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
              offset += dash;
              return seg;
            }).join('')}
          </svg>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="font-size:11px;color:var(--fg-2);margin-bottom:4px;">${p.title}</div>

          <span style="font-family:var(--font-display);font-weight:700;font-size:${fs};color:var(--fg-0);letter-spacing:-0.02em;">${p.text}</span>

  // Register batch 2

  NEXUS.PluginLoader.loadFromObject({
