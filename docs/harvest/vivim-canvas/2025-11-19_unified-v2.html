    <script id="bootloader">
        (function () {
            console.log("[VIVIM] Booting Kernel...");
            window.sys = window.sys || {};

            // --- Intelligent Database (IndexedDB) ---
            const DB_NAME = 'vivim-source';
            const DB_VERSION = 1;
            const STORE_NAME = 'regions';

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = (e) => reject("DB Error: " + e.target.error);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                });
            }

            // --- Hydration Logic ---
            async function hydrate() {
                try {
                    const db = await openDB();
                    console.log("[DB] Connected to Intelligent Database.");

                    // 1. Parse Own Source (The Seed)
                    const htmlContent = document.documentElement.outerHTML;

                    // 2. Check DB State
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    const store = tx.objectStore(STORE_NAME);

                    // Simple "Seed" logic: If DB is empty, populate it. 
                    const countReq = store.count();

                    countReq.onsuccess = () => {
                        if (countReq.result === 0) {
                            console.log("[HYDRATION] DB empty. Seeding from HTML...");
                            // In a real scenario, we would parse the @region tags here.
                            // For now, we store the whole file as 'root' to prove the concept.
                            store.put({ id: 'root', content: htmlContent, timestamp: Date.now() });
                            console.log("[HYDRATION] Seeding complete.");
                        } else {
                            console.log("[HYDRATION] DB exists. System is alive.");
                        }
                    };

                } catch (e) {
                    console.error("[HYDRATION] Failed:", e);
                }
            }

            // Start Hydration
            hydrate();

            // Error Trap
            window.onerror = function (msg, url, line, col, error) {
                console.error("[KERNEL PANIC]", { msg, line, error });
                return false;
            };
        })();
    </script>

    <script id="kernel-core">
        (function () {
            // --- Event Bus ---
            const listeners = new Map();

            window.sys.on = (event, callback) => {
                if (!listeners.has(event)) listeners.set(event, new Set());
                listeners.get(event).add(callback);
                return () => listeners.get(event).delete(callback);
            };

            window.sys.emit = (event, payload) => {
                // console.debug(`[BUS] ${event}`, payload);
                if (listeners.has(event)) {
                    listeners.get(event).forEach(cb => {
                        try { cb(payload); } catch (e) { console.error(e); }
                    });
                }
            };

            // --- State Store (Simple Proxy) ---
            const stateTarget = {
                version: window.VIVIM_MANIFEST.version,
                activePlugin: null
            };

            window.sys.state = new Proxy(stateTarget, {
                set(target, prop, value) {
                    target[prop] = value;
                    window.sys.emit('state:changed', { prop, value });
                    return true;
                }
            });

            // --- Plugin Loader ---
            window.sys.plugins = new Map();
            window.sys.registerPlugin = (name, initFn) => {
                console.log(`[PLUGIN] Registering: ${name}`);
                try {
                    const api = initFn(window.sys);
                    window.sys.plugins.set(name, api);
                    window.sys.emit('plugin:loaded', { name });
                } catch (e) {
                    console.error(`[PLUGIN] Failed to load ${name}`, e);
                }
            };

            console.log("[VIVIM] Kernel Ready.");
            window.sys.emit('kernel:ready');
        })();
    </script>

    <script id="system-debug">
        (function () {
            window.sys.debug = {
                logs: [],
                MAX_LOGS: 100,

                init() {
                    console.log("[DEBUG] Initializing Error Logger...");

                    // Capture Global Errors
                    window.onerror = (msg, url, line, col, error) => {
                        this.log({ type: 'error', msg, url, line, col, stack: error?.stack });
                        return false; // Let default handler run too
                    };

                    // Capture Promise Rejections
                    window.onunhandledrejection = (e) => {
                        this.log({ type: 'rejection', msg: e.reason });
                    };
                },

                log(errorObj) {
                    const entry = {
                        timestamp: Date.now(),
                        ...errorObj
                    };
                    this.logs.push(entry);
                    if (this.logs.length > this.MAX_LOGS) this.logs.shift();

                    console.warn("[AUTO-DEBUG] Error Logged:", entry);

                    // Auto-Repair Trigger (Stub)
                    if (this.logs.length % 5 === 0) {
                        this.attemptAutoRepair();
                    }
                },

                attemptAutoRepair() {
                    console.log("[AUTO-DEBUG] Analyzing recent errors for patterns...");
                    // Future: Send logs to LLM for analysis
                },

                getLogs() {
                    return this.logs;
                }
            };

            window.sys.debug.init();
        })();
    </script>

    <script id="system-identity">
        (function () {
            const DB_NAME = 'vivim-identity';
            const STORE_NAME = 'keys';

            // Helper to get DB
            function getDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = e => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => reject(e);
                });
            }

            window.sys.identity = {
                profile: null,
                keyPair: null,

                async init() {
                    console.log("[IDENTITY] Initializing...");
                    const db = await getDB();
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get('main');

                    return new Promise((resolve) => {
                        req.onsuccess = async () => {
                            if (req.result) {
                                console.log("[IDENTITY] Profile loaded.");
                                this.profile = req.result.profile;
                                this.keyPair = req.result.keyPair;
                            } else {
                                console.log("[IDENTITY] No profile found. Creating new...");
                                await this.create();
                            }
                            window.sys.emit('identity:ready', this.profile);
                            resolve(this.profile);
                        };
                    });
                },

                async create(handle = "User-" + Math.floor(Math.random() * 10000)) {
                    const keyPair = await window.crypto.subtle.generateKey(
                        { name: "ECDH", namedCurve: "P-256" },
                        true, ["deriveKey", "deriveBits"]
                    );

                    const profile = {
                        id: crypto.randomUUID(),
                        handle: handle,
                        created: Date.now(),
                        publicKey: await window.crypto.subtle.exportKey("jwk", keyPair.publicKey)
                    };

                    const db = await getDB();
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put({
                        id: 'main',
                        profile: profile,
                        keyPair: keyPair
                    });

                    this.profile = profile;
                    this.keyPair = keyPair;
                    console.log("[IDENTITY] Created:", profile.handle);
                    window.sys.emit('identity:created', profile);
                    return profile;
                },

                getPublicKey() {
                    return this.profile ? this.profile.publicKey : null;
                }
            };

            window.sys.identity.init();
        })();
    </script>

    <script id="system-net">
        (function () {
            const signal = new BroadcastChannel('vivim-signal');
            const peers = new Map();

            window.sys.net = {
                peers: peers,

                init() {
                    console.log("[NET] Initializing P2P Layer...");
                    signal.onmessage = async (e) => {
                        const { type, sender, target, payload } = e.data;
                        const myId = window.sys.identity.profile?.id;

                        if (target && target !== myId) return;
                        if (sender === myId) return;

                        console.log(`[NET] Signal ${type} from ${sender}`);

                        switch (type) {
                            case 'offer': await this.handleOffer(sender, payload); break;
                            case 'answer': await this.handleAnswer(sender, payload); break;
                            case 'candidate': await this.handleCandidate(sender, payload); break;
                            case 'announce':
                                console.log(`[NET] Peer Discovered: ${sender}`);
                                window.sys.emit('net:peer-discovered', { id: sender });
                                break;
                        }
                    };
                    setTimeout(() => { this.announce(); }, 1000);
                },

                announce() {
                    const myId = window.sys.identity.profile?.id;
                    if (myId) signal.postMessage({ type: 'announce', sender: myId });
                },

                async connect(targetId) {
                    const myId = window.sys.identity.profile.id;
                    console.log(`[NET] Connecting to ${targetId}...`);

                    const conn = new RTCPeerConnection();
                    const dc = conn.createDataChannel("vivim-data");

                    this.setupDC(dc, targetId);
                    this.setupConn(conn, targetId);

                    peers.set(targetId, { conn, dc });

                    const offer = await conn.createOffer();
                    await conn.setLocalDescription(offer);

                    signal.postMessage({ type: 'offer', sender: myId, target: targetId, payload: offer });
                },

                async handleOffer(senderId, offer) {
                    const myId = window.sys.identity.profile.id;
                    const conn = new RTCPeerConnection();

                    conn.ondatachannel = (e) => { this.setupDC(e.channel, senderId); };
                    this.setupConn(conn, senderId);

                    peers.set(senderId, { conn });

                    await conn.setRemoteDescription(offer);
                    const answer = await conn.createAnswer();
                    await conn.setLocalDescription(answer);

                    signal.postMessage({ type: 'answer', sender: myId, target: senderId, payload: answer });
                },

                async handleAnswer(senderId, answer) {
                    const peer = peers.get(senderId);
                    if (peer) await peer.conn.setRemoteDescription(answer);
                },

                async handleCandidate(senderId, candidate) {
                    const peer = peers.get(senderId);
                    if (peer) await peer.conn.addIceCandidate(candidate);
                },

                setupConn(conn, peerId) {
                    const myId = window.sys.identity.profile.id;
                    conn.onicecandidate = (e) => {
                        if (e.candidate) {
                            signal.postMessage({ type: 'candidate', sender: myId, target: peerId, payload: e.candidate });
                        }
                    };
                    conn.onconnectionstatechange = () => {
                        console.log(`[NET] Connection to ${peerId}: ${conn.connectionState}`);
                        window.sys.emit('net:connection-change', { peerId, state: conn.connectionState });
                    };
                },

                setupDC(dc, peerId) {
                    dc.onopen = () => {
                        console.log(`[NET] DataChannel OPEN with ${peerId}`);
                        window.sys.emit('net:connected', { peerId });
                        const peer = peers.get(peerId);
                        if (peer) peer.dc = dc;
                    };
                    dc.onmessage = (e) => {
                        console.log(`[NET] Message from ${peerId}:`, e.data);
                        window.sys.emit('net:message', { peerId, data: e.data });
                    };
                },

                send(peerId, data) {
                    const peer = peers.get(peerId);
                    if (peer && peer.dc && peer.dc.readyState === 'open') {
                        peer.dc.send(data);
                    } else {
                        console.warn(`[NET] Cannot send to ${peerId} (Not connected)`);
                    }
                },

                broadcast(data) {
                    peers.forEach(({ dc }) => {
                        if (dc && dc.readyState === 'open') dc.send(data);
                    });
                }
            };

            window.sys.on('identity:ready', () => { window.sys.net.init(); });
        })();
    </script>
    <!-- @end: system/net -->
