name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VIVIM_REPO_URL: ${{ secrets.VIVIM_REPO_URL }}
      VIVIM_PRODUCTION_HOST: ${{ secrets.VIVIM_PRODUCTION_HOST }}
      VIVIM_DEPLOY_USER: ${{ secrets.VIVIM_DEPLOY_USER }}
      VIVIM_SSH_PORT: ${{ secrets.VIVIM_SSH_PORT }}
      VIVIM_SSH_KEY_PATH: ${{ secrets.VIVIM_SSH_KEY_PATH }}
      VIVIM_DEPLOY_PATH: ${{ secrets.VIVIM_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec brakeman -z --exit-on-warn
      - run: bundle exec bundle-audit check --update
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VIVIM_SSH_KEY }}" > ~/.ssh/vivim_deploy
          chmod 600 ~/.ssh/vivim_deploy
          ssh-keyscan -p ${{ secrets.VIVIM_SSH_PORT }} ${{ secrets.VIVIM_PRODUCTION_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy
        run: bundle exec cap production deploy
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://vivim.net/up | grep -q ok
