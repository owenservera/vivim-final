# lefthook.yml — Git hooks for vivim-final
# Install: bun x lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.ts"
      run: bun x @biomejs/biome lint {staged_files} || true
    format:
      glob: "*.{js,ts,json,md}"
      run: bun x @biomejs/biome check --write {staged_files} || true
    guard:
      # Refuse to commit while servers run (orphan risk) or a migration is pending.
      run: bun run devops runtime-test guard || true
    typecheck:
      glob: "*.ts"
      # Background-only: logs errors but never blocks commit.
      run: bun run typecheck 2>&1 || true

pre-push:
  commands: {}
