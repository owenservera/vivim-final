# lefthook.yml — Git hooks for vivim-final
# Install: bunx lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,json,md}"
      run: bun run lint
    format:
      glob: "*.{js,ts,json,md}"
      run: bun run format
    typecheck:
      glob: "*.ts"
      run: bun run typecheck

pre-push:
  commands:
    test:
      run: bun test
