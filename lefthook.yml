# lefthook.yml — Git hooks for vivim-final
# Install: bunx lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.ts"
      run: bunx @biomejs/biome lint {staged_files}
    format:
      glob: "*.{js,ts,json,md}"
      run: bunx @biomejs/biome check --write {staged_files}
    typecheck:
      glob: "*.ts"
      run: bun run typecheck
    invariants:
      glob: "src/engines/*.ts"
      run: bun run devops invariants check --category B

pre-push:
  commands:
    test:
      run: bun test
