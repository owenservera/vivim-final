# lefthook.yml — Git hooks for vivim-final
# Install: bun x lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.ts"
      run: bun x @biomejs/biome lint {staged_files}
    format:
      glob: "*.{js,ts,json,md}"
      run: bun x @biomejs/biome check --write {staged_files}
    typecheck:
      glob: "*.ts"
      run: bun run typecheck
    invariants:
      glob: "src/engines/*.ts"
      run: bun run devops invariants check --category B
    guard:
      # Refuse to commit while servers run (orphan risk) or a migration is pending.
      run: bun run devops runtime-test guard

pre-push:
  commands:
    test:
      run: bun test
    audit:
      # Block pushes on P0/P1 source findings.
      run: bun run devops audit-code standard
