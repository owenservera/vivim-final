# Vivim Canvas — User Configuration
# Override any field below; defaults are applied for omitted keys.

schema = "vivim.canvas.config/v1"
theme = "auto"

[palette]
background = "#fafaf9"
surface = "#ffffff"
surfaceMuted = "#f5f5f4"
border = "#e7e5e4"
text = "#1c1917"
textMuted = "#78716c"
accent = "#0f172a"

[palette.nodeByCategory]
Security = "#e11d48"
"Code Quality" = "#d97706"
Reliability = "#0284c7"
"Web Presence" = "#7c3aed"
"UX & Features" = "#059669"

[palette.edgeByKind]
"depends-on" = "#0284c7"
conflicts = "#e11d48"
relates = "#78716c"
references = "#7c3aed"

[grid]
style = "dots"
size = 24
color = "rgba(0,0,0,0.08)"
colorMajor = "rgba(0,0,0,0.16)"
majorEvery = 8

[snap]
enabled = true
gridSize = 24
toNodes = true
threshold = 8

[zoom]
min = 0.05
max = 8
wheelMode = "cmd-scroll"
invertDirection = false
smoothingMs = 120

[pan]
wheelMode = "drag"
invertDirection = false
smoothingMs = 80

[nodes]
defaultSize = "comfortable"
fontFamily = "Inter, system-ui, sans-serif"
fontSize = 14
borderRadius = 12
shadow = true

[nodes.compact]
width = 200
height = 120

[nodes.comfortable]
width = 320
height = 200

[nodes.spacious]
width = 480
height = 280

[edges]
arrowhead = "triangle"
width = 2
curved = true
labelBackground = true

[keyboard]
mode = "modal"
leaderKey = "<space>"
modalIndicator = true

[keyboard.bindings]
"node.delete" = "dd"
"node.yank" = "yy"
"node.paste" = "p"
"node.connect" = "c"
"node.group" = "g"
"view.zoom-in" = "+"
"view.zoom-out" = "-"
"view.fit" = "zf"
"view.find" = "<cmd-k>"
"insert.note" = "i"
"insert.below" = "o"
"insert.above" = "O"
"command.open" = ":"
"bookmark.set" = "m"
"bookmark.goto" = "'"

[persistence]
autosaveMs = 500
format = "json"
location = "indexeddb"
versionHistory = 50

[collaboration]
enabled = false
presence = true

[performance]
virtualizeOffscreen = true
offscreenMargin = 200
maxNodesPerFrame = 500
