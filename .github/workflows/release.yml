name: Release

# Session 2 (2026-08-07): Rewrote release workflow.
#
# The previous workflow built a Windows installer via Tauri scripts that were
# removed in session 1 (scripts/tauri/ was gitignored). This new workflow:
#   - Builds the backend with tsup
#   - Builds the frontend with `next build` (standalone output)
#   - Builds a Docker image (multi-stage Dockerfile at repo root)
#   - Pushes the image to ghcr.io/<repo>:<version>
#   - Creates a GitHub Release with the image digest + zip artifact
#
# The Tauri/NSIS desktop installer is owned by the downstream Tauri shell repo
# (per session 1 ADR). This workflow does not produce a Windows .exe.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun x prisma generate

      - name: Build backend
        run: bun run build

      - name: Build frontend
        run: cd frontend && bun run build

      - name: Generate OpenAPI spec
        run: bun run docs:openapi

      - name: Generate user manual
        run: bun run docs:manual

      - name: Package source zip
        run: |
          # Exclude heavy/regenerable dirs from the release zip
          mkdir -p /tmp/release
          tar --exclude='node_modules' --exclude='.next' --exclude='dist' \
              --exclude='prisma/dev.db' --exclude='prisma/*.db-journal' \
              --exclude='.git' --exclude='.runtime' \
              -czf /tmp/release/vivim-final-${{ github.event.inputs.version || github.ref_name }}.tar.gz \
              -C "$(pwd)" .
          ls -lh /tmp/release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.inputs.prerelease }}
            type=raw,value=${{ github.event.inputs.version || github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: vivim-final v${{ steps.version.outputs.version }}
          body: |
            ## vivim-final v${{ steps.version.outputs.version }}

            ### Container image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            docker run -p 9420:9420 -p 3000:3000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```

            Or run with docker-compose — see [`docs/runbooks/DEPLOY.md`](https://github.com/${{ github.repository }}/blob/main/docs/runbooks/DEPLOY.md).

            ### Source

            Download `vivim-final-${{ steps.version.outputs.version }}.tar.gz` below and extract, then:

            ```bash
            bun install
            cd frontend && bun install && cd ..
            bun x prisma generate
            bun x prisma migrate deploy
            bun run dev
            ```

            ### What's new

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full change record.

            ### Documentation

            - [Architecture](https://github.com/${{ github.repository }}/blob/main/docs/architecture/OVERVIEW.md)
            - [API reference](https://github.com/${{ github.repository }}/blob/main/docs/api/v11-universal-api.yaml)
            - [User manual](https://github.com/${{ github.repository }}/blob/main/docs/manual/v11-user-manual.md)
            - [Deploy runbook](https://github.com/${{ github.repository }}/blob/main/docs/runbooks/DEPLOY.md)
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            /tmp/release/vivim-final-*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd frontend && npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          cd .. && npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Commit version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --tags
