name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd frontend && bun install
          cd .. && bun install

      - name: Typecheck
        run: |
          cd frontend && bunx tsc --noEmit

      - name: Lint
        run: |
          cd frontend && bun run lint

      - name: Unit Tests
        run: |
          cd frontend && bun test tests/unit/

      - name: Integration Tests
        run: |
          cd frontend && bun test tests/integration/

      - name: Build
        run: |
          cd frontend && bun run build

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: false  # Enable when Playwright configured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: |
          cd frontend && bun install

      - name: Install Playwright
        run: |
          cd frontend && bunx playwright install --with-deps chromium

      - name: Start Backend
        run: |
          cd .. && bun run src/server/index.ts &
          sleep 10

      - name: Start Frontend
        run: |
          cd frontend && bun run build && bun run start &
          sleep 10

      - name: Run E2E Tests
        run: |
          cd frontend && bun test tests/e2e/

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/

---