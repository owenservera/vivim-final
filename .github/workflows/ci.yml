name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend quality gate ──────────────────────────────────────────────────
  backend:
    name: Backend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun x prisma generate

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test tests/unit/ --exclude 'docs/**'

      - name: Architecture tests
        run: bun test tests/arch/ --exclude 'docs/**'

      - name: Build
        run: bun run build

      - name: Generate OpenAPI spec
        run: bun run docs:openapi

      - name: Generate user manual
        run: bun run docs:manual

      - name: Verify cross-surface parity
        run: bun run devops verify-cross-surface || true

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/

  # ── Frontend quality gate ─────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Typecheck
        run: cd frontend && bunx tsc --noEmit

      - name: Lint
        run: cd frontend && bun run lint

      - name: Unit tests
        run: cd frontend && bun test tests/unit/ || true

      - name: Build
        run: cd frontend && bun run build

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/.next/

  # ── E2E (disabled until Playwright is configured) ─────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    if: false  # Enable when Playwright is configured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: |
          cd frontend && bun install
          cd .. && bun install

      - name: Install Playwright
        run: cd frontend && bunx playwright install --with-deps chromium

      - name: Start backend
        run: |
          bun run src/cli/index.ts serve &
          sleep 10

      - name: Start frontend
        run: |
          cd frontend && bun run build && bun run start &
          sleep 10

      - name: Run E2E tests
        run: cd frontend && bun test tests/e2e/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
